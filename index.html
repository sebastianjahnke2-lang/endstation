        }, true);
      }
      rede = null;
    } else if (e.typ === 'tod') {
      const uebrig = WAGENZAHL - e.wagenNr;
      const text = uebrig === 1 ? TEXTE.ende.einWagen : fuelle(TEXTE.ende.mehrereWagen, { n: TEXTE.zahlwort[uebrig] });
      zeigeKarte('tod', text.split(' / '), jetzt, 280);
    }
  }

  // Nimmt die Ereignisse eines Zugs entgegen und verteilt sie auf die nächsten Augenblicke.
  function spiele(ereignisse, jetzt) {
    rede = null; // der Satz des Kontrolleurs verschwindet mit der nächsten Eingabe
    const phasen = [[], [], []];
    for (const e of ereignisse) phasen[e.phase].push(e);
    let zeit = jetzt;
    for (let p = 0; p < 3; p++) {
      if (!phasen[p].length) continue;
      wartend.push({ zeit, liste: phasen[p] });
      const nurWarten = p === 0 && phasen[p].every((e) => e.typ === 'warten' || e.typ === 'ungueltig');
      zeit += nurWarten ? 30 : p === 0 ? 100 : p === 1 ? 125 : 115;
    }
    wartend.push({ zeit, liste: null });
    arbeiteAb(jetzt);
  }

  function arbeiteAb(jetzt) {
    while (wartend.length && wartend[0].zeit <= jetzt) {
      const dran = wartend[0];
      if (dran.liste) {
        wartend.shift();
        for (const e of dran.liste) wendeAn(e, jetzt);
        continue;
      }
      // der Abgleich am Ende wartet, bis keine Bewegung mehr läuft
      if (laeufer.some((l) => !l.bleibt)) break;
      wartend.shift();
      gleicheAb();
    }
  }

  // Alles, was noch läuft, sofort zu Ende bringen. Treffer und Aufblitzen laufen weiter.
  function beschleunige(jetzt) {
    for (const dran of wartend) if (dran.liste) for (const e of dran.liste) wendeAn(e, jetzt);
    wartend = [];
    for (const l of laeufer) if (!l.bleibt) l.schritt(1);
    laeufer = laeufer.filter((l) => l.bleibt);
    if (z) gleicheAb();
  }

  function neueFahrt(zustand, jetzt) {
    z = zustand;
    wartend = [];
    laeufer = laeufer.filter((l) => l.bleibt);
    geister = [];
    blitze = [];
    bild.gegner = [];
    bild.tuer = 0;
    bild.spalt = 0;
    rede = null;
    altesWagenbild = null;
    bild.wagenNr = -1;
    gleicheAb();
    if (karte) karte.geht = jetzt;
  }

  // ---------------------------------------------------------------- Lichter draußen

  function neuesLicht(seite, fern, fest) {
    const warm = fest || Math.random() < 0.78;
    lichter.push({
      seite,
      fern,
      ort: fern ? 0.55 + Math.random() * 0.45 : 0.3 + Math.random() * 0.5,
      y: -60,
      tempo: fern ? 34 + Math.random() * 30 : fest ? 340 : 250 + Math.random() * 130,
      groesse: fern ? 3 + Math.random() * 3 : fest ? 30 : 16 + Math.random() * 20,
      hell: fern ? 0.5 + Math.random() * 0.4 : fest ? 1 : 0.55 + Math.random() * 0.45,
      farbe: warm ? '255, 205, 140' : '175, 205, 255',
      zug: fern ? 0 : 0.7,
    });
  }

  function bewegeLichter(dt) {
    const fluss = bild.ruhe >= RUHE_VOLL && !karte;
    const bremse = ruhig ? 0.2 : 1;
    for (const l of lichter) l.y += l.tempo * dt * bremse;
    lichter = lichter.filter((l) => l.y < layout.hoehe + 80);
    fernIn -= dt * bremse;
    if (fernIn <= 0) {
      neuesLicht(Math.random() < 0.5 ? -1 : 1, true, false);
      fernIn = 0.7 + Math.random() * 1.4;
    }
    if (fluss && !ruhig) {
      // im Takt der Schienen: links, kurz darauf rechts, dann Pause
      const vorher = taktUhr;
      taktUhr = (taktUhr + dt) % TAKT;
      if (taktUhr < vorher) {
        neuesLicht(-1, false, true);
        if (melder.takt) melder.takt(0);
      }
      if (vorher < 0.2 && taktUhr >= 0.2) {
        neuesLicht(1, false, true);
        if (melder.takt) melder.takt(1);
      }
    } else {
      taktUhr = TAKT - 0.05;
      lichtIn -= dt * bremse;
      if (lichtIn <= 0) {
        neuesLicht(Math.random() < 0.5 ? -1 : 1, false, false);
        lichtIn = 0.5 + Math.random() * 1.7;
      }
    }
  }

  // ---------------------------------------------------------------- Zeichnen

  function maleRot(t) {
    const { boden, s } = layout;
    const puls = ruhig ? 0.5 : (Math.sin((t * Math.PI * 2) / 1.15) + 1) / 2;
    const gemalt = new Map();
    for (const g of bild.gegner) {
      if (!g.ansage) continue;
      g.ansage.forEach((f, i) => {
        const nr = feldNr(f.x, f.y);
        const vor = i === 0 ? g : g.ansage[i - 1];
        const eintrag = { f, zeigen: g.zeigen, dx: Math.sign(f.x - vor.x), dy: Math.sign(f.y - vor.y), pfeil: g.typ !== 'pendler' };
        if (!gemalt.has(nr) || gemalt.get(nr).zeigen < eintrag.zeigen) gemalt.set(nr, eintrag);
      });
    }
    for (const { f, zeigen, dx, dy, pfeil } of gemalt.values()) {
      const x = boden.x + f.x * s;
      const y = boden.y + f.y * s;
      stift.fillStyle = `rgba(232, 64, 47, ${(0.24 + 0.2 * puls) * zeigen})`;
      rundesRechteck(stift, x + 2, y + 2, s - 4, s - 4, s * 0.1);
      stift.fill();
      stift.strokeStyle = `rgba(255, 122, 99, ${(0.6 + 0.35 * puls) * zeigen})`;
      stift.lineWidth = 2;
      rundesRechteck(stift, x + 3, y + 3, s - 6, s - 6, s * 0.09);
      stift.stroke();
      if (pfeil && (dx || dy)) {
        // kleiner Winkel: aus dieser Richtung kommt er
        const cx = x + s / 2;
        const cy = y + s / 2;
        const a = s * 0.1;
        stift.strokeStyle = `rgba(255, 190, 170, ${0.55 * zeigen})`;
        stift.lineWidth = Math.max(1.5, s * 0.035);
        stift.lineCap = 'round';
        stift.lineJoin = 'round';
        stift.beginPath();
        stift.moveTo(cx - dx * a - dy * a, cy - dy * a - dx * a);
        stift.lineTo(cx + dx * a, cy + dy * a);
        stift.lineTo(cx - dx * a + dy * a, cy - dy * a + dx * a);
        stift.stroke();
      }
    }
    for (const b of blitze) {
      for (const f of b.felder) {
        stift.fillStyle = `rgba(255, 214, 200, ${0.6 * b.staerke})`;
        rundesRechteck(stift, boden.x + f.x * s + 2, boden.y + f.y * s + 2, s - 4, s - 4, s * 0.1);
        stift.fill();
      }
    }
  }

  function istVorn(g) {
    if (g.typ !== 'gruppe') return false;
    return !bild.gegner.some((a) => a.typ === 'gruppe' && a.gruppe === g.gruppe && a.rang < g.rang);
  }

  function maleGegner(g, t, alpha, oy) {
    const { boden, s } = layout;
    const cx = boden.x + (g.px + g.sx + 0.5) * s;
    const fy = boden.y + (g.py + g.sy + 0.86) * s + oy;
    let neigung = 0;
    if (g.typ === 'draengler' && g.ansage && g.ansage.length) neigung = Math.sign(g.ansage[0].x - g.x) * 0.55;
    // Der Kontrolleur hält dem, der in seiner Nähe ist, die Zange hin. Sie sinkt, je länger man ruhig steht.
    let zeigt = null;
    let heben = 0;
    if (g.typ === 'kontrolleur') {
      const p = bild.spieler;
      const nah = Math.max(Math.abs(p.x - g.x), Math.abs(p.y - g.y)) === 1;
      const ziel = g.ansage && g.ansage.length ? g.ansage[0] : nah ? p : null;
      if (ziel) zeigt = { x: ziel.x - g.x, y: ziel.y - g.y };
      heben = g.ansage ? 1 : nah ? 1 - ((g.ruhig || 0) / GEGNERWERTE.kontrolleur.geduld) * 0.85 : 0;
    }
    maleFigur(stift, g.typ, cx, fy, s, {
      zeigt,
      heben,
      winkt: g.winkt || 0,
      t,
      takt: g.id * 1.7,
      alpha,
      blitz: g.blitz,
      ruhig,
      neigung,
      pausiert: g.pausiert && !g.ansage,
      vorderster: istVorn(g),
      erschoepft: g.erschoepft,
      ansagend: !!g.ansage,
    });
    if (alpha > 0.5) {
      const kopf = g.typ === 'gruppe' ? 0.74 : g.typ === 'draengler' ? (g.erschoepft ? 0.74 : 0.94) : g.typ === 'kontrolleur' ? 0.94 : 0.86;
      malePunkte(stift, cx, fy - s * kopf, s, g.hp, GEGNERWERTE[g.typ].hp);
    }
  }

  function maleSchild(text, cx, cy) {
    const raster = 2;
    const b = textBreite(text) * raster + 14;
    const h = ZEILENHOEHE * raster + 10;
    const x = begrenze(Math.round(cx - b / 2), 6, layout.breite - b - 6);
    const y = Math.round(cy - h / 2);
    stift.fillStyle = 'rgba(13, 17, 25, 0.94)';
    rundesRechteck(stift, x, y, b, h, 6);
    stift.fill();
    stift.strokeStyle = FARBE.tafelRand;
    stift.lineWidth = 1;
    rundesRechteck(stift, x + 0.5, y + 0.5, b - 1, h - 1, 6);
    stift.stroke();
    const feld = neuesPunktfeld(textBreite(text), ZEILENHOEHE);
    schreibe(feld, text, 0, 0);
    zeichnePunktfeld(stift, feld, x + 7, y + 6, raster, FARBE.bernstein, null);
  }

  function figurAuf(x, y) {
    const p = bild.spieler;
    return (p.x === x && p.y === y) || bild.gegner.some((g) => g.x === x && g.y === y);
  }

  // Das Schild steht über dem Feld. Steht dort schon jemand, weicht es nach unten aus.
  function schildAn(feld, hoch) {
    const { boden, s } = layout;
    const cx = boden.x + (feld.x + 0.5) * s;
    const obenFrei = feld.y > 0 && !figurAuf(feld.x, feld.y - 1);
    const untenFrei = feld.y < 7 && !figurAuf(feld.x, feld.y + 1);
    if (obenFrei || !untenFrei) return { cx, cy: boden.y + feld.y * s - s * hoch };
    return { cx, cy: boden.y + (feld.y + 1) * s + s * 0.32 };
  }

  // Höchstens ein Hinweis, und nur in dem Augenblick, in dem die Lage zu sehen ist.
  function maleHinweis() {
    if (!hinweis || karte || bild.schwenk > 0.01) return;
    const p = bild.spieler;
    const markiert = bild.gegner.some((g) => g.ansage && g.ansage.some((f) => f.x === p.x && f.y === p.y));
    // den Kontrolleur schlägt das Spiel nicht vor
    const nachbar = bild.gegner.find((a) => a.typ !== 'kontrolleur' && Math.abs(a.x - p.x) + Math.abs(a.y - p.y) === 1);
    if (hinweis.wischen && bild.zug === 0) {
      const ort = schildAn(p, 0.42);
      maleSchild(TEXTE.hinweis[hinweis.wischen], ort.cx, ort.cy);
    } else if (hinweis.ausweichen && markiert) {
      const ort = schildAn(p, 0.6);
      maleSchild(TEXTE.hinweis.ausweichen, ort.cx, ort.cy);
    } else if (hinweis.anrempeln && nachbar && !markiert) {
      const ort = schildAn(nachbar, 0.4);
      maleSchild(TEXTE.hinweis.anrempeln, ort.cx, ort.cy);
    }
  }

  function maleWelt(t, jetzt) {
    const { boden, rumpf, s, wagenlaenge } = layout;
    const oy = -bild.schwenk * wagenlaenge;
    if (altesWagenbild && bild.schwenk > 0) {
      const alt = (1 - bild.schwenk) * wagenlaenge;
      stift.drawImage(altesWagenbild, rumpf.x, rumpf.y + alt, rumpf.b, rumpf.h);
      maleTuer(stift, layout, 1, t, 0, alt);
    }
    if (wagenbild) stift.drawImage(wagenbild, rumpf.x, rumpf.y + oy, rumpf.b, rumpf.h);
    let zucken = 0;
    const seit = jetzt - wirkung.tuerZu;
    if (seit < 160 && !ruhig) zucken = Math.sin(seit / 12) * 1.5 * (1 - seit / 160);
    maleTuer(stift, layout, bild.tuer, t, zucken, oy, bild.spalt);

    const imWechsel = bild.schwenk > 0.01;
    if (!imWechsel) {
      maleLichtschein(stift, layout, lichter, klar);
      maleRot(t);
      maleTuerlicht(stift, layout, bild.tuer, t, ruhig);
    }

    // Figuren von hinten nach vorn
    const p = bild.spieler;
    const reihe = [];
    for (const g of bild.gegner) reihe.push({ y: g.py + g.sy, g, alpha: 1 });
    for (const geist of geister) reihe.push({ y: geist.g.py + geist.g.sy, g: geist.g, alpha: geist.alpha });
    reihe.push({ y: p.py + p.sy + 0.001, spieler: true });
    reihe.sort((a, b) => a.y - b.y);
    for (const eintrag of reihe) {
      if (!eintrag.spieler) {
        maleGegner(eintrag.g, t, eintrag.alpha, oy);
        continue;
      }
      const cx = boden.x + (p.px + p.sx + 0.5) * s;
      const fy = boden.y + (p.py + p.sy + 0.86 - p.hupf) * s;
      if (klar > 0.02) {
        const hof = stift.createRadialGradient(cx, fy, 0, cx, fy, s * 0.62);
        hof.addColorStop(0, `rgba(255, 217, 160, ${0.26 * klar})`);
        hof.addColorStop(1, 'rgba(255, 217, 160, 0)');
        stift.fillStyle = hof;
        stift.fillRect(cx - s * 0.7, fy - s * 0.4, s * 1.4, s * 0.8);
      }
      const tot = karte && karte.art === 'tod';
      maleFigur(stift, 'spieler', cx, fy, s, { t, takt: 0, ruhig, blitz: p.blitz, fluss: klar > 0.5, alpha: tot ? 0.45 : 1 });
      const markiert = bild.gegner.some((g) => g.ansage && g.ansage.some((f) => f.x === p.x && f.y === p.y));
      if (markiert && !imWechsel && !karte) {
        const wippen = ruhig ? 0 : Math.sin(t * 7) * s * 0.025;
        maleAchtung(stift, cx, fy - s * 0.84 + wippen, s);
      }
    }
    if (rede && !karte && !imWechsel) maleRede(TEXTE.kontrolleur.satz, rede, oy);
    maleHinweis();
  }

  // Ein Schild über dem Kopf dessen, der spricht, mit einer Spitze zu ihm hin.
  function maleRede(text, feld, oy) {
    const { boden, s } = layout;
    const cx = boden.x + (feld.x + 0.5) * s;
    const h = ZEILENHOEHE * 2 + 10;
    const cy = boden.y + feld.y * s - s * 0.04 - h / 2 + oy;
    maleSchild(text, cx, cy);
    stift.fillStyle = 'rgba(13, 17, 25, 0.94)';
    stift.beginPath();
    stift.moveTo(cx - 6, cy + h / 2 - 1);
    stift.lineTo(cx, cy + h / 2 + 7);
    stift.lineTo(cx + 6, cy + h / 2 - 1);
    stift.closePath();
    stift.fill();
  }

  function zeichne(jetzt) {
    if (!layout || !z) return;
    // Safari ändert die Höhe, wenn seine Leisten kommen und gehen, oft ohne verlässliches Signal.
    if (leinwand.clientWidth && (leinwand.clientWidth !== layout.breite || leinwand.clientHeight !== layout.hoehe)) passeAn();
    const dt = Math.min(0.05, Math.max(0, (jetzt - letzteZeit) / 1000));
    letzteZeit = jetzt;
    const t = jetzt / 1000;

    arbeiteAb(jetzt);
    for (const l of [...laeufer]) {
      const p = l.dauer <= 0 ? 1 : (jetzt - l.start) / l.dauer;
      l.schritt(begrenze(p, 0, 1));
      if (p >= 1) laeufer = laeufer.filter((x) => x !== l);
    }
    const zielKlar = bild.ruhe >= RUHE_VOLL ? 1 : 0;
    klar += (zielKlar - klar) * Math.min(1, dt * 5);
    bewegeLichter(dt);

    stift.setTransform(dichte, 0, 0, dichte, 0, 0);
    stift.globalAlpha = 1;
    stift.globalCompositeOperation = 'source-over';
    stift.fillStyle = FARBE.nacht;
    stift.fillRect(0, 0, layout.breite, layout.hoehe);

    stift.save();
    const seitWackeln = jetzt - wirkung.wackeln;
    if (seitWackeln < 150) {
      const rest = 1 - seitWackeln / 150;
      stift.translate(Math.sin(seitWackeln / 9) * 5 * rest, Math.cos(seitWackeln / 7) * 3 * rest);
    }
    maleLichter(stift, layout, lichter, klar);
    // der Wagen bleibt unter den Anzeigen, auch während er beim Wechsel durchs Bild schiebt
    stift.beginPath();
    stift.rect(-20, layout.status.y + layout.status.h + 3, layout.breite + 40, layout.hoehe);
    stift.clip();
    maleWelt(t, jetzt);
    stift.restore();

    // Dunst und dunkle Ränder; bei voller Ruhe wird das Bild klar
    stift.fillStyle = `rgba(16, 22, 40, ${0.15 * (1 - klar)})`;
    stift.fillRect(0, 0, layout.breite, layout.hoehe);
    stift.globalAlpha = 0.62 - 0.4 * klar;
    stift.drawImage(schleier, 0, 0, layout.breite, layout.hoehe);
    stift.globalAlpha = 1;
    const seitTreffer = jetzt - wirkung.treffer;
    if (seitTreffer < 150 && !ruhig) {
      stift.fillStyle = `rgba(232, 64, 47, ${0.2 * (1 - seitTreffer / 150)})`;
      stift.fillRect(0, 0, layout.breite, layout.hoehe);
    }

    // Anzeigen am Rand
    const { tafel, status } = layout;
    if (tafelbild) stift.drawImage(tafelbild, tafel.x, tafel.y, tafel.b, tafel.h);
    const verlust = begrenze(1 - seitTreffer / 320, 0, 1);
    maleHerzen(stift, status.x, status.y + status.h / 2, bild.herzen, HERZEN_VOLL, verlust);
    const zuwachs = begrenze(1 - (jetzt - wirkung.zuwachs) / 380, 0, 1);
    maleRuhe(stift, status.x + status.b, status.y + status.h / 2, bild.ruhe, RUHE_VOLL, zuwachs);
    const druck = begrenze(1 - (jetzt - wirkung.uhr) / 140, 0, 1);
    maleUhr(stift, layout.uhr, ABFAHRT + bild.zug, druck);
    maleTonknopf(stift, layout.ton, tonAn);

    if (karte) {
      karte.einblenden = begrenze((jetzt - karte.start) / 150, 0, 1);
      if (karte.geht) {
        karte.weg = begrenze((jetzt - karte.geht) / 150, 0, 1);
        if (ruhig) karte.weg = 1;
      }
      if (karte.weg >= 1) karte = null;
      else if (jetzt >= karte.start) maleKarte(stift, layout, karte, t);
    }
  }

  // ---------------------------------------------------------------- Auskunft

  // Was liegt an diesem Bildschirmpunkt?
  function wasLiegtBei(px, py) {
    if (karte && !karte.geht) {
      const w = kartenMasse(layout, karte.art).weiter;
      if (px >= w.x && px <= w.x + w.b && py >= w.y && py <= w.y + w.h) return { art: 'weiter' };
      return { art: 'karte' };
    }
    const nah = (ort, r) => Math.hypot(px - ort.x, py - ort.y) <= r;
    if (nah(layout.uhr, Math.max(KNOPF / 2 + 2, layout.uhr.r + 2))) return { art: 'uhr' };
    if (nah(layout.ton, KNOPF / 2)) return { art: 'ton' };
    const feld = feldBei(layout, px, py);
    if (feld) return { art: 'feld', x: feld.x, y: feld.y };
    return null;
  }

  return {
    passeAn,
    neueFahrt,
    spiele,
    beschleunige,
    zeichne,
    wasLiegtBei,
    melder,
    setzeHinweis: (name) => {
      hinweis = name;
    },
    setzeTon: (an) => {
      tonAn = an;
    },
    zeigtKarte: () => karte !== null && !karte.geht,
    karteBereit: (jetzt) => karte !== null && !karte.geht && jetzt >= karte.start + 120,
    tuerfeld: () => TUERFELD,
  };
}

// --- eingabe.js
// Eingabe: Wischen, Tippen, Tastatur. Meldet nur, was der Mensch getan hat.
// Ein Wisch löst aus, sobald der Finger weit genug gewandert ist, nicht erst beim Loslassen.

const WISCHWEG = 18; // Pixel bis zum Auslösen
const TIPPWEG = 9; // weniger Bewegung gilt als Tippen

const TASTEN = {
  ArrowUp: 'hoch',
  ArrowRight: 'rechts',
  ArrowDown: 'runter',
  ArrowLeft: 'links',
  KeyW: 'hoch',
  KeyD: 'rechts',
  KeyS: 'runter',
  KeyA: 'links',
  Space: 'warten',
};

function wischrichtung(dx, dy) {
  if (Math.abs(dx) > Math.abs(dy)) return dx > 0 ? 'rechts' : 'links';
  return dy > 0 ? 'runter' : 'hoch';
}

// melde: { aktion(name, quelle), tipp(x, y), losgelassen(), karteOffen() }
function verbindeEingabe(flaeche, melde) {
  let finger = null;

  flaeche.addEventListener('pointerdown', (e) => {
    if (finger) return;
    finger = { id: e.pointerId, x: e.clientX, y: e.clientY, erledigt: false };
    if (flaeche.setPointerCapture) {
      try {
        flaeche.setPointerCapture(e.pointerId);
      } catch (fehler) {
        // ohne Fang geht es auch
      }
    }
    e.preventDefault();
  });

  flaeche.addEventListener('pointermove', (e) => {
    if (!finger || e.pointerId !== finger.id || finger.erledigt) return;
    const dx = e.clientX - finger.x;
    const dy = e.clientY - finger.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < WISCHWEG) return;
    finger.erledigt = true;
    melde.aktion(wischrichtung(dx, dy), 'wisch');
  });

  const loslassen = (e) => {
    if (!finger || e.pointerId !== finger.id) return;
    const dx = e.clientX - finger.x;
    const dy = e.clientY - finger.y;
    const fertig = finger.erledigt;
    finger = null;
    if (e.type === 'pointerup') melde.losgelassen();
    if (fertig || e.type !== 'pointerup') return;
    if (Math.hypot(dx, dy) < TIPPWEG) {
      // Der Canvas beginnt nicht immer in der Ecke: Neben Notch und Home-Balken bleibt ein Rand frei.
      const kasten = flaeche.getBoundingClientRect();
      melde.tipp(e.clientX - kasten.left, e.clientY - kasten.top);
    }
    else melde.aktion(wischrichtung(dx, dy), 'wisch'); // ein kurzer Wisch zählt auch
  };
  flaeche.addEventListener('pointerup', loslassen);
  flaeche.addEventListener('pointercancel', loslassen);
  flaeche.addEventListener('contextmenu', (e) => e.preventDefault());

  // Safari auf dem iPhone: kein Gummiband beim Ziehen, kein Zoom mit zwei Fingern oder Doppeltipp.
  const halt = (e) => e.preventDefault();
  document.addEventListener('touchmove', halt, { passive: false });
  document.addEventListener('gesturestart', halt);
  document.addEventListener('gesturechange', halt);
  document.addEventListener('dblclick', halt);
  // Den Ton gibt Safari erst frei, wenn ein Finger den Bildschirm wieder verlässt.
  document.addEventListener('touchend', () => melde.losgelassen(), { passive: true });
  document.addEventListener('click', () => melde.losgelassen());

  window.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const name = TASTEN[e.code] || (e.code === 'Enter' ? 'hoch' : null);
    if (!name) return;
    e.preventDefault();
    if (e.code === 'Enter' && !melde.karteOffen()) return;
    melde.aktion(name, 'taste');
  });
}

// --- speicher.js
// Was das Spiel sich merkt. Safari kann lokale Daten nach einigen Tagen ohne Besuch löschen,
// im privaten Modus fehlt der Speicher ganz. Deshalb liefert ladeStand() immer einen
// vollständigen Stand, auch aus dem Nichts oder aus Unsinn, und Schreiben darf scheitern.

const SCHLUESSEL = 'endstation.1';

function leererStand() {
  return { gelernt: { wischen: false, ausweichen: false, anrempeln: false }, ton: true };
}

// Nimmt nur, was die erwartete Form hat. Alles andere bleibt auf dem Anfangswert.
function bereinigeStand(roh) {
  const stand = leererStand();
  if (!roh || typeof roh !== 'object') return stand;
  if (roh.gelernt && typeof roh.gelernt === 'object') {
    for (const name of Object.keys(stand.gelernt)) stand.gelernt[name] = roh.gelernt[name] === true;
  }
  if (typeof roh.ton === 'boolean') stand.ton = roh.ton;
  return stand;
}

function ladeStand() {
  try {
    return bereinigeStand(JSON.parse(window.localStorage.getItem(SCHLUESSEL)));
  } catch (fehler) {
    return leererStand();
  }
}

function sichereStand(stand) {
  try {
    window.localStorage.setItem(SCHLUESSEL, JSON.stringify(stand));
    return true;
  } catch (fehler) {
    return false; // kein Speicher, kein Problem
  }
}

// --- ton.js
// Ton ist Zugabe: wenige erzeugte Klänge, keine Dateien. Fehlt Web Audio, bleibt es still.
// Er beginnt erst nach der ersten Berührung. Vibration nutzt das Spiel nicht, das iPhone kennt sie im Browser nicht.

function erzeugeTon() {
  let ac = null;
  let haupt = null;
  let rauschen = null;
  let an = true;

  // Darf erst nach einer Eingabe aufgerufen werden, sonst sperrt der Browser den Ton.
  function wecke() {
    if (!an) return;
    try {
      if (!ac) {
        const Klasse = window.AudioContext || window.webkitAudioContext;
        if (!Klasse) return;
        ac = new Klasse();
        haupt = ac.createGain();
        haupt.gain.value = 0.2;
        haupt.connect(ac.destination);
        rauschen = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
        const daten = rauschen.getChannelData(0);
        let wert = 12345;
        for (let i = 0; i < daten.length; i++) {
          wert = (Math.imul(wert, 1664525) + 1013904223) >>> 0;
          daten[i] = wert / 2147483648 - 1;
        }
      }
      // "suspended" vor der ersten Berührung, "interrupted" nach einem Anruf oder App-Wechsel am iPhone
      if (ac.state !== 'running') {
        const versuch = ac.resume();
        if (versuch && versuch.catch) versuch.catch(() => {});
      }
    } catch (fehler) {
      ac = null;
    }
  }

  function klang(von, bis, dauer, laut, form, spaeter) {
    if (!ac || !an) return;
    try {
      const t = ac.currentTime + (spaeter || 0);
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = form || 'sine';
      o.frequency.setValueAtTime(von, t);
      o.frequency.exponentialRampToValueAtTime(Math.max(20, bis), t + dauer);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(laut, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dauer);
      o.connect(g);
      g.connect(haupt);
      o.start(t);
      o.stop(t + dauer + 0.02);
    } catch (fehler) {
      // still weiter
    }
  }

  function hauch(hoehe, dauer, laut, spaeter) {
    if (!ac || !an) return;
    try {
      const t = ac.currentTime + (spaeter || 0);
      const q = ac.createBufferSource();
      const f = ac.createBiquadFilter();
      const g = ac.createGain();
      q.buffer = rauschen;
      f.type = 'bandpass';
      f.frequency.value = hoehe;
      f.Q.value = 0.9;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(laut, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dauer);
      q.connect(f);
      f.connect(g);
      g.connect(haupt);
      q.start(t, (t * 7) % 0.5, dauer + 0.05);
    } catch (fehler) {
      // still weiter
    }
  }

  const KLAENGE = {
    schritt: () => hauch(1100, 0.05, 0.22),
    warten: () => klang(1400, 1300, 0.03, 0.08, 'square'),
    ungueltig: () => klang(130, 110, 0.05, 0.2, 'triangle'),
    schlag: () => {
      klang(170, 70, 0.1, 0.8, 'triangle');
      hauch(500, 0.06, 0.35);
    },
    besiegt: () => klang(392, 262, 0.2, 0.3, 'sine', 0.05),
    treffer: () => {
      klang(120, 45, 0.22, 0.9, 'sawtooth');
      hauch(260, 0.14, 0.5);
    },
    ausgewichen: () => {
      hauch(2200, 0.13, 0.22);
      klang(784, 988, 0.14, 0.14, 'sine', 0.03);
    },
    tuerAuf: () => {
      klang(880, 880, 0.1, 0.25, 'sine');
      klang(1175, 1175, 0.16, 0.25, 'sine', 0.13);
    },
    wagenwechsel: () => hauch(320, 0.24, 0.5),
    tod: () => klang(196, 98, 0.5, 0.4, 'sine', 0.1),
    halt: () => {
      klang(523, 523, 0.3, 0.3, 'sine', 0.1);
      klang(659, 659, 0.3, 0.3, 'sine', 0.38);
      klang(784, 784, 0.5, 0.3, 'sine', 0.66);
    },
  };

  return {
    wecke,
    spiele(ereignisse) {
      const schon = new Set();
      for (const e of ereignisse) {
        const name = e.typ === 'schlag' && e.besiegt ? 'besiegt' : e.typ;
        if (e.typ === 'schlag') KLAENGE.schlag();
        if (KLAENGE[name] && !schon.has(name) && name !== 'schlag') KLAENGE[name]();
        schon.add(name);
      }
    },
    // Schienenstoß im Flusszustand
    takt() {
      hauch(170, 0.07, 0.4);
      klang(72, 50, 0.08, 0.4, 'sine');
    },
    setze(wert) {
      an = wert;
    },
  };
}

// --- main.js
// Einstieg: verbindet Kern, Anzeige, Eingabe, Ton und Speicher.
// Beim Öffnen steht man sofort im ersten Wagen, die erste Eingabe ist schon ein Zug.








const leinwand = document.getElementById('bild');
const anzeige = erzeugeAnzeige(leinwand);
const ton = erzeugeTon();

const stand = ladeStand(); // immer vollständig, auch wenn der Speicher leer, gelöscht oder gesperrt ist

const grobesZeigen = typeof matchMedia === 'function' && matchMedia('(pointer: coarse)').matches;
let mitTasten = !grobesZeigen;
let spiel = null;
let fahrten = 0;

// Zum Nachstellen einer Fahrt: Adresse mit #seed=Zahl
function festerSeed() {
  const fund = /[#&]seed=(\d+)/.exec(window.location.hash);
  return fund ? Number(fund[1]) : null;
}

function zeigeHinweise() {
  const g = stand.gelernt;
  anzeige.setzeHinweis({
    wischen: g.wischen ? null : mitTasten ? 'tasten' : 'wischen',
    ausweichen: !g.ausweichen,
    anrempeln: !g.anrempeln,
  });
}

function starteFahrt(jetzt) {
  const fest = festerSeed();
  const seed = fest !== null ? fest + fahrten : (Date.now() ^ Math.floor(Math.random() * 4294967296)) >>> 0;
  fahrten += 1;
  spiel = erzeugeSpiel(seed);
  anzeige.neueFahrt(spiel.zustand, jetzt);
  zeigeHinweise();
}

function merke(ereignisse) {
  const g = stand.gelernt;
  const vorher = JSON.stringify(g);
  for (const e of ereignisse) {
    if (e.typ === 'schritt' || e.typ === 'schlag' || e.typ === 'warten') g.wischen = true;
    if (e.typ === 'ausgewichen') g.ausweichen = true;
    if (e.typ === 'schlag') g.anrempeln = true;
  }
  if (JSON.stringify(g) !== vorher) {
    sichereStand(stand);
    zeigeHinweise();
  }
}

function gibEin(aktion, quelle) {
  const jetzt = performance.now();
  ton.wecke();
  if (quelle === 'taste' && !mitTasten) {
    mitTasten = true;
    zeigeHinweise();
  }
  if (spiel.zustand.status !== 'faehrt') {
    if (aktion === 'hoch' && anzeige.karteBereit(jetzt)) starteFahrt(jetzt);
    return;
  }
  anzeige.beschleunige(jetzt);
  const ereignisse = spiel.act(aktion);
  if (!ereignisse.length) return;
  anzeige.spiele(ereignisse, jetzt);
  ton.spiele(ereignisse);
  merke(ereignisse);
}

function tippe(x, y) {
  const ziel = anzeige.wasLiegtBei(x, y);
  if (!ziel) return;
  if (ziel.art === 'weiter') {
    gibEin('hoch', 'tipp');
  } else if (ziel.art === 'ton') {
    stand.ton = !stand.ton;
    ton.setze(stand.ton);
    ton.wecke();
    anzeige.setzeTon(stand.ton);
    sichereStand(stand);
  } else if (ziel.art === 'uhr') {
    gibEin('warten', 'tipp');
  } else if (ziel.art === 'feld') {
    const s = spiel.zustand.spieler;
    const dx = ziel.x - s.x;
    const dy = ziel.y - s.y;
    if (dx === 0 && dy === 0) gibEin('warten', 'tipp');
    else if (abstand(ziel, s) === 1) gibEin(dx === 1 ? 'rechts' : dx === -1 ? 'links' : dy === 1 ? 'runter' : 'hoch', 'tipp');
  }
}

function schleife(jetzt) {
  anzeige.zeichne(jetzt);
  window.requestAnimationFrame(schleife);
}

// Nur beim Nachstellen mit festem Seed: Der Zustand lässt sich von außen ablesen, nicht ändern.
if (festerSeed() !== null) window.endstationZustand = () => JSON.stringify(spiel.zustand);

ton.setze(stand.ton);
anzeige.setzeTon(stand.ton);
anzeige.melder.takt = () => ton.takt();
anzeige.passeAn();
starteFahrt(performance.now());
// Manche Browser geben den Ton erst frei, wenn ein Finger losgelassen wurde, nicht schon beim Wischen.
verbindeEingabe(leinwand, { aktion: gibEin, tipp: tippe, losgelassen: () => ton.wecke(), karteOffen: () => anzeige.zeigtKarte() });
for (const anlass of ['resize', 'orientationchange', 'pageshow']) window.addEventListener(anlass, () => anzeige.passeAn());
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => anzeige.passeAn());
window.requestAnimationFrame(schleife);
})();
</script>
