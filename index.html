  stift.fillStyle = '#4a6193';
  rundesRechteck(stift, x + s * 0.36, y + p * 1.3, s * 0.28, s * 0.09, s * 0.04);
  stift.fill();
}

function maleFahrrad(stift, x, y, s) {
  const hinten = [x + s * 0.27, y + s * 0.64];
  const vorn = [x + s * 0.74, y + s * 0.64];
  const r = s * 0.19;
  stift.lineCap = 'round';
  stift.strokeStyle = '#8796ae';
  stift.lineWidth = s * 0.035;
  for (const rad of [hinten, vorn]) {
    kreis(stift, rad[0], rad[1], r);
    stift.stroke();
  }
  const sattel = [x + s * 0.4, y + s * 0.35];
  const lenker = [x + s * 0.66, y + s * 0.33];
  const tretlager = [x + s * 0.47, y + s * 0.64];
  linie(stift, [hinten, sattel, lenker, tretlager, hinten], '#5fa79b', s * 0.04);
  linie(stift, [tretlager, sattel], '#5fa79b', s * 0.04);
  linie(stift, [lenker, vorn], '#5fa79b', s * 0.04);
  linie(stift, [[sattel[0] - s * 0.07, sattel[1] - s * 0.03], [sattel[0] + s * 0.06, sattel[1] - s * 0.03]], '#c9d2de', s * 0.045);
  linie(stift, [[lenker[0] - s * 0.02, lenker[1] - s * 0.08], [lenker[0] + s * 0.09, lenker[1] - s * 0.08]], '#c9d2de', s * 0.04);
  linie(stift, [lenker, [lenker[0] + s * 0.01, lenker[1] - s * 0.08]], '#5fa79b', s * 0.035);
}

function maleKoffer(stift, x, y, s, gross) {
  if (gross) {
    // eine Reisetasche liegt dahinter
    stift.fillStyle = '#3d4d63';
    rundesRechteck(stift, x + s * 0.12, y + s * 0.5, s * 0.5, s * 0.32, s * 0.12);
    stift.fill();
  }
  const kx = x + (gross ? s * 0.34 : s * 0.22);
  const ky = y + s * 0.3;
  const b = s * 0.48;
  const h = s * 0.55;
  linie(stift, [[kx + b * 0.3, ky], [kx + b * 0.3, ky - s * 0.09], [kx + b * 0.7, ky - s * 0.09], [kx + b * 0.7, ky]], '#3a2b20', s * 0.035);
  stift.fillStyle = '#7a5b43';
  rundesRechteck(stift, kx, ky, b, h, s * 0.06);
  stift.fill();
  stift.fillStyle = '#5c4331';
  stift.fillRect(kx + b * 0.2, ky, b * 0.1, h);
  stift.fillRect(kx + b * 0.7, ky, b * 0.1, h);
  stift.fillStyle = '#e9dcc0';
  stift.fillRect(kx + b * 0.42, ky + h * 0.42, b * 0.2, h * 0.14);
}

// Ein Tisch im Speisewagen: Tischtuch, eine Tasse, eine kleine Lampe
function maleTisch(stift, x, y, s) {
  stift.fillStyle = '#5a4636';
  rundesRechteck(stift, x + s * 0.12, y + s * 0.16, s * 0.76, s * 0.68, s * 0.08);
  stift.fill();
  stift.fillStyle = '#efe4cf';
  rundesRechteck(stift, x + s * 0.16, y + s * 0.2, s * 0.68, s * 0.6, s * 0.06);
  stift.fill();
  stift.fillStyle = '#d9cbb0';
  stift.fillRect(x + s * 0.16, y + s * 0.47, s * 0.68, s * 0.05);
  // Tasse mit Untertasse
  stift.fillStyle = '#c9bca4';
  kreis(stift, x + s * 0.36, y + s * 0.62, s * 0.09);
  stift.fill();
  stift.fillStyle = '#ffffff';
  kreis(stift, x + s * 0.36, y + s * 0.62, s * 0.055);
  stift.fill();
  stift.fillStyle = '#6b4a33';
  kreis(stift, x + s * 0.36, y + s * 0.62, s * 0.035);
  stift.fill();
  // Tischlampe
  stift.fillStyle = '#ffd9a0';
  kreis(stift, x + s * 0.64, y + s * 0.34, s * 0.07);
  stift.fill();
}

function maleWand(stift, x, y, s) {
  stift.fillStyle = FARBE.wand;
  stift.fillRect(x, y, s, s);
  stift.fillStyle = FARBE.wandKante;
  stift.fillRect(x, y, s, s * 0.08);
  stift.fillStyle = FARBE.wandDunkel;
  stift.fillRect(x, y + s * 0.86, s, s * 0.14);
  stift.fillStyle = 'rgba(255, 255, 255, 0.04)';
  rundesRechteck(stift, x + s * 0.14, y + s * 0.24, s * 0.72, s * 0.46, s * 0.05);
  stift.fill();
}

// art: Zeichen aus dem Wagenplan
function maleHindernis(stift, art, x, y, s, feldX, feldY) {
  if (art === 'S') maleSitz(stift, x, y, s);
  else if (art === 'F') maleFahrrad(stift, x, y, s);
  else if (art === 'K') maleKoffer(stift, x, y, s, (feldX + feldY) % 2 === 0);
  else if (art === 'T') maleTisch(stift, x, y, s);
  else maleWand(stift, x, y, s);
}

// --- anzeige/kulisse.js
// Der Wagen von oben, die Tür, die Lichter draußen und die Anzeigen am Rand.






function neueLeinwand(breite, hoehe, dichte) {
  const leinwand = document.createElement('canvas');
  leinwand.width = Math.max(1, Math.round(breite * dichte));
  leinwand.height = Math.max(1, Math.round(hoehe * dichte));
  const stift = leinwand.getContext('2d');
  stift.setTransform(dichte, 0, 0, dichte, 0, 0);
  return { leinwand, stift };
}

// Rumpf, Boden, Fenster und Hindernisse eines Wagens als fertiges Bild.
// Der Ursprung des Bilds ist die linke obere Ecke des Rumpfs.
function maleWagenbild(layout, plan, dichte) {
  const { rumpf, boden, s, wandSeite } = layout;
  const { leinwand, stift } = neueLeinwand(rumpf.b, rumpf.h, dichte);
  const bx = boden.x - rumpf.x;
  const by = boden.y - rumpf.y;

  stift.fillStyle = FARBE.wand;
  rundesRechteck(stift, 0, 0, rumpf.b, rumpf.h, s * 0.2);
  stift.fill();
  stift.fillStyle = FARBE.wandKante;
  rundesRechteck(stift, 0, 0, rumpf.b, s * 0.1, s * 0.2);
  stift.fill();

  // Fenster: je Seite vier, jedes über fast zwei Felder
  for (let k = 0; k < HOEHE / 2; k++) {
    const fy = by + (k * 2 + 0.16) * s;
    const fh = s * 1.68;
    for (const fx of [2, rumpf.b - wandSeite + 2]) {
      stift.fillStyle = FARBE.glas;
      rundesRechteck(stift, fx, fy, wandSeite - 4, fh, 3);
      stift.fill();
      stift.fillStyle = FARBE.glasGlanz;
      stift.fillRect(fx + 1, fy + fh * 0.12, 1.5, fh * 0.3);
    }
  }

  stift.fillStyle = FARBE.boden;
  stift.fillRect(bx, by, boden.b, boden.h);
  for (let y = 0; y < HOEHE; y++) {
    for (let x = 0; x < BREITE; x++) {
      const px = bx + x * s;
      const py = by + y * s;
      stift.fillStyle = FARBE.feld;
      rundesRechteck(stift, px + 1.5, py + 1.5, s - 3, s - 3, s * 0.1);
      stift.fill();
      stift.fillStyle = FARBE.feldKante;
      rundesRechteck(stift, px + 1.5, py + 1.5, s - 3, 2, 1);
      stift.fill();
    }
  }
  for (let y = 0; y < HOEHE; y++) {
    for (let x = 0; x < BREITE; x++) {
      if (plan[y][x] !== '.') maleHindernis(stift, plan[y][x], bx + x * s, by + y * s, s, x, y);
    }
  }

  // die Tür, durch die man gekommen ist: unten, geschlossen
  const tx = bx + TUERFELD.x * s;
  stift.fillStyle = FARBE.wandDunkel;
  stift.fillRect(tx + s * 0.08, by + boden.h, s * 0.84, layout.wandUnten);
  stift.fillStyle = '#232c42';
  stift.fillRect(tx + s * 0.12, by + boden.h + 2, s * 0.37, layout.wandUnten - 4);
  stift.fillRect(tx + s * 0.51, by + boden.h + 2, s * 0.37, layout.wandUnten - 4);
  return leinwand;
}

// Die Tür oben. offen läuft von 0 (zu) bis 1 (auf). (ox, oy) verschiebt den ganzen Wagen.
// spalt: Wer gegen die geschlossene Tür läuft, drückt sie jedes Mal ein Stück auf.
function maleTuer(stift, layout, offen, t, ox, oy, spalt) {
  const { boden, rumpf, s, wandOben } = layout;
  const gruen = offen;
  offen = Math.max(offen, spalt || 0);
  const x = boden.x + TUERFELD.x * s + ox;
  const y = rumpf.y + oy;
  stift.fillStyle = FARBE.wandDunkel;
  stift.fillRect(x + s * 0.06, y + 2, s * 0.88, wandOben - 2);
  if (offen > 0.01) {
    const licht = stift.createLinearGradient(0, y, 0, y + wandOben);
    licht.addColorStop(0, '#fff1d6');
    licht.addColorStop(1, FARBE.warm);
    stift.fillStyle = licht;
    stift.globalAlpha = Math.max(gruen, spalt ? 0.9 : 0); // durch den Spalt fällt schon Licht
    stift.fillRect(x + s * 0.1, y + 3, s * 0.8, wandOben - 3);
    stift.globalAlpha = 1;
  }
  const fluegel = s * 0.4;
  const auf = offen * (fluegel - s * 0.07);
  stift.fillStyle = '#35415f';
  stift.fillRect(x + s * 0.1 - auf, y + 3, fluegel, wandOben - 3);
  stift.fillRect(x + s * 0.5 + auf, y + 3, fluegel, wandOben - 3);
  stift.fillStyle = FARBE.glas;
  stift.fillRect(x + s * 0.18 - auf, y + 6, fluegel * 0.6, wandOben * 0.42);
  stift.fillRect(x + s * 0.58 + auf, y + 6, fluegel * 0.6, wandOben * 0.42);
  // die Wand deckt die aufgeschobenen Flügel wieder zu
  stift.fillStyle = FARBE.wand;
  stift.fillRect(x - s * 0.34, y + 2, s * 0.4, wandOben - 2);
  stift.fillRect(x + s * 0.94, y + 2, s * 0.4, wandOben - 2);
  // Lampe neben der Tür: aus, solange zu, grün, wenn frei
  const lx = x + s * 1.14;
  const ly = y + wandOben * 0.55;
  if (gruen > 0.5) {
    const schein = stift.createRadialGradient(lx, ly, 0, lx, ly, s * 0.3);
    schein.addColorStop(0, 'rgba(111, 220, 143, 0.55)');
    schein.addColorStop(1, 'rgba(111, 220, 143, 0)');
    stift.fillStyle = schein;
    kreis(stift, lx, ly, s * 0.3);
    stift.fill();
  }
  stift.fillStyle = gruen > 0.5 ? FARBE.gruen : '#4b5672';
  kreis(stift, lx, ly, s * 0.065);
  stift.fill();
}

// Warmes Licht fällt durch die offene Tür auf den Boden, zwei Winkel zeigen nach oben.
// ohneWinkel: Liegt ein Symbol auf dem Feld vor der Tür, bleiben die Winkel weg, damit es lesbar bleibt.
function maleTuerlicht(stift, layout, offen, t, ruhig, ohneWinkel) {
  if (offen < 0.01) return;
  const { boden, s } = layout;
  const cx = boden.x + (TUERFELD.x + 0.5) * s;
  const schein = stift.createRadialGradient(cx, boden.y, 0, cx, boden.y, s * 1.7);
  schein.addColorStop(0, `rgba(255, 217, 160, ${0.34 * offen})`);
  schein.addColorStop(1, 'rgba(255, 217, 160, 0)');
  stift.fillStyle = schein;
  stift.fillRect(boden.x, boden.y, boden.b, s * 1.8);
  if (ohneWinkel) return;
  const wandern = ruhig ? 0 : ((t * 0.9) % 1) * s * 0.12;
  stift.strokeStyle = FARBE.bernstein;
  stift.lineWidth = Math.max(2, s * 0.05);
  stift.lineCap = 'round';
  stift.lineJoin = 'round';
  for (let i = 0; i < 2; i++) {
    const y = boden.y + s * (0.34 + i * 0.2) - wandern;
    stift.globalAlpha = offen * (i === 0 ? 0.9 : 0.5);
    stift.beginPath();
    stift.moveTo(cx - s * 0.14, y + s * 0.09);
    stift.lineTo(cx, y);
    stift.lineTo(cx + s * 0.14, y + s * 0.09);
    stift.stroke();
  }
  stift.globalAlpha = 1;
}

// Lichter, die draußen vorbeiziehen: Laternen, ein beleuchtetes Fenster, ein Bahnübergang.
function maleLichter(stift, layout, lichter, klar) {
  const { rumpf, breite } = layout;
  stift.save();
  stift.globalCompositeOperation = 'lighter';
  for (const l of lichter) {
    const frei = l.seite < 0 ? rumpf.x : breite - (rumpf.x + rumpf.b);
    const x = l.seite < 0 ? rumpf.x - frei * l.ort : rumpf.x + rumpf.b + frei * l.ort;
    const r = l.groesse * (1 + klar * 0.25);
    const schein = stift.createRadialGradient(x, l.y, 0, x, l.y, r);
    schein.addColorStop(0, `rgba(${l.farbe}, ${0.5 * l.hell})`);
    schein.addColorStop(0.35, `rgba(${l.farbe}, ${0.16 * l.hell})`);
    schein.addColorStop(1, `rgba(${l.farbe}, 0)`);
    stift.fillStyle = schein;
    stift.beginPath();
    stift.ellipse(x, l.y, r * 0.8, r * (1 + l.zug), 0, 0, Math.PI * 2);
    stift.fill();
  }
  stift.restore();
}

// Der Schein der Lichter wandert durch den Wagen über den Boden.
function maleLichtschein(stift, layout, lichter, klar) {
  const { boden, s } = layout;
  stift.save();
  stift.beginPath();
  stift.rect(boden.x, boden.y, boden.b, boden.h);
  stift.clip();
  stift.globalCompositeOperation = 'lighter';
  for (const l of lichter) {
    if (l.fern) continue;
    const x = l.seite < 0 ? boden.x - s * 0.3 : boden.x + boden.b + s * 0.3;
    const r = s * (2.4 + klar * 0.8);
    const staerke = (0.09 + klar * 0.07) * l.hell;
    const schein = stift.createRadialGradient(x, l.y, 0, x, l.y, r);
    schein.addColorStop(0, `rgba(${l.farbe}, ${staerke})`);
    schein.addColorStop(1, `rgba(${l.farbe}, 0)`);
    stift.fillStyle = schein;
    stift.fillRect(boden.x, l.y - r, boden.b, r * 2);
  }
  stift.restore();
}

// Die Zuganzeige als fertiges Bild: Wagennummer links, Wagenname daneben.
function maleTafelbild(layout, nummer, name, dichte) {
  const { tafel } = layout;
  const { leinwand, stift } = neueLeinwand(tafel.b, tafel.h, dichte);
  stift.fillStyle = FARBE.tafel;
  rundesRechteck(stift, 0, 0, tafel.b, tafel.h, 5);
  stift.fill();
  stift.strokeStyle = FARBE.tafelRand;
  stift.lineWidth = 1;
  rundesRechteck(stift, 0.5, 0.5, tafel.b - 1, tafel.h - 1, 5);
  stift.stroke();
  const feld = neuesPunktfeld(tafel.spalten, tafel.zeilen);
  schreibe(feld, nummer, 2, 1);
  schreibe(feld, name, 2 + ([...nummer].length + 1) * ZEICHENBREITE + 2, 1);
  // ein senkrechter Strich trennt Nummer und Name
  const strich = 2 + [...nummer].length * ZEICHENBREITE + 2;
  for (let y = 1; y < 8; y++) feld.an[y * feld.spalten + strich] = 1;
  zeichnePunktfeld(stift, feld, tafel.polster, tafel.polster, tafel.raster, FARBE.bernstein, FARBE.bernsteinAus);
  return leinwand;
}

function herzPfad(stift, cx, cy, g) {
  stift.beginPath();
  stift.moveTo(cx, cy + g * 0.46);
  stift.bezierCurveTo(cx - g * 0.72, cy + g * 0.02, cx - g * 0.52, cy - g * 0.56, cx, cy - g * 0.18);
  stift.bezierCurveTo(cx + g * 0.52, cy - g * 0.56, cx + g * 0.72, cy + g * 0.02, cx, cy + g * 0.46);
  stift.closePath();
}

// Herzen links. verlust: 0..1, lässt das zuletzt verlorene Herz aufblitzen und verschwinden.
function maleHerzen(stift, x, y, herzen, voll, verlust, groesse) {
  const g = groesse || 17;
  for (let i = 0; i < voll; i++) {
    const cx = x + g * 0.6 + i * (g + 6);
    herzPfad(stift, cx, y, g);
    if (i < herzen) {
      stift.fillStyle = FARBE.herz;
      stift.fill();
    } else {
      stift.strokeStyle = FARBE.leer;
      stift.lineWidth = 1.5;
      stift.stroke();
      if (i === herzen && verlust > 0.01) {
        herzPfad(stift, cx, y, g * (1 + verlust * 0.5));
        stift.fillStyle = `rgba(255, 255, 255, ${verlust})`;
        stift.fill();
      }
    }
  }
}

// Ruhe rechts: drei Lichter. Bei voller Ruhe leuchten sie mit Hof.
function maleRuhe(stift, xRechts, y, ruhe, voll, zuwachs) {
  for (let i = 0; i < voll; i++) {
    const cx = xRechts - 8 - (voll - 1 - i) * 21;
    const an = i < ruhe;
    if (an && ruhe >= voll) {
      const hof = stift.createRadialGradient(cx, y, 0, cx, y, 15);
      hof.addColorStop(0, 'rgba(191, 227, 255, 0.5)');
      hof.addColorStop(1, 'rgba(191, 227, 255, 0)');
      stift.fillStyle = hof;
      kreis(stift, cx, y, 15);
      stift.fill();
    }
    kreis(stift, cx, y, 6.5);
    if (an) {
      stift.fillStyle = FARBE.ruhe;
      stift.fill();
    } else {
      stift.strokeStyle = FARBE.leer;
      stift.lineWidth = 1.5;
      stift.stroke();
    }
    if (i === ruhe - 1 && zuwachs > 0.01) {
      stift.strokeStyle = `rgba(191, 227, 255, ${zuwachs})`;
      stift.lineWidth = 2;
      kreis(stift, cx, y, 6.5 + (1 - zuwachs) * 12);
      stift.stroke();
    }
  }
}

// Die Bahnhofsuhr ist der Knopf zum Warten. Jeder Zug rückt den Minutenzeiger weiter.
function maleUhr(stift, uhr, minuten, druck) {
  const r = uhr.r * (1 - druck * 0.07);
  stift.fillStyle = '#0d1119';
  kreis(stift, uhr.x, uhr.y, r + 3);
  stift.fill();
  stift.fillStyle = druck > 0.01 ? '#f6f0e0' : '#d9d3c2';
  kreis(stift, uhr.x, uhr.y, r);
  stift.fill();
  stift.strokeStyle = '#1b1f2a';
  stift.lineCap = 'butt';
  for (let i = 0; i < 12; i++) {
    const w = (i / 12) * Math.PI * 2;
    const lang = i % 3 === 0 ? 0.24 : 0.14;
    stift.lineWidth = i % 3 === 0 ? 2.6 : 1.6;
    stift.beginPath();
    stift.moveTo(uhr.x + Math.sin(w) * r * (0.9 - lang), uhr.y - Math.cos(w) * r * (0.9 - lang));
    stift.lineTo(uhr.x + Math.sin(w) * r * 0.9, uhr.y - Math.cos(w) * r * 0.9);
    stift.stroke();
  }
  const stunde = (((minuten / 60) % 12) / 12) * Math.PI * 2;
  const minute = ((minuten % 60) / 60) * Math.PI * 2;
  stift.lineCap = 'round';
  stift.lineWidth = 3.4;
  stift.beginPath();
  stift.moveTo(uhr.x - Math.sin(stunde) * r * 0.12, uhr.y + Math.cos(stunde) * r * 0.12);
  stift.lineTo(uhr.x + Math.sin(stunde) * r * 0.5, uhr.y - Math.cos(stunde) * r * 0.5);
  stift.stroke();
  stift.lineWidth = 2.4;
  stift.beginPath();
  stift.moveTo(uhr.x - Math.sin(minute) * r * 0.14, uhr.y + Math.cos(minute) * r * 0.14);
  stift.lineTo(uhr.x + Math.sin(minute) * r * 0.74, uhr.y - Math.cos(minute) * r * 0.74);
  stift.stroke();
}

// Lautsprecher: an oder durchgestrichen
function maleTonknopf(stift, ton, an) {
  const { x, y } = ton;
  stift.fillStyle = '#5b6680';
  stift.strokeStyle = '#5b6680';
  stift.lineWidth = 2;
  stift.lineCap = 'round';
  stift.beginPath();
  stift.moveTo(x - 9, y - 3.5);
  stift.lineTo(x - 4, y - 3.5);
  stift.lineTo(x + 1, y - 8);
  stift.lineTo(x + 1, y + 8);
  stift.lineTo(x - 4, y + 3.5);
  stift.lineTo(x - 9, y + 3.5);
  stift.closePath();
  stift.fill();
  if (an) {
    stift.beginPath();
    stift.arc(x + 2, y, 5, -0.9, 0.9);
    stift.stroke();
    stift.beginPath();
    stift.arc(x + 2, y, 9, -0.9, 0.9);
    stift.stroke();
  } else {
    stift.beginPath();
    stift.moveTo(x + 5, y - 4);
    stift.lineTo(x + 12, y + 4);
    stift.moveTo(x + 12, y - 4);
    stift.lineTo(x + 5, y + 4);
    stift.stroke();
  }
}

// --- anzeige/karte.js
// Die Endkarte: ein warmes Bild vom Bahnsteig, darunter eine wahre Zeile.
// Nach oben wegwischen beginnt die nächste Fahrt.
// Arten: 'tod'; 'halt' (jeder steigt aus: erst der Rückblick, dann die Knöpfe „Aussteigen" und „Noch eine Fahrt").
// Am Halt locht der Schaffner (karte.schaffner 'locht'), oder er nickt ('nickt'), wenn die Karte keine helle Lochung trägt.







// Maße der Karte. Sie ist nur so hoch wie ihr Inhalt.
function kartenMasse(layout, art) {
  const b = Math.min(layout.breite - 32, 420);
  const x = Math.round((layout.breite - b) / 2);
  const polster = 6;
  const raster = b >= 380 ? 3 : 2.2;
  const spalten = Math.floor((b - 20 - 2 * polster) / raster);
  const zeilen = 2 * ZEILENHOEHE + 4;
  const bildH = Math.max(150, Math.min(250, Math.round(layout.hoehe * 0.34)));
  const tafelH = Math.ceil(zeilen * raster + 2 * polster);
  const herzenH = art === 'halt' ? 40 : 0;
  const fahrkarteH = 62;
  const knoepfeH = art === 'halt' ? 58 : 0; // zwei Knöpfe übereinander statt der Winkel
  const h = 10 + bildH + 10 + tafelH + herzenH + fahrkarteH + 66 + knoepfeH;
  const y = Math.round((layout.hoehe - h) / 2) - 4;
  const knopfB = b - 36;
  const unten = y + h - 10;
  return {
    x,
    y,
    b,
    h,
    bild: { x: x + 10, y: y + 10, b: b - 20, h: bildH },
    tafel: { x: x + 10, y: y + 20 + bildH, b: b - 20, h: tafelH, raster, spalten, zeilen, polster },
    herzenY: y + 20 + bildH + tafelH + 22,
    fahrkarte: { x: x + 18, y: y + 20 + bildH + tafelH + herzenH + 10, b: b - 36, h: fahrkarteH - 14 },
    weiter: art === 'halt' ? { x: x + 18, y: unten - 52, b: knopfB, h: 52 } : { x: layout.breite / 2 - 70, y: y + h - 66, b: 140, h: 66 },
    aussteigen: art === 'halt' ? { x: x + 18, y: unten - 52 - 58, b: knopfB, h: 52 } : null,
  };
}

function maleBahnsteig(stift, r, karte, t) {
  const halt = karte.art === 'halt';
  stift.save();
  rundesRechteck(stift, r.x, r.y, r.b, r.h, 10);
  stift.clip();

  const himmel = stift.createLinearGradient(0, r.y, 0, r.y + r.h);
  himmel.addColorStop(0, '#0a101c');
  himmel.addColorStop(0.7, halt ? '#33293a' : '#18223a');
  himmel.addColorStop(1, halt ? '#5a4038' : '#1f2a44');
  stift.fillStyle = himmel;
  stift.fillRect(r.x, r.y, r.b, r.h);

  const boden = r.y + r.h * 0.76;
  // ferne Lichter am Horizont
  for (let i = 0; i < 9; i++) {
    const fx = r.x + ((i * 97 + 31) % 100) / 100 * r.b;
    const fy = boden - r.h * (0.05 + ((i * 37) % 10) / 100);
    stift.fillStyle = i % 3 === 0 ? 'rgba(255, 217, 160, 0.55)' : 'rgba(190, 210, 255, 0.35)';
    kreis(stift, fx, fy, 1.2);
    stift.fill();
  }

  if (halt) {
    // der Zug steht am Bahnsteig, die Fenster sind hell, die Tür ist offen
    const zx = r.x + r.b * 0.5;
    const zy = boden - r.h * 0.46;
    const zh = r.h * 0.43;
    stift.fillStyle = '#26314b';
    rundesRechteck(stift, zx, zy, r.b, zh, 10);
    stift.fill();
    stift.fillStyle = '#1a2236';
    stift.fillRect(zx, zy + zh - 8, r.b, 8);
    stift.fillStyle = FARBE.warm;
    for (let i = 0; i < 3; i++) {
      rundesRechteck(stift, zx + r.b * (0.2 + i * 0.13), zy + zh * 0.2, r.b * 0.09, zh * 0.3, 3);
      stift.fill();
    }
    const tuer = stift.createLinearGradient(0, zy, 0, zy + zh);
    tuer.addColorStop(0, '#fff1d6');
    tuer.addColorStop(1, FARBE.warm);
    stift.fillStyle = tuer;
    stift.fillRect(zx + r.b * 0.05, zy + zh * 0.16, r.b * 0.1, zh * 0.78);
    const schein = stift.createRadialGradient(zx + r.b * 0.1, boden, 0, zx + r.b * 0.1, boden, r.b * 0.3);
    schein.addColorStop(0, 'rgba(255, 217, 160, 0.4)');
    schein.addColorStop(1, 'rgba(255, 217, 160, 0)');
    stift.fillStyle = schein;
    stift.fillRect(r.x, boden - r.h * 0.3, r.b, r.h * 0.5);
  } else {
    // der Zug ist weitergefahren: zwei Schlusslichter in der Ferne
    stift.fillStyle = 'rgba(255, 122, 99, 0.8)';
    kreis(stift, r.x + r.b * 0.86, boden - 5, 1.5);
    stift.fill();
    kreis(stift, r.x + r.b * 0.88, boden - 5, 1.5);
    stift.fill();
  }

  // Bahnsteig mit weißer Linie
  stift.fillStyle = '#242b3b';
  stift.fillRect(r.x, boden, r.b, r.h);
  stift.fillStyle = '#343d52';
  stift.fillRect(r.x, boden, r.b, 3);
  stift.fillStyle = 'rgba(240, 236, 224, 0.75)';
  stift.fillRect(r.x, boden + r.h * 0.12, r.b, 2.5);

  // Laterne mit warmem Kegel
  const lx = r.x + r.b * 0.27;
  const kopf = r.y + r.h * 0.2;
  const flackern = karte.ruhig ? 1 : 0.96 + Math.sin(t * 0.7) * 0.04;
  stift.globalCompositeOperation = 'lighter';
  const kegel = stift.createLinearGradient(0, kopf, 0, boden);
  kegel.addColorStop(0, `rgba(255, 217, 160, ${0.42 * flackern})`);
  kegel.addColorStop(1, `rgba(255, 217, 160, ${0.06 * flackern})`);
  stift.fillStyle = kegel;
  stift.beginPath();
  stift.moveTo(lx + 6, kopf + 3);
  stift.lineTo(lx + 22, kopf + 3);
  stift.lineTo(lx + r.b * 0.36, boden + 4);
  stift.lineTo(lx - r.b * 0.16, boden + 4);
  stift.closePath();
  stift.fill();
  const fleck = stift.createRadialGradient(lx + r.b * 0.1, boden + 6, 0, lx + r.b * 0.1, boden + 6, r.b * 0.3);
  fleck.addColorStop(0, `rgba(255, 217, 160, ${0.3 * flackern})`);
  fleck.addColorStop(1, 'rgba(255, 217, 160, 0)');
  stift.fillStyle = fleck;
  stift.fillRect(r.x, boden, r.b, r.h * 0.24);
  stift.globalCompositeOperation = 'source-over';
  stift.strokeStyle = '#0d1119';
  stift.lineWidth = 3;
  stift.lineCap = 'round';
  stift.beginPath();
  stift.moveTo(lx, boden);
  stift.lineTo(lx, kopf);
  stift.lineTo(lx + 22, kopf);
  stift.stroke();
  stift.fillStyle = '#fff1d6';
  rundesRechteck(stift, lx + 6, kopf + 1, 16, 4, 2);
  stift.fill();

  // Bank, darauf ein Becher
  const bx = lx + r.b * 0.07;
  const bb = r.b * 0.2;
  stift.strokeStyle = '#0d1119';
  stift.lineWidth = 3;
  stift.beginPath();
  stift.moveTo(bx, boden - 13);
  stift.lineTo(bx + bb, boden - 13);
  stift.moveTo(bx + 4, boden - 13);
  stift.lineTo(bx + 4, boden);
  stift.moveTo(bx + bb - 4, boden - 13);
  stift.lineTo(bx + bb - 4, boden);
  stift.moveTo(bx, boden - 26);
  stift.lineTo(bx + bb, boden - 26);
  stift.stroke();
  stift.fillStyle = '#e9dcc0';
  stift.fillRect(bx + bb * 0.2, boden - 21, 5, 7);

  maleFigur(stift, 'spieler', lx + r.b * (halt ? 0.2 : 0.2) + bb * 0.42, boden + 3, 62, { t, takt: 0, ruhig: karte.ruhig, fluss: false });
  // am Halt steht der Schaffner am Zug: der Begleiter, jetzt mit Mütze
  if (halt) {
    // in der ersten Sekunde: Er hebt die Zange und locht, oder er nickt einmal
    const seit = karte.seit || 0;
    const zug = Math.max(0, Math.min(1, seit / 900));
    const auf = Math.sin(zug * Math.PI);
    const heben = karte.schaffner === 'locht' ? 0.8 * auf : 0;
    const nicken = karte.schaffner === 'nickt' && !karte.ruhig ? auf * 3 : 0;
    maleFigur(stift, 'kontrolleur', lx + r.b * 0.2 + bb * 0.42 + 46, boden + 3 + nicken, 62, { t, takt: 3, ruhig: karte.ruhig, zeigt: { x: -1, y: 0 }, heben });
  }

  if (halt) {
    // die Uhr am Bahnsteig zeigt die Ankunft
    stift.strokeStyle = '#0d1119';
    stift.lineWidth = 3;
    stift.beginPath();
    stift.moveTo(r.x + r.b * 0.12, boden);
    stift.lineTo(r.x + r.b * 0.12, r.y + r.h * 0.34);
    stift.stroke();
    maleUhr(stift, { x: r.x + r.b * 0.12, y: r.y + r.h * 0.26, r: 15 }, karte.minuten, 0);
  }
  stift.restore();
}

// Die Fahrkarte: oben die sechs Prüfungen, darunter Platz für Sonder-Lochungen.
// Eine helle Lochung ist ein Loch, durch das warmes Licht fällt, eine dunkle bleibt dunkel.
function maleFahrkarteBild(stift, r, fahrkarte) {
  stift.fillStyle = '#e8dcc2';
  rundesRechteck(stift, r.x, r.y, r.b, r.h, 4);
  stift.fill();
  stift.fillStyle = '#d6c7a8';
  stift.fillRect(r.x + r.b * 0.82, r.y, 1.5, r.h);
  const breit = (r.b * 0.8) / PRUEFUNGEN.length;
  const g = Math.min(breit * 0.62, r.h * 0.5);
  PRUEFUNGEN.forEach((id, i) => {
    const cx = r.x + breit * (i + 0.5) + 2;
    const cy = r.y + r.h * 0.5;
    const gelocht = fahrkarte.lochungen.some((l) => l.art === 'pruefung' && l.id === id);
    maleSymbol(stift, id, cx, cy, g, gelocht ? '#8a7a5c' : '#b9a986');
    if (gelocht) maleLoch(stift, cx + g * 0.45, cy - g * 0.45, g * 0.22, true);
  });
  // Sonder-Lochungen rechts vom Strich, untereinander in zwei Spalten
  const sonder = fahrkarte.lochungen.filter((l) => l.art !== 'pruefung');
  sonder.forEach((l, i) => {
    const sx = r.x + r.b * 0.86 + (i % 2) * r.b * 0.07;
    const sy = r.y + r.h * (0.25 + Math.floor(i / 2) * 0.25);
    maleLoch(stift, sx + r.b * 0.02, sy, Math.min(r.h * 0.1, 5), l.hell);
  });
}

function maleKartenknopf(stift, k, text) {
  stift.fillStyle = '#1c2437';
  rundesRechteck(stift, k.x, k.y, k.b, k.h, 12);
  stift.fill();
  stift.strokeStyle = '#2f3a52';
  stift.lineWidth = 1;
  rundesRechteck(stift, k.x + 0.5, k.y + 0.5, k.b - 1, k.h - 1, 12);
  stift.stroke();
  const breit = Math.ceil(k.b / 2) - 4;
  const feld = neuesPunktfeld(breit, ZEILENHOEHE);
  schreibeMittig(feld, text, 0);
  zeichnePunktfeld(stift, feld, k.x + (k.b - breit * 2) / 2, k.y + (k.h - ZEILENHOEHE * 2) / 2, 2, FARBE.bernstein, null);
}

function maleLoch(stift, x, y, r, hell) {
  stift.fillStyle = hell ? FARBE.warm : '#1a1f2b';
  kreis(stift, x, y, r);
  stift.fill();
  stift.strokeStyle = 'rgba(0, 0, 0, 0.25)';
  stift.lineWidth = 1;
  stift.stroke();
}

// karte: { art, zeilen, herzen, herzenVoll, minuten, fahrkarte, einblenden 0..1, weg 0..1, ruhig }
function maleKarte(stift, layout, karte, t) {
  const m = kartenMasse(layout, karte.art);
  const ein = sanft(karte.einblenden);
  const weg = karte.weg * karte.weg;
  stift.save();
  stift.fillStyle = `rgba(5, 7, 12, ${0.74 * ein * (1 - weg)})`;
  stift.fillRect(0, 0, layout.breite, layout.hoehe);
  stift.globalAlpha = ein;
  stift.translate(0, (1 - ein) * 28 - weg * (m.y + m.h + 20));

  stift.fillStyle = '#10141d';
  rundesRechteck(stift, m.x, m.y, m.b, m.h, 16);
  stift.fill();
  stift.strokeStyle = '#2a3346';
  stift.lineWidth = 1;
  rundesRechteck(stift, m.x + 0.5, m.y + 0.5, m.b - 1, m.h - 1, 16);
  stift.stroke();

  maleBahnsteig(stift, m.bild, karte, t);

  // Anzeige mit zwei Zeilen
  const tf = m.tafel;
  stift.fillStyle = FARBE.tafel;
  rundesRechteck(stift, tf.x, tf.y, tf.b, tf.h, 5);
  stift.fill();
  const feld = neuesPunktfeld(tf.spalten, tf.zeilen);
  // im Rückblick zeigt die Anzeige nacheinander die Tatsachen der Fahrkarte
  const zeilen = karte.rueckblickZeile || karte.zeilen;
  schreibeMittig(feld, zeilen[0] || '', 1);
  schreibeMittig(feld, zeilen[1] || '', ZEILENHOEHE + 3);
  zeichnePunktfeld(stift, feld, tf.x + tf.polster, tf.y + tf.polster, tf.raster, FARBE.bernstein, FARBE.bernsteinAus);

  if (karte.fahrkarte) maleFahrkarteBild(stift, m.fahrkarte, karte.fahrkarte);

  if (karte.art === 'halt') {
    const g = 17;
    const breite = karte.herzenVoll * (g + 6) - 6;
    maleHerzen(stift, layout.breite / 2 - breite / 2 - g * 0.1, m.herzenY, karte.herzen, karte.herzenVoll, 0, g);
  }

  // am Halt nach dem Rückblick: zwei Knöpfe; nach „Aussteigen" bleibt das Bild, wegwischen beginnt neu
  if (karte.art === 'halt' && karte.rueckblickZeile) {
    stift.restore();
    return;
  }
  if (karte.art === 'halt' && !karte.ausgestiegen) {
    maleKartenknopf(stift, m.aussteigen, karte.knopftexte.aussteigen);
    maleKartenknopf(stift, m.weiter, karte.knopftexte.nochEine);
    stift.restore();
    return;
  }
  // zwei Winkel nach oben: wegwischen
  const cx = layout.breite / 2;
  const wandern = karte.ruhig ? 0 : Math.sin(t * 2.2) * 3;
  stift.strokeStyle = FARBE.bernstein;
  stift.lineWidth = 3;
  stift.lineCap = 'round';
  stift.lineJoin = 'round';
  for (let i = 0; i < 2; i++) {
    const y = m.y + m.h - 40 + i * 11 - wandern;
    stift.globalAlpha = ein * (i === 0 ? 0.95 : 0.45);
    stift.beginPath();
    stift.moveTo(cx - 13, y + 8);
    stift.lineTo(cx, y);
    stift.lineTo(cx + 13, y + 8);
    stift.stroke();
  }
  stift.restore();
}

// --- anzeige/anzeige.js
// Die Anzeige spielt ab, was der Kern meldet. Sie entscheidet nie über Spielregeln.
//
// "bild" ist der Stand, der gerade zu sehen ist. Er läuft dem echten Zustand ein paar
// Zehntelsekunden hinterher, während die Ereignisse eines Zugs nacheinander ablaufen.
// Kommt eine neue Eingabe, bevor alles gezeigt ist, springt das Bild sofort ans Ende.













const ABFAHRT = 23 * 60 + 41; // die Uhr beim Einsteigen, jeder Zug ist eine Minute
const TAKT = 1.3; // Sekunden zwischen zwei Schienenstößen im Flusszustand
const SPALT_JE_STOSS = 0.16; // so weit gibt die geschlossene Tür bei jedem Stoß nach
const RUECKBLICK_TAKT = 1400; // so lange steht eine Tatsache im Rückblick am Halt

function uhrzeit(zug) {
  const minuten = (ABFAHRT + zug) % (24 * 60);
  return `${String(Math.floor(minuten / 60)).padStart(2, '0')}:${String(minuten % 60).padStart(2, '0')}`;
}

function erzeugeAnzeige(leinwand) {
  const stift = leinwand.getContext('2d');
  const ruhig = typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;

  let layout = null;
  let dichte = 1;
  let z = null; // der echte Zustand, nur zum Lesen
  let wagenbild = null;
  let altesWagenbild = null;
  let tafelbild = null;
  let schleier = null;
  let standbild = null; // das letzte Bild vor der Wiederholung, zum Überblenden

  const bild = {
    wagenNr: -1,
    spieler: { x: 0, y: 0, px: 0, py: 0, sx: 0, sy: 0, hupf: 0, blitz: 0 },
    gegner: [],
    herzen: HERZEN_VOLL,
    ruhe: 0,
    zug: 0,
    tuer: 0,
    spalt: 0, // wie weit die geschlossene Tür nach Stößen schon nachgegeben hat
    schwenk: 0,
    blende: 0, // beim Wechsel in die Wiederholung und zurück: wie viel vom alten Bild noch zu sehen ist
    probe: false, // in der Wiederholung beim Begleiter
    anstoss: -1e9, // wann man zuletzt den in der Engstelle angestoßen hat
    platz: null, // er geht an seinen Tisch: { von, nach, seit }
  };
  let rede = null; // ein Satz über einem Feld, bis zur nächsten Eingabe: { text, x, y }
  let wartend = []; // Ereignisse, die noch dran sind: { zeit, liste }
  let laeufer = []; // laufende Bewegungen: { start, dauer, schritt, bleibt }
  let geister = []; // Besiegte, die verblassen
  let blitze = []; // Felder, auf denen gerade ein Angriff eintrifft
  let lichter = [];
  let klar = 0;
  let letzteZeit = 0;
  let lichtIn = 0.4;
  let fernIn = 0.2;
  let taktUhr = 0;
  let karte = null;
  let hinweis = null;
  let tonAn = true;
  const wirkung = { wackeln: -1e9, treffer: -1e9, zuwachs: -1e9, uhr: -1e9, tuerZu: -1e9, leuchten: -1e9, lochung: -1e9 };
  const melder = { takt: null };

  // ---------------------------------------------------------------- Aufbau

  function passeAn() {
    // Maß ist der Canvas selbst: Er folgt der dynamischen Höhe und lässt Notch und Home-Balken frei.
    const breite = Math.max(200, leinwand.clientWidth || window.innerWidth);
    const hoehe = Math.max(240, leinwand.clientHeight || window.innerHeight);
    dichte = Math.min(window.devicePixelRatio || 1, 2.5);
    leinwand.width = Math.round(breite * dichte);
    leinwand.height = Math.round(hoehe * dichte);
    layout = berechneLayout(breite, hoehe);
    baueSchleier();
    bild.wagenNr = -1;
    if (z) gleicheAb();
  }

  // Dunkle Ränder, die sich im Flusszustand lichten. Einmal gemalt, dann nur noch aufgelegt.
  function baueSchleier() {
    schleier = document.createElement('canvas');
    const b = Math.round(layout.breite / 2);
    const h = Math.round(layout.hoehe / 2);
    schleier.width = b;
    schleier.height = h;
    const s2 = schleier.getContext('2d');
    const rand = s2.createRadialGradient(b / 2, h * 0.52, h * 0.28, b / 2, h * 0.52, h * 0.82);
    rand.addColorStop(0, 'rgba(4, 6, 12, 0)');
    rand.addColorStop(1, 'rgba(4, 6, 12, 1)');
    s2.fillStyle = rand;
    s2.fillRect(0, 0, b, h);
  }

  function baueBilder() {
    wagenbild = maleWagenbild(layout, z.wagen.plan, dichte);
    tafelbild = maleTafelbild(layout, String(z.wagenNr + 1), TEXTE.wagen[z.wagen.art] || '', dichte);
    bild.wagenNr = z.wagenNr;
  }

  // Bild und Zustand in Deckung bringen
  function gleicheAb() {
    if (bild.wagenNr !== z.wagenNr) baueBilder();
    const s = bild.spieler;
    s.x = s.px = z.spieler.x;
    s.y = s.py = z.spieler.y;
    s.sx = s.sy = s.hupf = 0;
    bild.herzen = z.spieler.herzen;
    bild.ruhe = z.spieler.ruhe;
    bild.zug = z.zug;
    bild.tuer = z.tuerOffen ? 1 : 0;
    bild.spalt = z.tuerOffen ? 0 : (z.tuerStoesse || 0) * SPALT_JE_STOSS;
    bild.angebot = z.angebot ? { id: z.angebot.id, x: z.angebot.x, y: z.angebot.y } : null;
    const b = z.begleiter;
    bild.begleiter = b ? { x: b.x, y: b.y, antworten: b.antworten ? b.antworten.map((a) => ({ ...a })) : null, wiederholen: b.wiederholen ? { ...b.wiederholen } : null } : null;
    bild.probe = !!z.probe;
    bild.pruefung = z.pruefung ? z.pruefung.id : null;
    bild.schwenk = 0;
    const alt = new Map(bild.gegner.map((g) => [g.id, g]));
    bild.gegner = z.gegner.map((g) => {
      const b = alt.get(g.id) || { id: g.id, typ: g.typ, sx: 0, sy: 0, blitz: 0 };
      b.x = b.px = g.x;
      b.y = b.py = g.y;
      b.hp = g.hp;
      b.ansage = g.ansage ? g.ansage.map((f) => ({ x: f.x, y: f.y })) : null;
      b.zeigen = 1;
      b.erschoepft = g.erschoepft > 0;
      b.pausiert = g.pause > 0;
      b.gruppe = g.gruppe;
      b.rang = g.rang;
      b.ruhig = g.ruhig || 0;
      return b;
    });
  }

  // Was gerade auf dem Bildschirm steht, für das Überblenden in die Wiederholung
  function merkeStandbild() {
    try {
      if (!standbild) standbild = document.createElement('canvas');
      standbild.width = leinwand.width;
      standbild.height = leinwand.height;
      standbild.getContext('2d').drawImage(leinwand, 0, 0);
    } catch (fehler) {
      standbild = null; // dann eben ohne Überblenden
    }
  }

  function bewege(start, dauer, schritt, bleibt) {
    const l = { start, dauer, schritt, bleibt: bleibt === true };
    laeufer.push(l);
    schritt(0);
    return l;
  }

  function findeGegner(id) {
    for (const g of bild.gegner) if (g.id === id) return g;
    return null;
  }

  function laufeWeg(g, von, weg, jetzt, dauer) {
    const punkte = [von, ...weg];
    if (punkte.length < 2) return;
    const ziel = punkte[punkte.length - 1];
    g.x = ziel.x;
    g.y = ziel.y;
    bewege(jetzt, dauer, (p) => {
      const q = sanft(p) * (punkte.length - 1);
      const i = Math.min(punkte.length - 2, Math.floor(q));
      const rest = q - i;
      g.px = punkte[i].x + (punkte[i + 1].x - punkte[i].x) * rest;
      g.py = punkte[i].y + (punkte[i + 1].y - punkte[i].y) * rest;
    });
  }

  function lasseAufblitzen(felder, jetzt) {
    const b = { felder, staerke: 1 };
    blitze.push(b);
    bewege(jetzt, 150, (p) => {
      b.staerke = 1 - p;
      if (p >= 1) blitze = blitze.filter((x) => x !== b);
    }, true);
  }

  // ---------------------------------------------------------------- Ereignisse

  // Der Rückblick am Halt: je Lochung Handlung und Ort, ohne Adjektiv
  function rueckblickZeilen(fahrkarte) {
    return fahrkarte.lochungen.map((l) => {
      const ort = TEXTE.wagen[l.wagen] || '';
      if (l.art === 'pruefung') return [TEXTE.pruefung[l.id], ort];
      if (l.art === 'verstanden') return [TEXTE.verstanden[l.durch], ort];
      const text = l.art === 'tod' ? TEXTE.rueckblick.tod : TEXTE.rueckblick.ehrlich;
      return [fuelle(text, { wer: TEXTE.wer[l.durch] }), ort];
    });
  }

  function zeigeKarte(art, zeilen, jetzt, pause) {
    karte = {
      art,
      zeilen,
      herzen: z.spieler.herzen,
      herzenVoll: HERZEN_VOLL,
      minuten: ABFAHRT + z.zug,
      fahrkarte: JSON.parse(JSON.stringify(z.fahrkarte)),
      start: jetzt + pause,
      einblenden: 0,
      weg: 0,
      geht: 0,
      ruhig,
    };
  }

  function wendeAn(e, jetzt) {
    const s = bild.spieler;
    if (e.typ === 'schritt') {
      const fluss = bild.ruhe >= RUHE_VOLL;
      s.x = e.nach.x;
      s.y = e.nach.y;
      bild.zug += 1;
      bewege(jetzt, fluss ? 100 : 125, (p) => {
        const q = fluss ? leicht(p) : sanft(p);
        s.px = e.von.x + (e.nach.x - e.von.x) * q;
        s.py = e.von.y + (e.nach.y - e.von.y) * q;
        s.hupf = fluss ? hinUndHer(p) * 0.07 : 0;
      });
    } else if (e.typ === 'warten') {
      bild.zug += 1;
      wirkung.uhr = jetzt;
    } else if (e.typ === 'ungueltig') {
      const r = RICHTUNG[e.richtung];
      if (e.tuer) wirkung.tuerZu = jetzt;
      bewege(jetzt, 100, (p) => {
        s.sx = r.x * hinUndHer(p) * 0.13;
        s.sy = r.y * hinUndHer(p) * 0.13;
      });
    } else if (e.typ === 'angestossen') {
      // gegen den, der in der Engstelle steht: Man stößt an, er schwankt ein wenig
      const r = RICHTUNG[e.richtung];
      bild.zug += 1;
      bild.anstoss = jetzt;
      bewege(jetzt, 110, (p) => {
        s.sx = r.x * hinUndHer(p) * 0.2;
        s.sy = r.y * hinUndHer(p) * 0.2;
      });
    } else if (e.typ === 'platzGemacht') {
      // er geht an seinen Tisch und setzt sich
      bild.platz = { von: e.von, nach: e.nach, seit: jetzt };
    } else if (e.typ === 'schlag') {
      const r = RICHTUNG[e.richtung];
      bild.zug += 1;
      bewege(jetzt, 115, (p) => {
        s.sx = r.x * hinUndHer(p) * 0.34;
        s.sy = r.y * hinUndHer(p) * 0.34;
      });
      const g = findeGegner(e.id);
      if (g) {
        g.hp = e.hp;
        if (e.besiegt) {
          bild.gegner = bild.gegner.filter((x) => x !== g);
          const geist = { g, alpha: 1 };
          geister.push(geist);
          bewege(jetzt, 140, (p) => {
            geist.alpha = 1 - p;
            g.sx = r.x * p * 0.3;
            g.sy = r.y * p * 0.3;
            g.blitz = 1 - p;
            if (p >= 1) geister = geister.filter((x) => x !== geist);
          }, true);
        } else {
          bewege(jetzt, 140, (p) => {
            g.blitz = 1 - p;
            g.sx = r.x * hinUndHer(p) * 0.14;
            g.sy = r.y * hinUndHer(p) * 0.14;
          }, true);
        }
      }
    } else if (e.typ === 'tuerAuf') {
      const l = bewege(jetzt, 150, (p) => {
        bild.tuer = Math.max(0.001, sanft(p));
      });
      l.tuer = true;
    } else if (e.typ === 'wagenwechsel') {
      altesWagenbild = wagenbild;
      baueBilder();
      gleicheAb();
      geister = [];
      blitze = [];
      if (!ruhig) {
        bewege(jetzt, 150, (p) => {
          const q = sanft(p);
          bild.schwenk = 1 - q;
          s.py = STARTFELD.y * q;
          if (p >= 1) altesWagenbild = null;
        });
      } else {
        altesWagenbild = null;
      }
    } else if (e.typ === 'probe' || e.typ === 'probeEnde') {
      // Die Wiederholung fährt nicht herein, sie blendet über wie eine Erinnerung. Zurück ebenso.
      merkeStandbild();
      for (const l of laeufer) if (!l.bleibt) l.schritt(1); // der Schritt auf das Schild ist vorbei
      laeufer = laeufer.filter((l) => l.bleibt);
      altesWagenbild = null;
      baueBilder();
      gleicheAb();
      geister = [];
      blitze = [];
      rede = null;
      if (!ruhig && standbild) {
        bewege(jetzt, 150, (p) => {
          bild.blende = 1 - sanft(p);
        });
      }
    } else if (e.typ === 'halt') {
      bild.zug += 1;
      // jeder steigt aus; der Schaffner locht, wenn helle Lochungen da sind, sonst nickt er
      zeigeKarte('halt', fuelle(TEXTE.ende.halt, { zeit: uhrzeit(z.zug) }).split(' / '), jetzt, 120);
      karte.rueckblick = rueckblickZeilen(z.fahrkarte);
      karte.knopftexte = TEXTE.knopf;
      karte.schaffner = e.hell > 0 ? 'locht' : 'nickt';
    } else if (e.typ === 'hieb') {
      const g = findeGegner(e.id);
      if (g) {
        const f = e.felder[0];
        const dx = Math.sign(f.x - g.x);
        const dy = Math.sign(f.y - g.y);
        g.ansage = null;
        bewege(jetzt, 120, (p) => {
          g.sx = dx * hinUndHer(p) * 0.3;
          g.sy = dy * hinUndHer(p) * 0.3;
        });
      }
      lasseAufblitzen(e.felder, jetzt);
    } else if (e.typ === 'vorstoss') {
      const g = findeGegner(e.id);
      if (g) {
        g.ansage = null;
        if (g.typ === 'draengler') g.erschoepft = true;
        laufeWeg(g, e.von, e.weg, jetzt, 135);
      }
      lasseAufblitzen(e.felder, jetzt);
    } else if (e.typ === 'folgen') {
      const g = findeGegner(e.id);
      if (g) laufeWeg(g, e.von, e.weg, jetzt, 135);
    } else if (e.typ === 'gegnerSchritt') {
      const g = findeGegner(e.id);
      if (g) laufeWeg(g, e.von, [e.nach], jetzt, 120);
    } else if (e.typ === 'ansage') {
      const g = findeGegner(e.id);
      if (g) {
        g.ansage = e.felder;
        g.erschoepft = false;
        bewege(jetzt, 110, (p) => {
          g.zeigen = p;
        });
      }
    } else if (e.typ === 'treffer') {
      bild.herzen = e.herzen;
      bild.ruhe = 0;
      wirkung.treffer = jetzt;
      if (!ruhig) wirkung.wackeln = jetzt;
      bewege(jetzt, 150, (p) => {
        s.blitz = 1 - p;
      }, true);
    } else if (e.typ === 'ausgewichen') {
      bild.ruhe = e.ruhe;
      wirkung.zuwachs = jetzt;
    } else if (e.typ === 'tuerStoss') {
      // gegen die geschlossene Tür: Sie zuckt und gibt ein Stück nach
      wirkung.tuerZu = jetzt;
      bild.zug += 1;
      const von = bild.spalt;
      const nach = Math.min(1, e.n * SPALT_JE_STOSS);
      bewege(jetzt, 110, (p) => {
        s.sy = -hinUndHer(p) * 0.16;
        bild.spalt = von + (nach - von) * sanft(p);
      });
    } else if (e.typ === 'aufgebrochen') {
      bild.herzen = e.herzen;
      wirkung.treffer = jetzt;
      if (!ruhig) wirkung.wackeln = jetzt;
    } else if (e.typ === 'sprint') {
      // zwei Felder in einem Zug, wer im Weg steht, wird getroffen
      bild.zug += 1;
      bild.ruhe = e.ruhe;
      const r = RICHTUNG[e.richtung];
      if (e.nach) {
        s.x = e.nach.x;
        s.y = e.nach.y;
        bewege(jetzt, 110, (p) => {
          const q = leicht(p);
          s.px = e.von.x + (e.nach.x - e.von.x) * q;
          s.py = e.von.y + (e.nach.y - e.von.y) * q;
        });
      } else {
        bewege(jetzt, 115, (p) => {
          s.sx = r.x * hinUndHer(p) * 0.34;
          s.sy = r.y * hinUndHer(p) * 0.34;
        });
      }
      for (const t of e.getroffen) {
        const g = findeGegner(t.id);
        if (!g) continue;
        g.hp = t.hp;
        if (t.besiegt) {
          bild.gegner = bild.gegner.filter((x) => x !== g);
          const geist = { g, alpha: 1 };
          geister.push(geist);
          bewege(jetzt, 140, (p) => {
            geist.alpha = 1 - p;
            g.blitz = 1 - p;
            if (p >= 1) geister = geister.filter((x) => x !== geist);
          }, true);
        } else {
          bewege(jetzt, 140, (p) => {
            g.blitz = 1 - p;
            g.sx = r.y * hinUndHer(p) * 0.14; // er wird zur Seite gedrängt
            g.sy = r.x * hinUndHer(p) * 0.14;
          }, true);
        }
      }
    } else if (e.typ === 'ruhigGewartet') {
      bild.ruhe = e.ruhe;
      wirkung.zuwachs = jetzt;
    } else if (e.typ === 'gegoennt') {
      // ein Herz bleibt auf dem Tisch liegen; ob etwas zurückkommt, zeigt sich erst später
      bild.herzen = e.herzen;
      bild.zug += 1;
      const r = { x: Math.sign(e.x - s.x), y: Math.sign(e.y - s.y) };
      bewege(jetzt, 120, (p) => {
        s.sx = r.x * hinUndHer(p) * 0.2;
        s.sy = r.y * hinUndHer(p) * 0.2;
      });
    } else if (e.typ === 'geheilt') {
      bild.herzen = e.herzen;
      if (e.plus > 0) wirkung.leuchten = jetzt + 160; // nach dem Hereinschieben des Wagens
    } else if (e.typ === 'rueckhalt' || e.typ === 'verstanden') {
      // ein warmes Leuchten um die Figur: Rückhalt hat gegriffen, oder eine Stärke ist dazugekommen
      if (e.typ === 'rueckhalt') bild.herzen = e.herzen;
      wirkung.leuchten = jetzt;
    } else if (e.typ === 'angenommen') {
      // Prüfung angenommen: das Symbol geht vom Boden nach oben, die Worte stehen kurz über dem Spieler
      bild.angebot = null;
      bild.pruefung = e.id;
      rede = { text: TEXTE.pruefung[e.id], x: s.x, y: s.y };
      wirkung.leuchten = jetzt; // das Symbol antwortet sofort: ein warmer Ring um die Figur
    } else if (e.typ === 'gespraech') {
      if (bild.begleiter) bild.begleiter.antworten = e.antworten.map((a) => ({ ...a }));
    } else if (e.typ === 'antwort') {
      if (bild.begleiter) {
        bild.begleiter.antworten = null;
        bild.begleiter.wiederholen = e.wiederholen ? { ...e.wiederholen } : null;
      }
    } else if (e.typ === 'gelocht') {
      if (e.art === 'pruefung') {
        wirkung.lochung = jetzt;
        bild.gelocht = e.id;
        bild.pruefung = null;
      }
    } else if (e.typ === 'aufgehellt') {
      wirkung.leuchten = jetzt;
    } else if (e.typ === 'zoegert') {
      // Präsenz: Er wollte angreifen und weicht kurz vor dem Spieler zurück
      const g = findeGegner(e.id);
      if (g) {
        const p = bild.spieler;
        const dx = Math.sign(g.x - p.x);
        const dy = Math.sign(g.y - p.y);
        bewege(jetzt, 150, (q) => {
          g.sx = dx * hinUndHer(q) * 0.14;
          g.sy = dy * hinUndHer(q) * 0.14;
        });
      }
    } else if (e.typ === 'kontrolle') {
      const g = findeGegner(e.id);
      if (g) rede = { text: TEXTE.kontrolleur.satz, x: g.x, y: g.y };
    } else if (e.typ === 'ruhig') {
      const g = findeGegner(e.id);
      if (g) {
        const von = g.ruhig || 0;
        bewege(jetzt, 140, (p) => {
          g.ruhig = von + (e.ruhig - von) * sanft(p);
        });
      }
    } else if (e.typ === 'durchgewinkt') {
      // Er greift an die Mütze und geht durch die Tür.
      const g = findeGegner(e.id);
      if (g) {
        bild.gegner = bild.gegner.filter((x) => x !== g);
        const geist = { g, alpha: 1 };
        geister.push(geist);
        bewege(jetzt, 420, (p) => {
          g.winkt = Math.min(1, p * 2.5);
          geist.alpha = p < 0.5 ? 1 : 1 - (p - 0.5) * 2;
          g.sy = p < 0.5 ? 0 : -(p - 0.5) * 0.8;
          if (p >= 1) geister = geister.filter((x) => x !== geist);
        }, true);
      }
      rede = null;
    } else if (e.typ === 'tod') {
      const uebrig = WAGENZAHL - e.wagenNr;
      const text = uebrig === 1 ? TEXTE.ende.einWagen : fuelle(TEXTE.ende.mehrereWagen, { n: TEXTE.zahlwort[uebrig] });
      zeigeKarte('tod', text.split(' / '), jetzt, 280);
    }
  }

  // Nimmt die Ereignisse eines Zugs entgegen und verteilt sie auf die nächsten Augenblicke.
  function spiele(ereignisse, jetzt) {
    rede = null; // der Satz des Kontrolleurs verschwindet mit der nächsten Eingabe
    const phasen = [[], [], []];
    for (const e of ereignisse) phasen[e.phase].push(e);
    let zeit = jetzt;
    for (let p = 0; p < 3; p++) {
      if (!phasen[p].length) continue;
      wartend.push({ zeit, liste: phasen[p] });
      const nurWarten = p === 0 && phasen[p].every((e) => e.typ === 'warten' || e.typ === 'ungueltig');
      zeit += nurWarten ? 30 : p === 0 ? 100 : p === 1 ? 125 : 115;
    }
    wartend.push({ zeit, liste: null });
    arbeiteAb(jetzt);
  }

  function arbeiteAb(jetzt) {
    while (wartend.length && wartend[0].zeit <= jetzt) {
      const dran = wartend[0];
      if (dran.liste) {
        wartend.shift();
        for (const e of dran.liste) wendeAn(e, jetzt);
        continue;
      }
      // der Abgleich am Ende wartet, bis keine Bewegung mehr läuft
      if (laeufer.some((l) => !l.bleibt)) break;
      wartend.shift();
      gleicheAb();
    }
  }

  // Alles, was noch läuft, sofort zu Ende bringen. Treffer und Aufblitzen laufen weiter.
  function beschleunige(jetzt) {
    for (const dran of wartend) if (dran.liste) for (const e of dran.liste) wendeAn(e, jetzt);
    wartend = [];
    for (const l of laeufer) if (!l.bleibt) l.schritt(1);
    laeufer = laeufer.filter((l) => l.bleibt);
    if (z) gleicheAb();
  }

  function neueFahrt(zustand, jetzt) {
    z = zustand;
    wartend = [];
    laeufer = laeufer.filter((l) => l.bleibt);
    geister = [];
    blitze = [];
    bild.gegner = [];
    bild.tuer = 0;
    bild.spalt = 0;
    bild.blende = 0;
    rede = null;
    altesWagenbild = null;
    bild.wagenNr = -1;
    gleicheAb();
    if (karte) karte.geht = jetzt;
  }

  // ---------------------------------------------------------------- Lichter draußen

  function neuesLicht(seite, fern, fest) {
    const warm = fest || Math.random() < 0.78;
    lichter.push({
      seite,
      fern,
      ort: fern ? 0.55 + Math.random() * 0.45 : 0.3 + Math.random() * 0.5,
      y: -60,
      tempo: fern ? 34 + Math.random() * 30 : fest ? 340 : 250 + Math.random() * 130,
      groesse: fern ? 3 + Math.random() * 3 : fest ? 30 : 16 + Math.random() * 20,
      hell: fern ? 0.5 + Math.random() * 0.4 : fest ? 1 : 0.55 + Math.random() * 0.45,
      farbe: warm ? '255, 205, 140' : '175, 205, 255',
      zug: fern ? 0 : 0.7,
    });
  }

  function bewegeLichter(dt) {
    const fluss = bild.ruhe >= RUHE_VOLL && !karte;
    const bremse = ruhig ? 0.2 : 1;
    for (const l of lichter) l.y += l.tempo * dt * bremse;
    lichter = lichter.filter((l) => l.y < layout.hoehe + 80);
    fernIn -= dt * bremse;
    if (fernIn <= 0) {
      neuesLicht(Math.random() < 0.5 ? -1 : 1, true, false);
      fernIn = 0.7 + Math.random() * 1.4;
    }
    if (fluss && !ruhig) {
      // im Takt der Schienen: links, kurz darauf rechts, dann Pause
      const vorher = taktUhr;
      taktUhr = (taktUhr + dt) % TAKT;
      if (taktUhr < vorher) {
        neuesLicht(-1, false, true);
        if (melder.takt) melder.takt(0);
      }
      if (vorher < 0.2 && taktUhr >= 0.2) {
        neuesLicht(1, false, true);
        if (melder.takt) melder.takt(1);
      }
    } else {
      taktUhr = TAKT - 0.05;
      lichtIn -= dt * bremse;
      if (lichtIn <= 0) {
        neuesLicht(Math.random() < 0.5 ? -1 : 1, false, false);
        lichtIn = 0.5 + Math.random() * 1.7;
      }
    }
  }

  // ---------------------------------------------------------------- Zeichnen

  function maleRot(t) {
    const { boden, s } = layout;
    const puls = ruhig ? 0.5 : (Math.sin((t * Math.PI * 2) / 1.15) + 1) / 2;
    const gemalt = new Map();
    for (const g of bild.gegner) {
      if (!g.ansage) continue;
      g.ansage.forEach((f, i) => {
        const nr = feldNr(f.x, f.y);
        const vor = i === 0 ? g : g.ansage[i - 1];
        const eintrag = { f, zeigen: g.zeigen, dx: Math.sign(f.x - vor.x), dy: Math.sign(f.y - vor.y), pfeil: g.typ !== 'pendler' };
        if (!gemalt.has(nr) || gemalt.get(nr).zeigen < eintrag.zeigen) gemalt.set(nr, eintrag);
      });
    }
    for (const { f, zeigen, dx, dy, pfeil } of gemalt.values()) {
      const x = boden.x + f.x * s;
      const y = boden.y + f.y * s;
      stift.fillStyle = `rgba(232, 64, 47, ${(0.24 + 0.2 * puls) * zeigen})`;
      rundesRechteck(stift, x + 2, y + 2, s - 4, s - 4, s * 0.1);
      stift.fill();
      stift.strokeStyle = `rgba(255, 122, 99, ${(0.6 + 0.35 * puls) * zeigen})`;
      stift.lineWidth = 2;
      rundesRechteck(stift, x + 3, y + 3, s - 6, s - 6, s * 0.09);
      stift.stroke();
      // Schraffur: Gefahr ist eckig und gestreift, Nutzen rund und weich, auch ohne Farbe zu unterscheiden
      stift.save();
      rundesRechteck(stift, x + 3, y + 3, s - 6, s - 6, s * 0.09);
      stift.clip();
      stift.strokeStyle = `rgba(255, 150, 130, ${(0.3 + 0.2 * puls) * zeigen})`;
      stift.lineWidth = Math.max(2, s * 0.07);
      stift.beginPath();
      for (let k = -s; k < s; k += s * 0.28) {
        stift.moveTo(x + k, y + s);
        stift.lineTo(x + k + s, y);
      }
      stift.stroke();
      stift.restore();
      if (pfeil && (dx || dy)) {
        // kleiner Winkel: aus dieser Richtung kommt er
        const cx = x + s / 2;
        const cy = y + s / 2;
        const a = s * 0.1;
        stift.strokeStyle = `rgba(255, 190, 170, ${0.55 * zeigen})`;
        stift.lineWidth = Math.max(1.5, s * 0.035);
        stift.lineCap = 'round';
        stift.lineJoin = 'round';
        stift.beginPath();
        stift.moveTo(cx - dx * a - dy * a, cy - dy * a - dx * a);
        stift.lineTo(cx + dx * a, cy + dy * a);
        stift.lineTo(cx - dx * a + dy * a, cy - dy * a + dx * a);
        stift.stroke();
      }
    }
    for (const b of blitze) {
      for (const f of b.felder) {
        stift.fillStyle = `rgba(255, 214, 200, ${0.6 * b.staerke})`;
        rundesRechteck(stift, boden.x + f.x * s + 2, boden.y + f.y * s + 2, s - 4, s - 4, s * 0.1);
        stift.fill();
      }
    }
  }

  function istVorn(g) {
    if (g.typ !== 'gruppe') return false;
    return !bild.gegner.some((a) => a.typ === 'gruppe' && a.gruppe === g.gruppe && a.rang < g.rang);
  }

  function maleGegner(g, t, alpha, oy) {
    const { boden, s } = layout;
    const cx = boden.x + (g.px + g.sx + 0.5) * s;
    const fy = boden.y + (g.py + g.sy + 0.86) * s + oy;
    let neigung = 0;
    if (g.typ === 'draengler' && g.ansage && g.ansage.length) neigung = Math.sign(g.ansage[0].x - g.x) * 0.55;
    // Der Kontrolleur hält dem, der in seiner Nähe ist, die Zange hin. Sie sinkt, je länger man ruhig steht.
    let zeigt = null;
    let heben = 0;
    if (g.typ === 'kontrolleur') {
      const p = bild.spieler;
      const nah = Math.max(Math.abs(p.x - g.x), Math.abs(p.y - g.y)) === 1;
      const ziel = g.ansage && g.ansage.length ? g.ansage[0] : nah ? p : null;
      if (ziel) zeigt = { x: ziel.x - g.x, y: ziel.y - g.y };
      heben = g.ansage ? 1 : nah ? 1 - ((g.ruhig || 0) / GEGNERWERTE.kontrolleur.geduld) * 0.85 : 0;
    }
    maleFigur(stift, g.typ, cx, fy, s, {
      zeigt,
      heben,
      winkt: g.winkt || 0,
      t,
      takt: g.id * 1.7,
      alpha,
      blitz: g.blitz,
      ruhig,
      neigung,
      pausiert: g.pausiert && !g.ansage,
      vorderster: istVorn(g),
      erschoepft: g.erschoepft,
      ansagend: !!g.ansage,
    });
    if (alpha > 0.5) {
      const kopf = g.typ === 'gruppe' ? 0.74 : g.typ === 'draengler' ? (g.erschoepft ? 0.74 : 0.94) : g.typ === 'kontrolleur' ? 0.94 : 0.86;
      malePunkte(stift, cx, fy - s * kopf, s, g.hp, GEGNERWERTE[g.typ].hp);
    }
  }

  function maleSchild(text, cx, cy) {
    const raster = 2;
    const b = textBreite(text) * raster + 14;
    const h = ZEILENHOEHE * raster + 10;
    const x = begrenze(Math.round(cx - b / 2), 6, layout.breite - b - 6);
    const y = Math.round(cy - h / 2);
    stift.fillStyle = 'rgba(13, 17, 25, 0.94)';
    rundesRechteck(stift, x, y, b, h, 6);
    stift.fill();
    stift.strokeStyle = FARBE.tafelRand;
    stift.lineWidth = 1;
    rundesRechteck(stift, x + 0.5, y + 0.5, b - 1, h - 1, 6);
    stift.stroke();
    const feld = neuesPunktfeld(textBreite(text), ZEILENHOEHE);
    schreibe(feld, text, 0, 0);
    zeichnePunktfeld(stift, feld, x + 7, y + 6, raster, FARBE.bernstein, null);
  }

  function figurAuf(x, y) {
    const p = bild.spieler;
    return (p.x === x && p.y === y) || bild.gegner.some((g) => g.x === x && g.y === y);
  }

  // Das Schild steht über dem Feld. Steht dort schon jemand, weicht es nach unten aus.
  function schildAn(feld, hoch) {
    const { boden, s } = layout;
    const cx = boden.x + (feld.x + 0.5) * s;
    const obenFrei = feld.y > 0 && !figurAuf(feld.x, feld.y - 1);
    const untenFrei = feld.y < 7 && !figurAuf(feld.x, feld.y + 1);
    if (obenFrei || !untenFrei) return { cx, cy: boden.y + feld.y * s - s * hoch };
    return { cx, cy: boden.y + (feld.y + 1) * s + s * 0.32 };
  }

  // Höchstens ein Hinweis, und nur in dem Augenblick, in dem die Lage zu sehen ist.
  function maleHinweis() {
    if (!hinweis || karte || bild.schwenk > 0.01) return;
    const p = bild.spieler;
    const markiert = bild.gegner.some((g) => g.ansage && g.ansage.some((f) => f.x === p.x && f.y === p.y));
    // den Kontrolleur schlägt das Spiel nicht vor
    const nachbar = bild.gegner.find((a) => a.typ !== 'kontrolleur' && Math.abs(a.x - p.x) + Math.abs(a.y - p.y) === 1);
    if (hinweis.wischen && bild.zug === 0) {
      const ort = schildAn(p, 0.42);
      maleSchild(TEXTE.hinweis[hinweis.wischen], ort.cx, ort.cy);
    } else if (hinweis.ausweichen && markiert) {
      const ort = schildAn(p, 0.6);
      maleSchild(TEXTE.hinweis.ausweichen, ort.cx, ort.cy);
    } else if (hinweis.anrempeln && nachbar && !markiert) {
      const ort = schildAn(nachbar, 0.4);
      maleSchild(TEXTE.hinweis.anrempeln, ort.cx, ort.cy);
    }
  }

  function maleWelt(t, jetzt) {
    const { boden, rumpf, s, wagenlaenge } = layout;
    const oy = -bild.schwenk * wagenlaenge;
    if (altesWagenbild && bild.schwenk > 0) {
      const alt = (1 - bild.schwenk) * wagenlaenge;
      stift.drawImage(altesWagenbild, rumpf.x, rumpf.y + alt, rumpf.b, rumpf.h);
      maleTuer(stift, layout, 1, t, 0, alt);
    }
    if (wagenbild) stift.drawImage(wagenbild, rumpf.x, rumpf.y + oy, rumpf.b, rumpf.h);
    let zucken = 0;
    const seit = jetzt - wirkung.tuerZu;
    if (seit < 160 && !ruhig) zucken = Math.sin(seit / 12) * 1.5 * (1 - seit / 160);
    maleTuer(stift, layout, bild.tuer, t, zucken, oy, bild.spalt);

    // Speisewagen: warmes Licht über den Tischen, Fahrgäste an ihren Plätzen
    if (z.wagen.sicher) {
      stift.fillStyle = 'rgba(255, 190, 120, 0.13)';
      stift.fillRect(boden.x, boden.y + oy, boden.b, boden.h);
      for (let y = 0; y < z.wagen.plan.length; y++) {
        for (const x of [0, z.wagen.plan[y].length - 1]) {
          if (z.wagen.plan[y][x] !== 'T') continue;
          const lx = boden.x + (x + 0.5) * s;
          const ly = boden.y + (y + 0.4) * s + oy;
          const schein = stift.createRadialGradient(lx, ly, 0, lx, ly, s * 1.5);
          schein.addColorStop(0, 'rgba(255, 210, 150, 0.34)');
          schein.addColorStop(1, 'rgba(255, 210, 150, 0)');
          stift.fillStyle = schein;
          stift.fillRect(lx - s * 1.5, ly - s * 1.5, s * 3, s * 3);
        }
      }
      if (z.wagen.gegoennt) {
        const hx = boden.x + (z.wagen.gegoennt.x + 0.5) * s;
        const hy = boden.y + (z.wagen.gegoennt.y + 0.36) * s + oy;
        herzPfad(stift, hx, hy, s * 0.2);
        stift.fillStyle = FARBE.herz;
        stift.fill();
      }
      const w = z.wagen.imWeg;
      if (w && !imWechselNoch()) maleSprintZiel(w, oy, t);
      for (const f of z.wagen.fahrgaeste) {
        let fx = f.x;
        let fyy = f.y;
        const pl = bild.platz;
        if (pl && f.x === pl.nach.x && f.y === pl.nach.y && jetzt - pl.seit < 260) {
          const q = sanft(Math.min(1, (jetzt - pl.seit) / 260));
          fx = pl.von.x + (pl.nach.x - pl.von.x) * q;
          fyy = pl.von.y + (pl.nach.y - pl.von.y) * q;
        }
        let schwank = 0;
        if (w && f.x === w.x && f.y === w.y && jetzt - bild.anstoss < 200 && !ruhig) schwank = Math.sin((jetzt - bild.anstoss) / 20) * s * 0.04;
        const cx = boden.x + (fx + 0.5) * s + schwank;
        const fy = boden.y + (fyy + 0.8) * s + oy;
        maleFigur(stift, f.typ, cx, fy, s * 0.82, { t, takt: f.x * 3 + f.y, ruhig, pausiert: false, gesicht: true });
      }
      const b = bild.begleiter;
      if (b) {
        if (b.wiederholen) maleNochmal(b.wiederholen, b, oy);
        maleFigur(stift, 'begleiter', boden.x + (b.x + 0.5) * s, boden.y + (b.y + 0.8) * s + oy, s * 0.82, { t, takt: 5, ruhig });
        if (b.antworten) for (const a of b.antworten) maleAntwort(a, t, oy);
      }
    }

    const imWechsel = bild.schwenk > 0.01;
    if (!imWechsel) {
      maleLichtschein(stift, layout, lichter, klar);
      maleRot(t);
      if (bild.angebot) maleAngebot(bild.angebot, t);
      const vorDerTuer = bild.angebot && bild.angebot.x === TUERFELD.x && bild.angebot.y === TUERFELD.y;
      maleTuerlicht(stift, layout, bild.tuer, t, ruhig, vorDerTuer);
    }

    // Figuren von hinten nach vorn
    const p = bild.spieler;
    const reihe = [];
    for (const g of bild.gegner) reihe.push({ y: g.py + g.sy, g, alpha: 1 });
    for (const geist of geister) reihe.push({ y: geist.g.py + geist.g.sy, g: geist.g, alpha: geist.alpha });
    reihe.push({ y: p.py + p.sy + 0.001, spieler: true });
    reihe.sort((a, b) => a.y - b.y);
    for (const eintrag of reihe) {
      if (!eintrag.spieler) {
        maleGegner(eintrag.g, t, eintrag.alpha, oy);
        continue;
      }
      const cx = boden.x + (p.px + p.sx + 0.5) * s;
      const fy = boden.y + (p.py + p.sy + 0.86 - p.hupf) * s;
      if (klar > 0.02) {
        const hof = stift.createRadialGradient(cx, fy, 0, cx, fy, s * 0.62);
        hof.addColorStop(0, `rgba(255, 217, 160, ${0.26 * klar})`);
        hof.addColorStop(1, 'rgba(255, 217, 160, 0)');
        stift.fillStyle = hof;
        stift.fillRect(cx - s * 0.7, fy - s * 0.4, s * 1.4, s * 0.8);
      }
      const seitLeuchten = jetzt - wirkung.leuchten;
      if (seitLeuchten >= 0 && seitLeuchten < 700) {
        const q = seitLeuchten / 700;
        const ring = stift.createRadialGradient(cx, fy - s * 0.35, s * (0.2 + q * 0.3), cx, fy - s * 0.35, s * (0.45 + q * 0.4));
        ring.addColorStop(0, 'rgba(255, 217, 160, 0)');
        ring.addColorStop(0.5, `rgba(255, 217, 160, ${0.5 * (1 - q)})`);
        ring.addColorStop(1, 'rgba(255, 217, 160, 0)');
        stift.fillStyle = ring;
        stift.fillRect(cx - s, fy - s * 1.35, s * 2, s * 2);
      }
      const tot = karte && karte.art === 'tod';
      maleFigur(stift, 'spieler', cx, fy, s, { t, takt: 0, ruhig, blitz: p.blitz, fluss: klar > 0.5, alpha: tot ? 0.45 : 1 });
      const markiert = bild.gegner.some((g) => g.ansage && g.ansage.some((f) => f.x === p.x && f.y === p.y));
      if (markiert && !imWechsel && !karte) {
        const wippen = ruhig ? 0 : Math.sin(t * 7) * s * 0.025;
        maleAchtung(stift, cx, fy - s * 0.84 + wippen, s);
      }
    }
    if (bild.probe) {
      // die Wiederholung: kühleres Licht über dem ganzen Wagen, wie eine Erinnerung
      stift.fillStyle = 'rgba(150, 175, 230, 0.13)';
      stift.fillRect(rumpf.x, rumpf.y + oy, rumpf.b, rumpf.h);
    }
    if (rede && !karte && !imWechsel) maleRede(rede.text, rede, oy);
    else if (bild.begleiter && bild.begleiter.antworten && !karte && !imWechsel) maleRede(TEXTE.begleiter.frage, bild.begleiter, oy);
    maleHinweis();
  }

  // Eine Antwort an den Begleiter: eine kleine Figur auf leuchtendem Boden, bei der Tür eine Tür, sonst „Pech".
  function maleAntwort(a, t, oy) {
    const { boden, s } = layout;
    const cx = boden.x + (a.x + 0.5) * s;
    const cy = boden.y + (a.y + 0.5) * s + oy;
    maleNutzschein(cx, cy, 1);
    if (a.id === 'pech') {
      maleSchild(TEXTE.begleiter.pech, cx, cy);
    } else if (a.id === 'tuer') {
      stift.fillStyle = '#35415f';
      stift.fillRect(cx - s * 0.16, cy - s * 0.26, s * 0.32, s * 0.5);
      stift.fillStyle = FARBE.glas;
      stift.fillRect(cx - s * 0.11, cy - s * 0.2, s * 0.22, s * 0.16);
    } else {
      maleFigur(stift, a.id, cx, cy + s * 0.3, s * 0.55, { t, takt: a.x, ruhig: true });
    }
  }

  // „Noch mal": ein Schild auf leuchtendem Boden neben dem Begleiter. Es ist breiter als ein Feld und
  // schließt deshalb an seiner Seite mit dem Feld ab, damit es ihn nicht verdeckt.
  function maleNochmal(f, b, oy) {
    const { boden, s } = layout;
    const cx = boden.x + (f.x + 0.5) * s;
    const cy = boden.y + (f.y + 0.5) * s + oy;
    maleNutzschein(cx, cy, 1);
    const halb = Math.max(s / 2, (textBreite(TEXTE.begleiter.nochmal) * 2 + 14) / 2);
    const seite = Math.sign(b.x - f.x);
    maleSchild(TEXTE.begleiter.nochmal, cx + seite * (s / 2 - halb - 2), cy);
  }

  function imWechselNoch() {
    return bild.schwenk > 0.01;
  }

  // Sprint einführen: Steht man direkt vor dem in der Engstelle, leuchtet das Feld hinter ihm rund auf.
  // Ein Tipp darauf ist der Sprint. Es zeigt die Richtung, kein Wort.
  function maleSprintZiel(w, oy, t) {
    const p = bild.spieler;
    const dx = w.x - p.x;
    const dy = w.y - p.y;
    if (Math.abs(dx) + Math.abs(dy) !== 1 || p.sx || p.sy || p.px !== p.x || p.py !== p.y) return;
    const x = w.x + dx;
    const y = w.y + dy;
    if (x < 0 || y < 0 || y >= z.wagen.plan.length || x >= z.wagen.plan[y].length || z.wagen.plan[y][x] !== '.') return;
    const { boden, s } = layout;
    const puls = ruhig ? 0.8 : 0.65 + Math.sin(t * 2.4) * 0.2;
    maleNutzschein(boden.x + (x + 0.5) * s, boden.y + (y + 0.5) * s + oy, puls);
  }

  // Was nützt, liegt rund auf dem Boden: ein weicher Schein und ein dünner Kreis, nie Streifen.
  function maleNutzschein(cx, cy, puls) {
    const { s } = layout;
    const schein = stift.createRadialGradient(cx, cy, 0, cx, cy, s * 0.48);
    schein.addColorStop(0, `rgba(255, 217, 160, ${0.34 * puls})`);
    schein.addColorStop(1, 'rgba(255, 217, 160, 0)');
    stift.fillStyle = schein;
    stift.fillRect(cx - s * 0.5, cy - s * 0.5, s, s);
    stift.strokeStyle = `rgba(255, 217, 160, ${0.5 * puls})`;
    stift.lineWidth = Math.max(1.5, s * 0.03);
    stift.beginPath();
    stift.arc(cx, cy, s * 0.4, 0, Math.PI * 2);
    stift.stroke();
  }

  // Das Angebot: ein Symbol leuchtet auf dem Boden eines Feldes.
  function maleAngebot(a, t) {
    const { boden, s } = layout;
    const cx = boden.x + (a.x + 0.5) * s;
    const cy = boden.y + (a.y + 0.5) * s;
    const puls = ruhig ? 0.8 : 0.65 + Math.sin(t * 2.4) * 0.2;
    maleNutzschein(cx, cy, puls);
    stift.globalAlpha = puls;
    maleSymbol(stift, a.id, cx, cy, s * 0.42, FARBE.warm);
    stift.globalAlpha = 1;
  }

  // Ein Schild über dem Kopf dessen, der spricht, mit einer Spitze zu ihm hin.
  function maleRede(text, feld, oy) {
    const { boden, s } = layout;
    const cx = boden.x + (feld.x + 0.5) * s;
    const h = ZEILENHOEHE * 2 + 10;
    const cy = boden.y + feld.y * s - s * 0.04 - h / 2 + oy;
    maleSchild(text, cx, cy);
    stift.fillStyle = 'rgba(13, 17, 25, 0.94)';
    stift.beginPath();
    stift.moveTo(cx - 6, cy + h / 2 - 1);
    stift.lineTo(cx, cy + h / 2 + 7);
    stift.lineTo(cx + 6, cy + h / 2 - 1);
    stift.closePath();
    stift.fill();
  }

  function zeichne(jetzt) {
    if (!layout || !z) return;
    // Safari ändert die Höhe, wenn seine Leisten kommen und gehen, oft ohne verlässliches Signal.
    if (leinwand.clientWidth && (leinwand.clientWidth !== layout.breite || leinwand.clientHeight !== layout.hoehe)) passeAn();
    const dt = Math.min(0.05, Math.max(0, (jetzt - letzteZeit) / 1000));
    letzteZeit = jetzt;
    const t = jetzt / 1000;

    arbeiteAb(jetzt);
    for (const l of [...laeufer]) {
      const p = l.dauer <= 0 ? 1 : (jetzt - l.start) / l.dauer;
      l.schritt(begrenze(p, 0, 1));
      if (p >= 1) laeufer = laeufer.filter((x) => x !== l);
    }
    const zielKlar = bild.ruhe >= RUHE_VOLL ? 1 : 0;
    klar += (zielKlar - klar) * Math.min(1, dt * 5);
    bewegeLichter(dt);

    stift.setTransform(dichte, 0, 0, dichte, 0, 0);
    stift.globalAlpha = 1;
    stift.globalCompositeOperation = 'source-over';
    stift.fillStyle = FARBE.nacht;
    stift.fillRect(0, 0, layout.breite, layout.hoehe);

    stift.save();
    const seitWackeln = jetzt - wirkung.wackeln;
    if (seitWackeln < 150) {
      const rest = 1 - seitWackeln / 150;
      stift.translate(Math.sin(seitWackeln / 9) * 5 * rest, Math.cos(seitWackeln / 7) * 3 * rest);
    }
    maleLichter(stift, layout, lichter, klar);
    // der Wagen bleibt unter den Anzeigen, auch während er beim Wechsel durchs Bild schiebt
    stift.beginPath();
    stift.rect(-20, layout.status.y + layout.status.h + 3, layout.breite + 40, layout.hoehe);
    stift.clip();
    maleWelt(t, jetzt);
    stift.restore();

    // Dunst und dunkle Ränder; bei voller Ruhe wird das Bild klar
    stift.fillStyle = `rgba(16, 22, 40, ${0.15 * (1 - klar)})`;
    stift.fillRect(0, 0, layout.breite, layout.hoehe);
    stift.globalAlpha = 0.62 - 0.4 * klar;
    stift.drawImage(schleier, 0, 0, layout.breite, layout.hoehe);
    stift.globalAlpha = 1;
    const seitTreffer = jetzt - wirkung.treffer;
    if (seitTreffer < 150 && !ruhig) {
      stift.fillStyle = `rgba(232, 64, 47, ${0.2 * (1 - seitTreffer / 150)})`;
      stift.fillRect(0, 0, layout.breite, layout.hoehe);
    }

    if (bild.blende > 0.01 && standbild) {
      stift.globalAlpha = bild.blende;
      stift.drawImage(standbild, 0, 0, layout.breite, layout.hoehe);
      stift.globalAlpha = 1;
    }

    // Anzeigen am Rand
    const { tafel, status } = layout;
    if (tafelbild) stift.drawImage(tafelbild, tafel.x, tafel.y, tafel.b, tafel.h);
    // In der Wiederholung sind die Herzen blass: Hier kostet nichts ein Herz.
    const verlust = bild.probe ? 0 : begrenze(1 - seitTreffer / 320, 0, 1);
    stift.globalAlpha = bild.probe ? 0.38 : 1;
    maleHerzen(stift, status.x, status.y + status.h / 2, bild.herzen, HERZEN_VOLL, verlust);
    stift.globalAlpha = 1;
    const zuwachs = begrenze(1 - (jetzt - wirkung.zuwachs) / 380, 0, 1);
    maleRuhe(stift, status.x + status.b, status.y + status.h / 2, bild.ruhe, RUHE_VOLL, zuwachs);
    const druck = begrenze(1 - (jetzt - wirkung.uhr) / 140, 0, 1);
    maleUhr(stift, layout.uhr, ABFAHRT + bild.zug, druck);
    maleTonknopf(stift, layout.ton, tonAn);
    // die laufende Prüfung als Symbol rechts neben der Uhr; ist sie erfüllt, wird gelocht
    const px = layout.uhr.x + layout.uhr.r + 24;
    const py = layout.uhr.y;
    const seitLochung = jetzt - wirkung.lochung;
    if (bild.pruefung) {
      maleSymbol(stift, bild.pruefung, px, py, 22, FARBE.warm);
    } else if (bild.gelocht && seitLochung >= 0 && seitLochung < 700) {
      const q = seitLochung / 700;
      stift.globalAlpha = 1 - q;
      maleSymbol(stift, bild.gelocht, px, py, 22, FARBE.warm);
      stift.fillStyle = FARBE.warm;
      stift.beginPath();
      stift.arc(px + 9, py - 9, 4 + q * 3, 0, Math.PI * 2);
      stift.fill();
      stift.globalAlpha = 1;
    }

    if (karte) {
      karte.einblenden = begrenze((jetzt - karte.start) / 150, 0, 1);
      karte.seit = jetzt - karte.start;
      // Rückblick: alle 1,4 Sekunden die nächste Tatsache, ein Tipp überspringt ihn
      if (karte.rueckblick && !karte.rueckblickFertig) {
        const i = Math.floor((jetzt - karte.start - 600) / RUECKBLICK_TAKT);
        if (i >= karte.rueckblick.length) karte.rueckblickFertig = true;
        karte.rueckblickZeile = i >= 0 && !karte.rueckblickFertig ? karte.rueckblick[i] : i < 0 ? karte.zeilen : null;
      } else if (karte.rueckblick) {
        karte.rueckblickZeile = null;
      }
      if (karte.geht) {
        karte.weg = begrenze((jetzt - karte.geht) / 150, 0, 1);
        if (ruhig) karte.weg = 1;
      }
      if (karte.weg >= 1) karte = null;
      else if (jetzt >= karte.start) maleKarte(stift, layout, karte, t);
    }
  }

  // ---------------------------------------------------------------- Auskunft

  // Was liegt an diesem Bildschirmpunkt?
  function wasLiegtBei(px, py) {
    if (karte && !karte.geht) {
      const m = kartenMasse(layout, karte.art);
      const w = m.weiter;
      const drin = (k) => k && px >= k.x && px <= k.x + k.b && py >= k.y && py <= k.y + k.h;
      if (karte.art === 'halt' && karte.rueckblick && !karte.rueckblickFertig) return { art: 'ueberspringen' };
      if (karte.art === 'halt' && !karte.ausgestiegen) {
        if (drin(m.aussteigen)) return { art: 'aussteigen' };
        if (drin(w)) return { art: 'weiter' };
        return { art: 'karte' };
      }
      if (drin(w)) return { art: 'weiter' };
      return { art: 'karte' };
    }
    const nah = (ort, r) => Math.hypot(px - ort.x, py - ort.y) <= r;
    if (nah(layout.uhr, Math.max(KNOPF / 2 + 2, layout.uhr.r + 2))) return { art: 'uhr' };
    if (nah(layout.ton, KNOPF / 2)) return { art: 'ton' };
    const feld = feldBei(layout, px, py);
    if (feld) return { art: 'feld', x: feld.x, y: feld.y };
    return null;
  }

  return {
    passeAn,
    neueFahrt,
    spiele,
    beschleunige,
    zeichne,
    wasLiegtBei,
    melder,
    setzeHinweis: (name) => {
      hinweis = name;
    },
    setzeTon: (an) => {
      tonAn = an;
    },
    zeigtKarte: () => karte !== null && !karte.geht,
    // während des Rückblicks am Halt beginnt noch keine neue Fahrt
    karteBereit: (jetzt) => karte !== null && !karte.geht && jetzt >= karte.start + 120 && !(karte.rueckblick && !karte.rueckblickFertig),
    ueberspringe: () => {
      if (karte && karte.rueckblick) karte.rueckblickFertig = true;
    },
    steigeAus: () => {
      if (karte && karte.art === 'halt') karte.ausgestiegen = true;
    },
    tuerfeld: () => TUERFELD,
  };
}

// --- eingabe.js
// Eingabe: Wischen, Tippen, Tastatur. Meldet nur, was der Mensch getan hat.
// Ein Wisch löst aus, sobald der Finger weit genug gewandert ist, nicht erst beim Loslassen.

const WISCHWEG = 18; // Pixel bis zum Auslösen
const TIPPWEG = 9; // weniger Bewegung gilt als Tippen

const TASTEN = {
  ArrowUp: 'hoch',
  ArrowRight: 'rechts',
  ArrowDown: 'runter',
  ArrowLeft: 'links',
  KeyW: 'hoch',
  KeyD: 'rechts',
  KeyS: 'runter',
  KeyA: 'links',
  Space: 'warten',
};

function wischrichtung(dx, dy) {
  if (Math.abs(dx) > Math.abs(dy)) return dx > 0 ? 'rechts' : 'links';
  return dy > 0 ? 'runter' : 'hoch';
}

// melde: { aktion(name, quelle), tipp(x, y), losgelassen(), karteOffen() }
function verbindeEingabe(flaeche, melde) {
  let finger = null;

  flaeche.addEventListener('pointerdown', (e) => {
    if (finger) return;
    finger = { id: e.pointerId, x: e.clientX, y: e.clientY, erledigt: false };
    if (flaeche.setPointerCapture) {
      try {
        flaeche.setPointerCapture(e.pointerId);
      } catch (fehler) {
        // ohne Fang geht es auch
      }
    }
    e.preventDefault();
  });

  flaeche.addEventListener('pointermove', (e) => {
    if (!finger || e.pointerId !== finger.id || finger.erledigt) return;
    const dx = e.clientX - finger.x;
    const dy = e.clientY - finger.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < WISCHWEG) return;
    finger.erledigt = true;
    melde.aktion(wischrichtung(dx, dy), 'wisch');
  });

  const loslassen = (e) => {
    if (!finger || e.pointerId !== finger.id) return;
    const dx = e.clientX - finger.x;
    const dy = e.clientY - finger.y;
    const fertig = finger.erledigt;
    finger = null;
    if (e.type === 'pointerup') melde.losgelassen();
    if (fertig || e.type !== 'pointerup') return;
    if (Math.hypot(dx, dy) < TIPPWEG) {
      // Der Canvas beginnt nicht immer in der Ecke: Neben Notch und Home-Balken bleibt ein Rand frei.
      const kasten = flaeche.getBoundingClientRect();
      melde.tipp(e.clientX - kasten.left, e.clientY - kasten.top);
    }
    else melde.aktion(wischrichtung(dx, dy), 'wisch'); // ein kurzer Wisch zählt auch
  };
  flaeche.addEventListener('pointerup', loslassen);
  flaeche.addEventListener('pointercancel', loslassen);
  flaeche.addEventListener('contextmenu', (e) => e.preventDefault());

  // Safari auf dem iPhone: kein Gummiband beim Ziehen, kein Zoom mit zwei Fingern oder Doppeltipp.
  const halt = (e) => e.preventDefault();
  document.addEventListener('touchmove', halt, { passive: false });
  document.addEventListener('gesturestart', halt);
  document.addEventListener('gesturechange', halt);
  document.addEventListener('dblclick', halt);
  // Den Ton gibt Safari erst frei, wenn ein Finger den Bildschirm wieder verlässt.
  document.addEventListener('touchend', () => melde.losgelassen(), { passive: true });
  document.addEventListener('click', () => melde.losgelassen());

  window.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const name = TASTEN[e.code] || (e.code === 'Enter' ? 'hoch' : null);
    if (!name) return;
    e.preventDefault();
    if (e.code === 'Enter' && !melde.karteOffen()) return;
    melde.aktion(name, 'taste');
  });
}

// --- speicher.js
// Was das Spiel sich merkt. Safari kann lokale Daten nach einigen Tagen ohne Besuch löschen,
// im privaten Modus fehlt der Speicher ganz. Deshalb liefert ladeStand() immer einen
// vollständigen Stand, auch aus dem Nichts oder aus Unsinn, und Schreiben darf scheitern.

const SCHLUESSEL = 'endstation.1';

// staerken: was der Spieler in früheren Fahrten verstanden hat (Stärken aus Schatten)
function leererStand() {
  // mehrAmTisch: so viele sitzen nach dem Gönnen später zusätzlich im Speisewagen
  // fahrkarte: die Lochungen der laufenden Reise, bis zum Halt
  // fahrt: Seed und Eingaben der letzten Fahrt, zum Fortsetzen nach dem Öffnen (kern/fortsetzen.js)
  return { gelernt: { wischen: false, ausweichen: false, anrempeln: false }, ton: true, staerken: { warten: false, sprint: false, rueckhalt: false }, mehrAmTisch: 0, fahrkarte: neueFahrkarte(), fahrt: null };
}

// Nimmt nur, was die erwartete Form hat. Alles andere bleibt auf dem Anfangswert.
function bereinigeStand(roh) {
  const stand = leererStand();
  if (!roh || typeof roh !== 'object') return stand;
  if (roh.gelernt && typeof roh.gelernt === 'object') {
    for (const name of Object.keys(stand.gelernt)) stand.gelernt[name] = roh.gelernt[name] === true;
  }
  if (typeof roh.ton === 'boolean') stand.ton = roh.ton;
  if (roh.staerken && typeof roh.staerken === 'object') {
    for (const name of Object.keys(stand.staerken)) stand.staerken[name] = roh.staerken[name] === true;
  }
  if (Number.isInteger(roh.mehrAmTisch) && roh.mehrAmTisch >= 0) stand.mehrAmTisch = Math.min(5, roh.mehrAmTisch);
  stand.fahrkarte = bereinigeFahrkarte(roh.fahrkarte);
  stand.fahrt = bereinigeAufzeichnung(roh.fahrt);
  return stand;
}

function ladeStand() {
  try {
    return bereinigeStand(JSON.parse(window.localStorage.getItem(SCHLUESSEL)));
  } catch (fehler) {
    return leererStand();
  }
}

function sichereStand(stand) {
  try {
    window.localStorage.setItem(SCHLUESSEL, JSON.stringify(stand));
    return true;
  } catch (fehler) {
    return false; // kein Speicher, kein Problem
  }
}

// --- ton.js
// Ton ist Zugabe: wenige erzeugte Klänge, keine Dateien. Fehlt Web Audio, bleibt es still.
// Er beginnt erst nach der ersten Berührung. Vibration nutzt das Spiel nicht, das iPhone kennt sie im Browser nicht.

function erzeugeTon() {
  let ac = null;
  let haupt = null;
  let rauschen = null;
  let an = true;

  // Darf erst nach einer Eingabe aufgerufen werden, sonst sperrt der Browser den Ton.
  function wecke() {
    if (!an) return;
    try {
      if (!ac) {
        const Klasse = window.AudioContext || window.webkitAudioContext;
        if (!Klasse) return;
        ac = new Klasse();
        haupt = ac.createGain();
        haupt.gain.value = 0.2;
        haupt.connect(ac.destination);
        rauschen = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
        const daten = rauschen.getChannelData(0);
        let wert = 12345;
        for (let i = 0; i < daten.length; i++) {
          wert = (Math.imul(wert, 1664525) + 1013904223) >>> 0;
          daten[i] = wert / 2147483648 - 1;
        }
      }
      // "suspended" vor der ersten Berührung, "interrupted" nach einem Anruf oder App-Wechsel am iPhone
      if (ac.state !== 'running') {
        const versuch = ac.resume();
        if (versuch && versuch.catch) versuch.catch(() => {});
      }
    } catch (fehler) {
      ac = null;
    }
  }

  function klang(von, bis, dauer, laut, form, spaeter) {
    if (!ac || !an) return;
    try {
      const t = ac.currentTime + (spaeter || 0);
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = form || 'sine';
      o.frequency.setValueAtTime(von, t);
      o.frequency.exponentialRampToValueAtTime(Math.max(20, bis), t + dauer);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(laut, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dauer);
      o.connect(g);
      g.connect(haupt);
      o.start(t);
      o.stop(t + dauer + 0.02);
    } catch (fehler) {
