      // still weiter
    }
  }

  function hauch(hoehe, dauer, laut, spaeter) {
    if (!ac || !an) return;
    try {
      const t = ac.currentTime + (spaeter || 0);
      const q = ac.createBufferSource();
      const f = ac.createBiquadFilter();
      const g = ac.createGain();
      q.buffer = rauschen;
      f.type = 'bandpass';
      f.frequency.value = hoehe;
      f.Q.value = 0.9;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(laut, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dauer);
      q.connect(f);
      f.connect(g);
      g.connect(haupt);
      q.start(t, (t * 7) % 0.5, dauer + 0.05);
    } catch (fehler) {
      // still weiter
    }
  }

  const KLAENGE = {
    schritt: () => hauch(1100, 0.05, 0.22),
    warten: () => klang(1400, 1300, 0.03, 0.08, 'square'),
    ungueltig: () => klang(130, 110, 0.05, 0.2, 'triangle'),
    schlag: () => {
      klang(170, 70, 0.1, 0.8, 'triangle');
      hauch(500, 0.06, 0.35);
    },
    besiegt: () => klang(392, 262, 0.2, 0.3, 'sine', 0.05),
    treffer: () => {
      klang(120, 45, 0.22, 0.9, 'sawtooth');
      hauch(260, 0.14, 0.5);
    },
    ausgewichen: () => {
      hauch(2200, 0.13, 0.22);
      klang(784, 988, 0.14, 0.14, 'sine', 0.03);
    },
    tuerAuf: () => {
      klang(880, 880, 0.1, 0.25, 'sine');
      klang(1175, 1175, 0.16, 0.25, 'sine', 0.13);
    },
    wagenwechsel: () => hauch(320, 0.24, 0.5),
    // Etappe 2
    tuerStoss: () => {
      klang(90, 60, 0.12, 0.6, 'triangle');
      hauch(180, 0.08, 0.3);
    },
    kontrolle: () => klang(2600, 2400, 0.02, 0.12, 'square'), // die Zange klickt
    sprint: () => hauch(1500, 0.12, 0.35),
    // Sprint einführen: an den in der Engstelle stoßen, und wie er Platz macht
    angestossen: () => klang(150, 130, 0.08, 0.3, 'triangle'),
    platzGemacht: () => klang(392, 523, 0.16, 0.13, 'sine', 0.04),
    geheilt: () => {
      klang(523, 523, 0.3, 0.16, 'sine');
      klang(659, 659, 0.36, 0.14, 'sine', 0.12);
    },
    tod: () => klang(196, 98, 0.5, 0.4, 'sine', 0.1),
    // die Wiederholung beim Begleiter: ein Hauch, der Ton sinkt hinein und steigt wieder heraus
    probe: () => {
      hauch(260, 0.3, 0.35);
      klang(440, 330, 0.3, 0.12, 'sine', 0.04);
    },
    probeEnde: () => {
      hauch(260, 0.3, 0.35);
      klang(330, 440, 0.3, 0.12, 'sine', 0.04);
    },
    // Bodensymbole: Was man betritt, antwortet sofort. Hell und steigend, was nützt; tief, was droht.
    angenommen: () => {
      klang(659, 659, 0.12, 0.16, 'sine');
      klang(880, 880, 0.2, 0.16, 'sine', 0.09);
    },
    gelocht: () => {
      klang(2600, 2400, 0.02, 0.14, 'square');
      klang(988, 988, 0.22, 0.14, 'sine', 0.05);
    },
    antwort: () => klang(587, 784, 0.18, 0.14, 'sine'),
    aufRot: () => {
      klang(220, 208, 0.09, 0.22, 'square');
      klang(220, 208, 0.09, 0.22, 'square', 0.13);
    },
    halt: () => {
      klang(523, 523, 0.3, 0.3, 'sine', 0.1);
      klang(659, 659, 0.3, 0.3, 'sine', 0.38);
      klang(784, 784, 0.5, 0.3, 'sine', 0.66);
    },
  };

  return {
    wecke,
    spiele(ereignisse) {
      const schon = new Set();
      for (const e of ereignisse) {
        const name = e.typ === 'schlag' && e.besiegt ? 'besiegt' : e.typ === 'gelocht' && !e.hell ? '' : e.typ;
        if ((e.typ === 'schritt' || e.typ === 'sprint') && e.rot && !schon.has('aufRot')) {
          KLAENGE.aufRot();
          schon.add('aufRot');
        }
        if (e.typ === 'schlag') KLAENGE.schlag();
        if (e.typ === 'halt' && e.hell > 0) klang(2600, 2400, 0.02, 0.12, 'square', 0.57); // der Schaffner locht
        if (KLAENGE[name] && !schon.has(name) && name !== 'schlag') KLAENGE[name]();
        schon.add(name);
      }
    },
    // Schienenstoß im Flusszustand
    takt() {
      hauch(170, 0.07, 0.4);
      klang(72, 50, 0.08, 0.4, 'sine');
    },
    setze(wert) {
      an = wert;
    },
  };
}

// --- main.js
// Einstieg: verbindet Kern, Anzeige, Eingabe, Ton und Speicher.
// Beim Öffnen steht man sofort im ersten Wagen, die erste Eingabe ist schon ein Zug.










const leinwand = document.getElementById('bild');
const anzeige = erzeugeAnzeige(leinwand);
const ton = erzeugeTon();

const stand = ladeStand(); // immer vollständig, auch wenn der Speicher leer, gelöscht oder gesperrt ist

const grobesZeigen = typeof matchMedia === 'function' && matchMedia('(pointer: coarse)').matches;
let mitTasten = !grobesZeigen;
let spiel = null;
let fahrten = 0;

// Zum Nachstellen einer Fahrt: Adresse mit #seed=Zahl
function festerSeed() {
  const fund = /[#&]seed=(\d+)/.exec(window.location.hash);
  return fund ? Number(fund[1]) : null;
}

function zeigeHinweise() {
  const g = stand.gelernt;
  anzeige.setzeHinweis({
    wischen: g.wischen ? null : mitTasten ? 'tasten' : 'wischen',
    ausweichen: !g.ausweichen,
    anrempeln: !g.anrempeln,
  });
}

function starteFahrt(jetzt) {
  const fest = festerSeed();
  const seed = fest !== null ? fest + fahrten : (Date.now() ^ Math.floor(Math.random() * 4294967296)) >>> 0;
  fahrten += 1;
  // Was die neue Fahrt mitnimmt: Stärken, Fahrkarte, nach einem Tod den Begleiter (siehe kern/reise.js)
  const optionen = optionenFuerFahrt(stand, spiel ? spiel.zustand : null);
  if (optionen.fahrkarte !== stand.fahrkarte) {
    stand.fahrkarte = optionen.fahrkarte; // nach dem Halt beginnt eine neue Reise
    sichereStand(stand);
  }
  // Für das Fortsetzen: die Optionen sichern, bevor das Spiel sie sieht. Mit festem Seed nicht,
  // damit Nachstellen und Prüfwerkzeuge die Fahrt eines Spielers nicht überschreiben.
  const vorher = JSON.parse(JSON.stringify(optionen));
  spiel = erzeugeSpiel(seed, optionen);
  stand.fahrt = fest === null ? neueAufzeichnung(seed, vorher, spiel.zustand) : null;
  if (fest === null) sichereStand(stand);
  anzeige.neueFahrt(spiel.zustand, jetzt);
  zeigeHinweise();
}

// Beim Öffnen: die gesicherte Fahrt nachspielen. Lief sie noch, steht man im selben Wagen in derselben
// Lage. War sie zu Ende, beginnt wie bisher eine neue, mit allem, was die alte mitgibt (Begleiter, Karte).
// Jeder Fehler beim Laden beginnt still eine neue Fahrt.
function beginne(jetzt) {
  const alt = festerSeed() === null ? spieleNach(stand.fahrt) : null;
  if (alt && alt.zustand.status === 'faehrt') {
    spiel = alt;
    fahrten = 1;
    anzeige.neueFahrt(spiel.zustand, jetzt);
    zeigeHinweise();
    return;
  }
  if (alt) spiel = alt;
  starteFahrt(jetzt);
}

function merke(ereignisse, aktion) {
  const g = stand.gelernt;
  const vorher = JSON.stringify([g, stand.staerken, stand.mehrAmTisch, stand.fahrkarte]);
  stand.fahrt = zeichneAuf(stand.fahrt, aktion, spiel.zustand);
  for (const e of ereignisse) {
    if (e.typ === 'schritt' || e.typ === 'schlag' || e.typ === 'warten') g.wischen = true;
    if (e.typ === 'ausgewichen') g.ausweichen = true;
    if (e.typ === 'schlag') g.anrempeln = true;
    if (e.typ === 'verstanden') stand.staerken[e.staerke] = true; // dauerhaft, auch für die nächsten Fahrten
    if (e.typ === 'gegoennt') stand.mehrAmTisch = e.mehrAmTisch; // zeigt sich erst bei einer späteren Fahrt
    if (e.typ === 'gelocht' || e.typ === 'aufgehellt') stand.fahrkarte = JSON.parse(JSON.stringify(spiel.zustand.fahrkarte));
  }
  const anders = JSON.stringify([g, stand.staerken, stand.mehrAmTisch, stand.fahrkarte]) !== vorher;
  // nach jedem Zug sichern: Das Handy kann die Seite jederzeit schließen
  if (anders || stand.fahrt) sichereStand(stand);
  if (anders) zeigeHinweise();
}

function gibEin(aktion, quelle) {
  const jetzt = performance.now();
  ton.wecke();
  if (quelle === 'taste' && !mitTasten) {
    mitTasten = true;
    zeigeHinweise();
  }
  if (spiel.zustand.status !== 'faehrt') {
    if (aktion === 'hoch' && anzeige.karteBereit(jetzt)) starteFahrt(jetzt);
    return;
  }
  anzeige.beschleunige(jetzt);
  const ereignisse = spiel.act(aktion);
  if (!ereignisse.length) return;
  anzeige.spiele(ereignisse, jetzt);
  ton.spiele(ereignisse);
  merke(ereignisse, aktion);
}

function tippe(x, y) {
  const ziel = anzeige.wasLiegtBei(x, y);
  if (!ziel) return;
  if (ziel.art === 'weiter') {
    gibEin('hoch', 'tipp');
  } else if (ziel.art === 'ueberspringen') {
    anzeige.ueberspringe(); // der Rückblick am Halt lässt sich mit einem Tipp überspringen
  } else if (ziel.art === 'aussteigen') {
    anzeige.steigeAus(); // das Bild bleibt, nichts beginnt von selbst
  } else if (ziel.art === 'ton') {
    stand.ton = !stand.ton;
    ton.setze(stand.ton);
    ton.wecke();
    anzeige.setzeTon(stand.ton);
    sichereStand(stand);
  } else if (ziel.art === 'uhr') {
    gibEin('warten', 'tipp');
  } else if (ziel.art === 'feld') {
    const s = spiel.zustand.spieler;
    const dx = ziel.x - s.x;
    const dy = ziel.y - s.y;
    if (dx === 0 && dy === 0) gibEin('warten', 'tipp');
    else if (abstand(ziel, s) === 1) gibEin(dx === 1 ? 'rechts' : dx === -1 ? 'links' : dy === 1 ? 'runter' : 'hoch', 'tipp');
    // zwei Felder weit in gerader Linie: Sprint, wer den Drängler verstanden hat. Sonst geschieht nichts.
    else if (abstand(ziel, s) === 2 && (dx === 0 || dy === 0)) gibEin(`sprint-${dx > 0 ? 'rechts' : dx < 0 ? 'links' : dy > 0 ? 'runter' : 'hoch'}`, 'tipp');
  }
}

function schleife(jetzt) {
  anzeige.zeichne(jetzt);
  window.requestAnimationFrame(schleife);
}

// Nur beim Nachstellen mit festem Seed oder mit #probe: Der Zustand lässt sich von außen ablesen, nicht ändern.
if (festerSeed() !== null || /[#&]probe\b/.test(window.location.hash)) window.endstationZustand = () => JSON.stringify(spiel.zustand);

ton.setze(stand.ton);
anzeige.setzeTon(stand.ton);
anzeige.melder.takt = () => ton.takt();
anzeige.passeAn();
beginne(performance.now());
// Manche Browser geben den Ton erst frei, wenn ein Finger losgelassen wurde, nicht schon beim Wischen.
verbindeEingabe(leinwand, { aktion: gibEin, tipp: tippe, losgelassen: () => ton.wecke(), karteOffen: () => anzeige.zeigtKarte() });
for (const anlass of ['resize', 'orientationchange', 'pageshow']) window.addEventListener(anlass, () => anzeige.passeAn());
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => anzeige.passeAn());
window.requestAnimationFrame(schleife);
})();
</script>
