  background: #080a10;

}

<script>
(function () {
'use strict';

// --- kern/feld.js
// Das Raster eines Wagens und alles, was nur mit Geometrie zu tun hat.

const BREITE = 5;
const HOEHE = 8;
const STARTFELD = { x: 2, y: 7 };
const TUERFELD = { x: 2, y: 0 }; // das Feld vor der Tür, die Tür liegt darüber

const RICHTUNG = {
  hoch: { x: 0, y: -1 },
  rechts: { x: 1, y: 0 },
  runter: { x: 0, y: 1 },
  links: { x: -1, y: 0 },
};
const RICHTUNGSNAMEN = ['hoch', 'rechts', 'runter', 'links'];

function imFeld(x, y) {
  return x >= 0 && x < BREITE && y >= 0 && y < HOEHE;
}

function feldNr(x, y) {
  return y * BREITE + x;
}

function abstand(a, b) {
  return Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
}

// Breitensuche: Entfernung jedes Feldes zum Ziel in Schritten.
// begehbar(x, y) entscheidet, wo man gehen darf. Das Zielfeld zählt immer.
// Unerreichbare Felder behalten -1.
function entfernungen(ziel, begehbar) {
  const weit = new Array(BREITE * HOEHE).fill(-1);
  const schlange = [{ x: ziel.x, y: ziel.y }];
  weit[feldNr(ziel.x, ziel.y)] = 0;
  for (let i = 0; i < schlange.length; i++) {
    const f = schlange[i];
    const d = weit[feldNr(f.x, f.y)];
    for (const name of RICHTUNGSNAMEN) {
      const x = f.x + RICHTUNG[name].x;
      const y = f.y + RICHTUNG[name].y;
      if (!imFeld(x, y) || weit[feldNr(x, y)] !== -1 || !begehbar(x, y)) continue;
      weit[feldNr(x, y)] = d + 1;
      schlange.push({ x, y });
    }
  }
  return weit;
}

// Der nächste Schritt von "von" in Richtung Ziel, anhand einer Entfernungskarte.
// Bei Gleichstand wird zuerst die größere Lücke geschlossen, danach gilt die
// feste Reihenfolge der Richtungen. So bewegt sich jede Figur immer gleich.
function naechsterSchritt(von, weit, ziel) {
  const hier = weit[feldNr(von.x, von.y)];
  if (hier <= 0) return null;
  let bester = null;
  let besteLuecke = -1;
  for (const name of RICHTUNGSNAMEN) {
    const x = von.x + RICHTUNG[name].x;
    const y = von.y + RICHTUNG[name].y;
    if (!imFeld(x, y) || weit[feldNr(x, y)] !== hier - 1) continue;
    const luecke = RICHTUNG[name].x !== 0 ? Math.abs(ziel.x - von.x) : Math.abs(ziel.y - von.y);
    if (luecke > besteLuecke) {
      bester = { x, y, richtung: name };
      besteLuecke = luecke;
    }
  }
  return bester;
}

// --- kern/lage.js
// Fragen an den Spielzustand: Was steht wo, was ist markiert.



function istHindernis(z, x, y) {
  return z.wagen.plan[y][x] !== '.';
}

function gegnerAuf(z, x, y) {
  for (const g of z.gegner) if (g.x === x && g.y === y) return g;
  return null;
}

function spielerAuf(z, x, y) {
  return z.spieler.x === x && z.spieler.y === y;
}

// frei heißt: im Wagen, kein Hindernis, keine Figur
function istFrei(z, x, y) {
  return imFeld(x, y) && !istHindernis(z, x, y) && !gegnerAuf(z, x, y) && !spielerAuf(z, x, y);
}

function istMarkiert(z, x, y) {
  for (const g of z.gegner) {
    if (g.ansage && g.ansage.some((f) => f.x === x && f.y === y)) return true;
  }
  return false;
}

// Der Vorderste einer Reisegruppe ist das lebende Mitglied mit dem kleinsten Rang.
function istVorderster(z, g) {
  if (g.typ !== 'gruppe') return false;
  for (const anderer of z.gegner) {
    if (anderer.typ === 'gruppe' && anderer.gruppe === g.gruppe && anderer.rang < g.rang) return false;
  }
  return true;
}

// Darf die Tür aufgehen? Wenn kein Gegner mehr steht. Im Wagen des Kontrolleurs gehört
// die Tür ihm: Sie geht auf, sobald er fort ist, auch wenn andere noch dort sind.
function tuerFrei(z) {
  if (z.gegner.length === 0) return true;
  return z.wagen.mitKontrolleur === true && !z.gegner.some((g) => g.typ === 'kontrolleur');
}

// --- kern/zufall.js
// Zufall mit Seed. Der Stand liegt im Spielzustand, damit jede Fahrt
// mit demselben Seed und denselben Eingaben gleich verläuft.

function naechsteZufallszahl(z) {
  z.zufall = (z.zufall + 0x6d2b79f5) >>> 0;
  let t = z.zufall;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

// ganze Zahl von 0 bis n - 1
function wuerfle(z, n) {
  return Math.floor(naechsteZufallszahl(z) * n);
}

// --- kern/wagen.js
// Die Wagen einer Fahrt. Zahlen sind Startwerte.
// "art" ist die Kennung des Wagens, sein Name für die Anzeige steht in texte.js.
//
// Plan: . frei, S Sitz, F Fahrrad, K Koffer, W Wand, T Tisch. Alles außer "." ist ein Hindernis.
// Jeder Plan hat 8 Zeilen mit 5 Zeichen. Start unten Mitte, Tür oben Mitte.
// Ausnahme: Im sicheren Wagen gibt es keine Ankündigungen, dort darf eine Engstelle einspurig sein.
// Gegner: "orte" sind mögliche Startfelder, eines wird ausgelost.
// Eine Reisegruppe hat "ketten": mögliche Aufstellungen, der Vorderste zuerst.
// Alle Angaben gelten ungespiegelt, der Wagen wird zufällig gespiegelt.
//
// Bauregel, damit sich jede Ankündigung mit einem Schritt verlassen lässt:
// Jedes freie Feld hat mindestens einen freien Nachbarn links oder rechts
// und mindestens einen freien Nachbarn oben oder unten. Es gibt also keine
// Sackgassen und keine einspurigen Gänge. tests/wagen.test.js prüft das.




const WAGENPLAENE = [
  {
    art: 'sitzwagen',
    plan: [
      '.....',
      '.....',
      'S...S',
      '.....',
      '.....',
      'S...S',
      '.....',
      '.....',
    ],
    gegner: [
      { typ: 'pendler', langsam: true, holtAus: true, orte: [[2, 2], [1, 2], [3, 2]] },
    ],
  },
  {
    art: 'fahrradabteil',
    plan: [
      '.....',
      '.....',
      'F....',
      'F...K',
      'F....',
      'FF...',
      '.....',
      '.....',
    ],
    gegner: [
      { typ: 'pendler', orte: [[3, 1], [4, 1], [3, 0]] },
      { typ: 'pendler', orte: [[1, 3], [2, 3], [1, 2]] },
      { typ: 'pendler', orte: [[4, 2], [3, 3], [4, 4]] },
    ],
  },
  // Autoritätswagen, fest in der Mitte der Fahrt. Der Kontrolleur steht neben der Tür,
  // dazu zwei Pendler. Bedingungen, Pause und Vorrang gibt es erst mit der Regie (Etappe 3).
  // Die Tür gehört dem Kontrolleur: Sie geht auf, sobald er fort ist. Verhalten in gegner.js.
  {
    art: 'mittelwagen',
    autoritaet: true,
    plan: [
      '.....',
      '.....',
      'S...S',
      '..K..',
      '.....',
      'S...S',
      '.....',
      '.....',
    ],
    gegner: [
      { typ: 'kontrolleur', orte: [[1, 0]] },
      { typ: 'pendler', orte: [[0, 3], [1, 4]] },
      { typ: 'pendler', orte: [[4, 3], [3, 4]] },
    ],
  },
  // Speisewagen: der sichere Ort nach dem Autoritätswagen. Keine Gegner, die Tür ist offen, nie passiert
  // etwas. Beim Hineingehen heilt er zwei Herzen. Wer einen Gegnertyp verstanden hat, findet ihn hier als
  // Fahrgast am Tisch. Bedingungen, Pause und Vorrang gibt es erst mit der Regie (Etappe 3).
  {
    art: 'speisewagen',
    sicher: true,
    heilt: 2,
    plan: [
      'K...K',
      'S...S',
      'T...T',
      'S...S',
      'KK.KK',
      'S...S',
      'T...T',
      'S...S',
    ],
    gegner: [],
    // Engstelle zwischen den Koffern. Wer den Drängler verstanden hat, findet ihn hier stehend:
    // Mit einem Sprint kommt man an ihm vorbei, sonst macht er nach zwei Zügen Platz. Siehe spiel.js.
    engstelle: [2, 4],
    fahrgaeste: [
      { typ: 'pendler', staerke: 'warten', x: 0, y: 1 },
      { typ: 'gruppe', staerke: 'rueckhalt', x: 4, y: 3 },
      { typ: 'draengler', staerke: 'sprint', x: 0, y: 7 },
    ],
    // freie Plätze für die, die nach dem Gönnen später dazukommen
    mehrPlaetze: [[4, 1], [0, 3], [0, 5], [4, 7]],
    begleiterPlatz: [4, 5], // hier sitzt nach einem Tod der Begleiter
  },
  {
    art: 'grossraumwagen',
    plan: [
      '.....',
      '.....',
      'SS..S',
      '.....',
      '.....',
      'S..SS',
      '.....',
      '.....',
    ],
    gegner: [
      { typ: 'gruppe', ketten: [[[2, 1], [2, 0], [1, 0]], [[2, 1], [2, 0], [3, 0]]] },
      { typ: 'pendler', orte: [[0, 3], [1, 3]] },
      { typ: 'pendler', orte: [[4, 3], [3, 3]] },
    ],
  },
  {
    art: 'liegewagen',
    plan: [
      '.....',
      '.....',
      '..WWW',
      '.....',
      '.....',
      '..WWW',
      '.....',
      '.....',
    ],
    gegner: [
      { typ: 'draengler', orte: [[0, 0], [1, 0], [0, 1]] },
      { typ: 'pendler', orte: [[4, 0], [3, 0]] },
      { typ: 'pendler', orte: [[4, 3], [3, 3]] },
      { typ: 'pendler', orte: [[4, 4], [3, 4]] },
    ],
  },
  {
    art: 'gepaeckwagen',
    plan: [
      'K...K',
      '.....',
      '..K..',
      'K....',
      '....K',
      '..K..',
      '.....',
      'K...K',
    ],
    gegner: [
      { typ: 'draengler', orte: [[4, 1], [3, 0]] },
      { typ: 'gruppe', ketten: [[[2, 1], [2, 0], [1, 0]], [[1, 1], [1, 0], [2, 0]]] },
      { typ: 'pendler', orte: [[1, 3], [1, 2]] },
      { typ: 'pendler', orte: [[3, 3], [4, 3]] },
    ],
  },
];

const WAGENZAHL = WAGENPLAENE.length;

// Baut den Wagen mit der Nummer nr (ab 0). Gibt Plan und Gegnervorgaben zurück.
function baueWagen(nr, z) {
  const vorlage = WAGENPLAENE[nr];
  const gespiegelt = wuerfle(z, 2) === 1;
  const sx = (x) => (gespiegelt ? BREITE - 1 - x : x);
  const plan = vorlage.plan.map((zeile) => (gespiegelt ? [...zeile].reverse().join('') : zeile));
  const gegner = [];
  let gruppe = 0;
  for (const vorgabe of vorlage.gegner) {
    if (vorgabe.typ === 'gruppe') {
      const kette = vorgabe.ketten[wuerfle(z, vorgabe.ketten.length)];
      gruppe += 1;
      kette.forEach(([x, y], rang) => gegner.push({ typ: 'gruppe', x: sx(x), y, gruppe, rang }));
    } else {
      const [x, y] = vorgabe.orte[wuerfle(z, vorgabe.orte.length)];
      gegner.push({ typ: vorgabe.typ, x: sx(x), y, langsam: vorgabe.langsam === true, holtAus: vorgabe.holtAus === true });
    }
  }
  const fahrgaeste = (vorlage.fahrgaeste || []).map((f) => ({ typ: f.typ, staerke: f.staerke, x: sx(f.x), y: f.y }));
  const mehrPlaetze = (vorlage.mehrPlaetze || []).map(([x, y]) => ({ x: sx(x), y }));
  const engstelle = vorlage.engstelle ? { x: sx(vorlage.engstelle[0]), y: vorlage.engstelle[1] } : null;
  const begleiterPlatz = vorlage.begleiterPlatz ? { x: sx(vorlage.begleiterPlatz[0]), y: vorlage.begleiterPlatz[1] } : null;
  return { nr, art: vorlage.art, plan, gespiegelt, gegner, fahrgaeste, mehrPlaetze, begleiterPlatz, engstelle, sicher: vorlage.sicher === true, heilt: vorlage.heilt || 0 };
}

// --- kern/fahrkarte.js
// Die Fahrkarte: sechs Prüfungen aus dem Bahnalltag und Platz für Sonder-Lochungen.
// Kennt weder Bildschirm noch Browser.
//
// Eine Lochung ist hell oder dunkel:
//   { art: 'pruefung', id, hell: true }            eine erfüllte Prüfung
//   { art: 'tod', durch, hell: false }             ein Tod; wird hell, wenn man es einmal anders macht
//   { art: 'ehrlich', durch, hell: true }          die ehrliche Antwort an den Begleiter, je Ursache eine
//   { art: 'verstanden', durch, hell: true }       den Kontrolleur durchschaut oder eine Stärke verdient, je Gegner eine
//
// Lochungen sind eine Spur, keine Sperre: Am Halt steigt jeder aus. Sie bestimmen nur, was der Rückblick zeigt.
//
// Angebot: In jedem Wagen außer dem sicheren leuchtet ein Symbol auf einem Feld. Drauftreten heißt
// annehmen. Die Prüfung gilt bis zum Verlassen des Wagens, dann wird ausgewertet. Vorbeigehen kostet nichts,
// eine nicht erfüllte Prüfung auch nicht.






const WAGENARTEN = WAGENPLAENE.map((w) => w.art);
// der Ort einer Lochung, für den Rückblick am Halt
function ort(l, roh) {
  if (roh && WAGENARTEN.includes(roh.wagen)) l.wagen = roh.wagen;
  return l;
}

// Reihenfolge wie auf der Karte. Die Worte stehen in texte.js unter "pruefung".
//   aufregen     Nicht aufregen          kein Schlag
//   aussteigen   Erst aussteigen lassen  drei Züge hintereinander stillstehen
//   rempeln      Ohne Rempeln            kein Treffer
//   draengeln    Nicht drängeln          nie auf ein rotes Feld treten
//   puenktlich   Pünktlich               den Wagen in höchstens zwölf Zügen verlassen
//   ruhe         Ruhe bewahren           volle Ruhe erreichen
const PRUEFUNGEN = ['aufregen', 'aussteigen', 'rempeln', 'draengeln', 'puenktlich', 'ruhe'];
const AUSSTEIGEN_ZUEGE = 3;
const PUENKTLICH_ZUEGE = 12;
const TODESARTEN = ['pendler', 'gruppe', 'draengler', 'kontrolleur', 'tuer'];
const VERSTEHBAR = ['pendler', 'gruppe', 'draengler', 'kontrolleur'];
const SONDER_HOECHSTENS = 6;
// Einführung: Solange die Fahrkarte keine Prüfung trägt, liegt das erste Angebot in Wagen 1 auf dem Feld
// vor der Tür. Daran kommt niemand vorbei, und dort ist der Wagen schon ruhig. "Erst aussteigen lassen"
// passt an die Tür und verlangt nur dreimal Stehen, das ist dort ohne Gefahr zu schaffen.
const EINFUEHRUNG = 'aussteigen';

function neueFahrkarte() {
  return { lochungen: [] };
}

// Nimmt nur, was die erwartete Form hat. Für Optionen des Kerns und für den Speicher.
function bereinigeFahrkarte(roh) {
  const karte = neueFahrkarte();
  if (!roh || typeof roh !== 'object' || !Array.isArray(roh.lochungen)) return karte;
  for (const l of roh.lochungen) {
    if (!l || typeof l !== 'object') continue;
    if (l.art === 'pruefung' && PRUEFUNGEN.includes(l.id) && !istGelocht(karte, l.id)) {
      karte.lochungen.push(ort({ art: 'pruefung', id: l.id, hell: true }, l));
    } else if (l.art === 'tod' && TODESARTEN.includes(l.durch) && karte.lochungen.filter((x) => x.art === 'tod').length < SONDER_HOECHSTENS) {
      karte.lochungen.push(ort({ art: 'tod', durch: l.durch, hell: l.hell === true }, l));
    } else if (l.art === 'ehrlich' && TODESARTEN.includes(l.durch) && !karte.lochungen.some((x) => x.art === 'ehrlich' && x.durch === l.durch)) {
      karte.lochungen.push(ort({ art: 'ehrlich', durch: l.durch, hell: true }, l));
    } else if (l.art === 'verstanden' && VERSTEHBAR.includes(l.durch) && !karte.lochungen.some((x) => x.art === 'verstanden' && x.durch === l.durch)) {
      karte.lochungen.push(ort({ art: 'verstanden', durch: l.durch, hell: true }, l));
    }
  }
  return karte;
}

function istGelocht(karte, id) {
  return karte.lochungen.some((l) => l.art === 'pruefung' && l.id === id);
}

function helleLochungen(karte) {
  return karte.lochungen.filter((l) => l.hell).length;
}

// Beim Einrichten eines Wagens: eine noch nicht gelochte Prüfung auf ein freies Feld legen.
// Die Angebote würfeln mit eigenem Zufall (z.kartenzufall), damit derselbe Seed dieselben Wagen ergibt
// wie ohne Fahrkarte.
function stelleAngebot(z) {
  z.angebot = null;
  z.pruefung = null;
  if (z.wagen.sicher) return;
  const offen = PRUEFUNGEN.filter((id) => !istGelocht(z.fahrkarte, id));
  if (!offen.length) return;
  const felder = [];
  for (let y = 0; y < HOEHE; y++) {
    for (let x = 0; x < BREITE; x++) {
      if (istHindernis(z, x, y) || gegnerAuf(z, x, y)) continue;
      if (abstand({ x, y }, STARTFELD) < 2 || (x === TUERFELD.x && y === TUERFELD.y)) continue;
      felder.push({ x, y });
    }
  }
  if (!felder.length) return;
  const id = offen[wuerfle(z.kartenzufall, offen.length)];
  const feld = felder[wuerfle(z.kartenzufall, felder.length)];
  z.angebot = { id, x: feld.x, y: feld.y };
  // gewürfelt wird trotzdem, damit die Angebote der späteren Wagen dieselben bleiben
  if (istEinfuehrung(z)) z.angebot = { id: EINFUEHRUNG, x: TUERFELD.x, y: TUERFELD.y };
}

// Gilt beim Einrichten von Wagen 1, solange noch keine Prüfung gelocht ist.
function istEinfuehrung(z) {
  return z.wagenNr === 0 && !z.fahrkarte.lochungen.some((l) => l.art === 'pruefung');
}

// Der Spieler ist auf das Feld des Angebots getreten.
function nimmAn(z, ereignisse) {
  const a = z.angebot;
  if (!a || z.spieler.x !== a.x || z.spieler.y !== a.y) return;
  z.angebot = null;
  z.pruefung = { id: a.id, start: z.zuegeImWagen, still: 0, langesStill: 0, schlag: false, treffer: false, rot: false, ruhe: z.spieler.ruhe >= 3 };
  ereignisse.push({ typ: 'angenommen', phase: 0, id: a.id });
}

// Nach jedem Zug: was für die laufende Prüfung zählt. tat wie im Kern, getroffen: wurde der Spieler getroffen.
function beobachte(z, tat, getroffen, aufRot) {
  const p = z.pruefung;
  if (!p) return;
  if (tat.art === 'schlag' || tat.sprintTreffer) p.schlag = true;
  if (getroffen) p.treffer = true;
  if (aufRot) p.rot = true;
  p.still = tat.art === 'warten' ? p.still + 1 : 0;
  p.langesStill = Math.max(p.langesStill, p.still);
  if (z.spieler.ruhe >= 3) p.ruhe = true;
}

function erfuellt(z, p) {
  if (p.id === 'aufregen') return !p.schlag;
  if (p.id === 'aussteigen') return p.langesStill >= AUSSTEIGEN_ZUEGE;
  if (p.id === 'rempeln') return !p.treffer;
  if (p.id === 'draengeln') return !p.rot;
  if (p.id === 'puenktlich') return z.zuegeImWagen - p.start <= PUENKTLICH_ZUEGE;
  if (p.id === 'ruhe') return p.ruhe;
  return false;
}

// Beim Verlassen eines Wagens: die laufende Prüfung auswerten und dunkle Lochungen aufhellen,
// wenn man es in diesem Wagen anders gemacht hat.
function werteWagenAus(z, ereignisse, phase) {
  const p = z.pruefung;
  if (p && erfuellt(z, p) && !istGelocht(z.fahrkarte, p.id)) {
    z.fahrkarte.lochungen.push({ art: 'pruefung', id: p.id, hell: true, wagen: z.wagen.art });
    ereignisse.push({ typ: 'gelocht', phase, art: 'pruefung', id: p.id, hell: true });
  }
  z.pruefung = null;
  for (const l of z.fahrkarte.lochungen) {
    if (l.art !== 'tod' || l.hell) continue;
    const anders = l.durch === 'tuer' ? !z.aufgebrochen : z.wagen.typen.includes(l.durch) && !z.getroffenVon.includes(l.durch);
    if (anders) {
      l.hell = true;
      ereignisse.push({ typ: 'aufgehellt', phase, durch: l.durch });
    }
  }
}

// Ein Tod hinterlässt eine dunkle Lochung, je Ursache höchstens eine, solange sie dunkel ist.
function lochungFuerTod(z, durch, ereignisse, phase) {
  const karte = z.fahrkarte;
  if (karte.lochungen.some((l) => l.art === 'tod' && l.durch === durch && !l.hell)) return;
  if (karte.lochungen.filter((l) => l.art === 'tod').length >= SONDER_HOECHSTENS) return;
  karte.lochungen.push({ art: 'tod', durch, hell: false, wagen: z.wagen.art });
  ereignisse.push({ typ: 'gelocht', phase, art: 'tod', durch, hell: false });
}

// Verstehen locht: wer den Kontrolleur durchschaut oder eine Stärke verdient, bekommt eine helle Lochung,
// je Gegner eine auf der Karte. In der Wiederholung zählt nichts.
function lochungFuerVerstehen(z, durch, ereignisse, phase) {
  if (z.probe || !VERSTEHBAR.includes(durch)) return;
  const karte = z.fahrkarte;
  if (karte.lochungen.some((l) => l.art === 'verstanden' && l.durch === durch)) return;
  karte.lochungen.push({ art: 'verstanden', durch, hell: true, wagen: z.wagen.art });
  ereignisse.push({ typ: 'gelocht', phase, art: 'verstanden', durch, hell: true });
}

// --- kern/begleiter.js
// Der Begleiter. Nach einem Tod sitzt er im Speisewagen. Wer neben ihn tritt, spricht mit ihm:
// „Woran lag es?" Drei Antworten liegen vor ihm auf dem Boden, draufgehen heißt antworten.
// Das Spiel kennt den Grund. Die ehrliche Antwort gibt eine helle Lochung, je Todesursache eine.
// Er nennt nicht, was gelungen ist (Entscheidung des Auftraggebers vom 19.11.: kein Lob).
// Nach der Antwort liegt neben ihm „Noch mal": Wer draufgeht, spielt den Wagen, in dem die letzte
// Fahrt endete, noch einmal, gefahrlos und folgenlos. Die Wiederholung selbst steht in spiel.js.
// Kennt weder Bildschirm noch Browser.





const ANTWORTARTEN = ['pendler', 'gruppe', 'draengler', 'kontrolleur', 'tuer', 'pech'];
const URSACHEN = ['pendler', 'gruppe', 'draengler', 'kontrolleur', 'tuer'];

// Die Szene, in der die vorige Fahrt endete: Wagennummer und Stand des Zufalls vor ihrem Bau.
// Nimmt nur, was die erwartete Form hat, sonst null. Der sichere Wagen ist nie eine solche Szene.
function bereinigeSzene(roh) {
  if (!roh || typeof roh !== 'object') return null;
  const { nr, zufall } = roh;
  if (!Number.isInteger(nr) || nr < 0 || nr >= WAGENPLAENE.length || WAGENPLAENE[nr].sicher) return null;
  if (!Number.isInteger(zufall) || zufall < 0 || zufall > 0xffffffff) return null;
  return { nr, zufall };
}

// Beim Einrichten des Speisewagens: Er sitzt dort, wenn die vorige Fahrt mit einem Tod endete.
function setzeBegleiter(z, platz) {
  z.begleiter = null;
  if (!z.wagen.sicher || !z.begleiterDurch || !platz) return;
  z.begleiter = { durch: z.begleiterDurch, szene: z.begleiterSzene, x: platz.x, y: platz.y, antworten: null, gesprochen: false, wiederholen: null };
  z.begleiterDurch = null; // er sitzt nur beim ersten Besuch dieser Fahrt dort
  z.begleiterSzene = null;
}

function frei(z, x, y) {
  return x >= 0 && x < BREITE && y >= 0 && y < z.wagen.plan.length && z.wagen.plan[y][x] === '.' && !(z.spieler.x === x && z.spieler.y === y);
}

// „Noch mal" liegt auf einem freien Feld neben ihm, auf dem der Spieler gerade nicht steht.
function feldNeben(z, b) {
  for (const name of RICHTUNGSNAMEN) {
    const x = b.x + RICHTUNG[name].x;
    const y = b.y + RICHTUNG[name].y;
    if (frei(z, x, y)) return { x, y };
  }
  return null;
}

// Nach jedem Schritt im Speisewagen. Gibt true zurück, wenn der Spieler auf „Noch mal" getreten ist:
// Dann beginnt spiel.js die Wiederholung.
function sprichMitBegleiter(z, ereignisse) {
  const b = z.begleiter;
  if (!b) return false;
  const s = z.spieler;
  if (b.wiederholen) {
    if (s.x !== b.wiederholen.x || s.y !== b.wiederholen.y) return false;
    b.wiederholen = null; // einmal je Tod
    return true;
  }
  if (b.gesprochen) return false;
  if (b.antworten) {
    const a = b.antworten.find((x) => x.x === s.x && x.y === s.y);
    if (!a) return false;
    b.antworten = null;
    b.gesprochen = true;
    const ehrlich = a.id === b.durch;
    b.wiederholen = b.szene ? feldNeben(z, b) : null;
    ereignisse.push({ typ: 'antwort', phase: 0, id: a.id, ehrlich, wiederholen: b.wiederholen ? { ...b.wiederholen } : null });
    const karte = z.fahrkarte;
    if (ehrlich && !karte.lochungen.some((l) => l.art === 'ehrlich' && l.durch === b.durch)) {
      karte.lochungen.push({ art: 'ehrlich', durch: b.durch, hell: true, wagen: z.wagen.art });
      ereignisse.push({ typ: 'gelocht', phase: 0, art: 'ehrlich', durch: b.durch, hell: true });
    }
    return false;
  }
  if (Math.abs(s.x - b.x) + Math.abs(s.y - b.y) !== 1) return false;
  // die drei Antworten: die ehrliche, eine andere Ursache und „Pech", in zufälliger Reihenfolge
  const andere = URSACHEN.filter((u) => u !== b.durch);
  const ids = [b.durch, andere[wuerfle(z.kartenzufall, andere.length)], 'pech'];
  for (let i = ids.length - 1; i > 0; i--) {
    const j = wuerfle(z.kartenzufall, i + 1);
    [ids[i], ids[j]] = [ids[j], ids[i]];
  }
  // auf drei freie Felder einer Reihe vor ihm, im Gang
  for (const dy of [1, 2, -2, -1]) { // zuerst unter ihm: Über ihm steht die Frage
    const y = b.y + dy;
    const felder = [1, 2, 3].map((x) => ({ x, y }));
    if (felder.every((f) => frei(z, f.x, f.y))) {
      b.antworten = ids.map((id, i) => ({ id, x: felder[i].x, y: felder[i].y }));
      ereignisse.push({ typ: 'gespraech', phase: 0, antworten: b.antworten.map((a) => ({ ...a })) });
      return false;
    }
  }
  return false;
}

// --- kern/gegner.js
// Verhalten der Fahrgäste. Jede Figur folgt festen Regeln ohne Zufall,
// damit man sie durchschauen kann.
//
// Ablauf eines Gegnerzugs:
//   1. Alle angekündigten Angriffe treffen ein (loeseAnsagenEin).
//   2. Wer nicht angegriffen hat, bewegt sich oder kündigt an (planeGegner).
// Ein Angriff trifft also immer genau einen Zug nach seiner Ankündigung.




const GEGNERWERTE = {
  pendler: { hp: 2 },
  gruppe: { hp: 1, schritte: 2 },
  draengler: { hp: 3, erschoepfung: 1 },
  kontrolleur: { hp: 5, schaden: 2, geduld: 3 },
};

// Wie viele Herzen ein Treffer dieser Figur kostet
function schadenVon(g) {
  return GEGNERWERTE[g.typ].schaden || 1;
}

function neuerGegner(id, vorgabe) {
  const g = { id, typ: vorgabe.typ, x: vorgabe.x, y: vorgabe.y, hp: GEGNERWERTE[vorgabe.typ].hp, ansage: null };
  if (g.typ === 'pendler') {
    g.langsam = vorgabe.langsam === true;
    g.holtAus = vorgabe.holtAus === true; // holt einmal ins Leere aus, siehe planePendler
    g.pause = 0;
  } else if (g.typ === 'gruppe') {
    g.gruppe = vorgabe.gruppe;
    g.rang = vorgabe.rang;
  } else if (g.typ === 'draengler') {
    g.erschoepft = 0;
  } else if (g.typ === 'kontrolleur') {
    g.ruhig = 0; // so viele Züge steht der Spieler schon ruhig in seiner Nähe
    g.posten = { x: vorgabe.x, y: vorgabe.y };
  }
  return g;
}

function kopie(f) {
  return { x: f.x, y: f.y };
}

// Felder, die für eine Figur begehbar sind: kein Hindernis, keine andere Figur.
function begehbarFuer(z, g) {
  return (x, y) => !istHindernis(z, x, y) && !spielerAuf(z, x, y) && (gegnerAuf(z, x, y) || g) === g;
}

// Die Figur läuft die angekündigten Felder ab, bis jemand im Weg steht.
// Steht der Spieler im Weg, wird er getroffen, und die Figur bleibt davor stehen.
function stosseVor(z, g, ereignisse) {
  const von = kopie(g);
  const weg = [];
  let trifft = false;
  for (const f of g.ansage) {
    if (spielerAuf(z, f.x, f.y)) {
      trifft = true;
      break;
    }
    if (!istFrei(z, f.x, f.y)) break;
    g.x = f.x;
    g.y = f.y;
    weg.push(kopie(f));
  }
  ereignisse.push({ typ: 'vorstoss', phase: 1, id: g.id, gegner: g.typ, von, weg, felder: g.ansage.map(kopie), trifft });
  return trifft;
}

// Mitglieder einer Reisegruppe rücken zu ihrem Vordermann auf, bis zu zwei Schritte.
function rueckeAuf(z, ereignisse) {
  const mitglieder = z.gegner.filter((g) => g.typ === 'gruppe').sort((a, b) => a.gruppe - b.gruppe || a.rang - b.rang);
  let vordermann = null;
  for (const g of mitglieder) {
    if (!vordermann || vordermann.gruppe !== g.gruppe) {
      vordermann = g; // der Vorderste läuft nur über seine Ansage
      continue;
    }
    const von = kopie(g);
    const weg = [];
    for (let i = 0; i < GEGNERWERTE.gruppe.schritte && abstand(g, vordermann) > 1; i++) {
      const weit = entfernungen(vordermann, begehbarFuer(z, g));
      const schritt = naechsterSchritt(g, weit, vordermann);
      if (!schritt || !istFrei(z, schritt.x, schritt.y)) break;
      g.x = schritt.x;
      g.y = schritt.y;
      weg.push(kopie(schritt));
    }
    if (weg.length) ereignisse.push({ typ: 'folgen', phase: 1, id: g.id, von, weg });
    vordermann = g;
  }
}

// Schritt 1: Angekündigte Angriffe treffen ein. Gibt zurück, wer den Spieler getroffen hat.
function loeseAnsagenEin(z, ereignisse) {
  let treffer = null;
  const dran = new Set();
  for (const g of [...z.gegner]) {
    if (!g.ansage) continue;
    dran.add(g.id);
    let trifft = false;
    if (g.typ === 'pendler' || g.typ === 'kontrolleur') {
      trifft = g.ansage.some((f) => spielerAuf(z, f.x, f.y));
      ereignisse.push({ typ: 'hieb', phase: 1, id: g.id, felder: g.ansage.map(kopie), trifft });
      if (g.langsam) g.pause = 1;
      if (g.typ === 'kontrolleur') g.ruhig = 0;
    } else {
      trifft = stosseVor(z, g, ereignisse);
      if (g.typ === 'draengler') g.erschoepft = GEGNERWERTE.draengler.erschoepfung;
    }
    g.ansage = null;
    // höchstens ein Treffer je Zug; treffen mehrere, zählt der schwerste
    if (trifft && (!treffer || schadenVon(g) > schadenVon(treffer))) treffer = g;
  }
  rueckeAuf(z, ereignisse);
  return { treffer, dran };
}

// Gibt zurück, ob wirklich angekündigt wurde.
// Präsenz: Wer volle Ruhe erreicht hat, vor dem zögert der nächste Gegner, der angreifen würde,
// einen Zug lang. Einmal je voller Ruhe.
function sagAn(z, g, felder, ereignisse) {
  if (!felder.length) return false;
  if (z.spieler.praesenz) {
    z.spieler.praesenz = false;
    ereignisse.push({ typ: 'zoegert', phase: 2, id: g.id });
    return false;
  }
  g.ansage = felder.map(kopie);
  ereignisse.push({ typ: 'ansage', phase: 2, id: g.id, gegner: g.typ, felder: felder.map(kopie) });
  return true;
}

function geheEinenSchritt(z, g, schritt, ereignisse) {
  if (!schritt || !istFrei(z, schritt.x, schritt.y)) return false;
  const von = kopie(g);
  g.x = schritt.x;
  g.y = schritt.y;
  ereignisse.push({ typ: 'gegnerSchritt', phase: 2, id: g.id, von, nach: kopie(g) });
  return true;
}

// Schritt Richtung Spieler. Erst um andere Figuren herum, sonst hinter ihnen her.
function schrittZumSpieler(z, g) {
  const s = z.spieler;
  let weit = entfernungen(s, begehbarFuer(z, g));
  if (weit[feldNr(g.x, g.y)] < 0) weit = entfernungen(s, (x, y) => !istHindernis(z, x, y));
  return naechsterSchritt(g, weit, s);
}

function planePendler(z, g, ereignisse) {
  if (g.pause > 0) {
    g.pause -= 1;
    return;
  }
  if (abstand(g, z.spieler) === 1) {
    sagAn(z, g, [z.spieler], ereignisse);
    return;
  }
  // Einführung des roten Felds: Der langsame Pendler in Wagen 1 holt zu Beginn einmal ins Leere aus,
  // auf das Feld vor sich. Der Spieler ist da noch weit weg und sieht gefahrlos, was ein rotes Feld tut.
  if (g.holtAus) {
    g.holtAus = false;
    const vor = schrittZumSpieler(z, g);
    if (vor && istFrei(z, vor.x, vor.y) && abstand(vor, z.spieler) > 1 && sagAn(z, g, [vor], ereignisse)) return;
  }
  if (geheEinenSchritt(z, g, schrittZumSpieler(z, g), ereignisse) && g.langsam) g.pause = 1;
}

// Der Vorderste kündigt die nächsten zwei Felder seines Wegs zum Spieler an.
function planeVordersten(z, g, ereignisse) {
  const s = z.spieler;
  const weit = entfernungen(s, begehbarFuer(z, g));
  const felder = [];
  let hier = kopie(g);
  for (let i = 0; i < GEGNERWERTE.gruppe.schritte; i++) {
    const schritt = naechsterSchritt(hier, weit, s);
    if (!schritt) break;
    felder.push(kopie(schritt));
    hier = schritt;
  }
  sagAn(z, g, felder, ereignisse);
}

// Freie Sicht in gerader Linie vom Drängler zum Spieler? Gibt die Richtung zurück.
function sichtlinie(z, von, nach) {
  if (von.x !== nach.x && von.y !== nach.y) return null;
  if (von.x === nach.x && von.y === nach.y) return null;
  const name = von.x === nach.x ? (nach.y < von.y ? 'hoch' : 'runter') : (nach.x < von.x ? 'links' : 'rechts');
  const r = RICHTUNG[name];
  for (let x = von.x + r.x, y = von.y + r.y; x !== nach.x || y !== nach.y; x += r.x, y += r.y) {
    if (istHindernis(z, x, y) || gegnerAuf(z, x, y)) return null;
  }
  return name;
}

function planeDraengler(z, g, ereignisse) {
  if (g.erschoepft > 0) {
    g.erschoepft -= 1;
    return;
  }
  const s = z.spieler;
  const richtung = sichtlinie(z, g, s);
  if (richtung) {
    // die ganze Linie bis zur Wand oder zum nächsten Hindernis
    const r = RICHTUNG[richtung];
    const felder = [];
    for (let x = g.x + r.x, y = g.y + r.y; imFeld(x, y) && !istHindernis(z, x, y); x += r.x, y += r.y) {
      felder.push({ x, y });
    }
    sagAn(z, g, felder, ereignisse);
    return;
  }
  // Sonst zum nächsten Feld gehen, von dem aus die Linie frei ist.
  const vonHier = entfernungen(g, begehbarFuer(z, g));
  let ziel = null;
  let bestes = Infinity;
  for (let y = 0; y < HOEHE; y++) {
    for (let x = 0; x < BREITE; x++) {
      const d = vonHier[feldNr(x, y)];
      if (d <= 0 || !istFrei(z, x, y) || !sichtlinie(z, { x, y }, s)) continue;
      const wertung = d * 100 - abstand({ x, y }, s); // nah zuerst, bei Gleichstand der längere Anlauf
      if (wertung < bestes) {
        bestes = wertung;
        ziel = { x, y };
      }
    }
  }
  if (ziel) {
    geheEinenSchritt(z, g, naechsterSchritt(g, entfernungen(ziel, begehbarFuer(z, g)), ziel), ereignisse);
  } else {
    geheEinenSchritt(z, g, schrittZumSpieler(z, g), ereignisse);
  }
}

// Der Kontrolleur. Steckbrief:
//   Name: steht auf keiner Anzeige, er sagt nur „Fahrkarte, bitte."
//   Typ: Autoritätswagen, fest als dritter Wagen in der Mitte der Fahrt.
//   Facette (nie im Spiel): Autorität. Taktik: Er kontrolliert die Optionen, denn die Tür gehört ihm.
//   Auslöser, immer gleich:
//     - Er geht nie von seinem Platz neben der Tür.
//     - Seine Nähe sind die acht Felder um ihn herum.
//     - Wer in seiner Nähe ist und sich bewegt, wird geprüft: Er sagt seinen Satz und kündigt
//       das Feld des Spielers an. Ein Treffer kostet zwei Herzen.
//     - Wer ihn schlägt, wird ebenso geprüft.
//     - Wer in seine Nähe tritt, wird angesprochen, aber nicht geprüft.
//     - Wer drei Züge ruhig in seiner Nähe steht, wird durchgewinkt: Er geht, die Tür ist offen.
//   Wege: durchschauen (ruhig stehen), kämpfen (5 Schläge), die Tür aufbrechen (1 Herz).
function inSeinerNaehe(g, f) {
  return Math.max(Math.abs(g.x - f.x), Math.abs(g.y - f.y)) === 1;
}

function pruefe(z, g, ereignisse) {
  g.ruhig = 0;
  if (sagAn(z, g, [z.spieler], ereignisse)) ereignisse.push({ typ: 'kontrolle', phase: 2, id: g.id, prueft: true });
}

// tat: was der Spieler in diesem Zug getan hat, { art: 'warten' | 'schritt' | 'schlag' | 'stoss', von, id }
function planeKontrolleur(z, g, ereignisse, tat) {
  const s = z.spieler;
  if (tat.art === 'schlag' && tat.id === g.id) {
    pruefe(z, g, ereignisse);
    return;
  }
  if (!inSeinerNaehe(g, s)) {
    g.ruhig = 0;
    return;
  }
  if (tat.art === 'warten') {
    g.ruhig += 1;
    if (g.ruhig >= GEGNERWERTE.kontrolleur.geduld) {
      // durchgewinkt: Er geht, und mit ihm verschwindet alles, was er angekündigt hatte
      z.gegner.splice(z.gegner.indexOf(g), 1);
      ereignisse.push({ typ: 'durchgewinkt', phase: 2, id: g.id });
    } else {
      ereignisse.push({ typ: 'ruhig', phase: 2, id: g.id, ruhig: g.ruhig });
    }
    return;
  }
  const kamAusDerNaehe = tat.art === 'schritt' && inSeinerNaehe(g, tat.von);
  g.ruhig = 0;
  if (kamAusDerNaehe) {
    pruefe(z, g, ereignisse);
  } else if (tat.art === 'schritt') {
    ereignisse.push({ typ: 'kontrolle', phase: 2, id: g.id, prueft: false }); // er spricht den an, der herantritt
  }
}

// Schritt 2: Bewegen oder ankündigen. Wer in diesem Zug angegriffen hat, setzt aus.
// Ausnahme ist der Vorderste der Reisegruppe: Er läuft und kündigt in jedem Zug an.
function planeGegner(z, dran, ereignisse, tat = { art: 'warten' }) {
  for (const g of [...z.gegner]) {
    if (g.typ === 'gruppe') {
      if (istVorderster(z, g)) planeVordersten(z, g, ereignisse);
    } else if (dran.has(g.id)) {
      continue;
    } else if (g.typ === 'pendler') {
      planePendler(z, g, ereignisse);
    } else if (g.typ === 'draengler') {
      planeDraengler(z, g, ereignisse);
    } else if (g.typ === 'kontrolleur') {
      planeKontrolleur(z, g, ereignisse, tat);
    }
  }
}

// Liste aller Richtungen als Hilfe für Tests und Bots
function richtungVon(a, b) {
  for (const name of RICHTUNGSNAMEN) {
    if (a.x + RICHTUNG[name].x === b.x && a.y + RICHTUNG[name].y === b.y) return name;
  }
  return null;
}

// --- kern/spiel.js
// Der Spielkern. Kennt weder Bildschirm noch Browser.
//
//   const spiel = erzeugeSpiel(seed);
//   const ereignisse = spiel.act('hoch');   // 'hoch' | 'rechts' | 'runter' | 'links' | 'warten'
//                                           // 'sprint-hoch' usw., wer den Drängler verstanden hat
//   erzeugeSpiel(seed, { staerken: { sprint, rueckhalt, warten } })   Stärken aus früheren Fahrten
//   erzeugeSpiel(seed, { fahrkarte })    die Fahrkarte mit ihren Lochungen, siehe fahrkarte.js
//   erzeugeSpiel(seed, { begleiter })    die Todesursache der vorigen Fahrt: Er sitzt im Speisewagen
//   erzeugeSpiel(seed, { szene })        der Wagen, in dem sie endete: Der Begleiter wiederholt ihn
//   Welche Optionen eine neue Fahrt bekommt, sagt optionenFuerFahrt() in reise.js.
//
// act() ändert spiel.zustand und gibt zurück, was dabei passiert ist.
// Jedes Ereignis trägt eine Phase: 0 Spieler, 1 Angriffe treffen ein, 2 Gegner bewegen sich.
// Eine ungültige Eingabe ändert nichts und kostet keinen Zug.









const HERZEN_VOLL = 5;
const RUHE_VOLL = 3;
const SCHADEN_SPIELER = 1;
const AUFBRECHEN_STOESSE = 3; // so oft gegen die geschlossene Tür laufen, dann gibt sie nach
const AUFBRECHEN_KOSTET = 1; // Herzen

// Stärken aus Schatten: Wer einen Gegnertyp versteht, bekommt dauerhaft dessen Stärke.
//   Pendler: dreimal neben ihm warten              -> warten: Ruhe fürs Warten neben einem Gegner
//   Drängler: dreimal ausweichen, ohne ihn zu schlagen -> sprint: für 1 Ruhe bis zu 2 Felder geradeaus
//   Reisegruppe: einen Wagen mit ihr mit 1 Herz verlassen -> rueckhalt: einmal je Fahrt einen tödlichen Treffer überstehen
const STAERKEN = ['warten', 'sprint', 'rueckhalt'];
const VERSTEHEN_NACH = 3; // so oft neben dem Pendler warten oder dem Drängler ausweichen
const SPRINT_WEITE = 2;
const SPRINT_KOSTET = 1; // Ruhe, im sicheren Wagen nichts: Dort probiert man ihn gefahrlos aus
// Sprint einführen: Wer den Drängler verstanden hat, findet ihn im Speisewagen stehend in der Engstelle.
// Ein Sprint führt an ihm vorbei. Wer stattdessen vor ihm wartet oder ihn anstößt, dem macht er nach
// so vielen Zügen Platz. Danach sitzt er an seinem Tisch.
const PLATZ_NACH = 2;

// Gönnen: Im Speisewagen kann man an einem Tisch ein Herz lassen. Meistens kommt nichts zurück,
// manchmal sitzt bei einer späteren Fahrt jemand mehr am Tisch.
const GOENNEN_ZURUECK = 3; // einer von drei Würfen
const MEHR_AM_TISCH_HOECHSTENS = 5;
const MEHR_TYPEN = ['gruppe', 'pendler', 'draengler'];

// szene: nur für die Wiederholung, { nr, zufall }. Dann entsteht der Wagen aus dem gemerkten Zufall,
// ohne Angebot und ohne Begleiter, und der Zufall der Fahrt bleibt unberührt.
function richteWagenEin(z, szene) {
  const quelle = szene ? { zufall: szene.zufall } : z;
  const anfang = quelle.zufall; // damit sich der Wagen nach einem Tod genau so wiederholen lässt
  const wagen = baueWagen(z.wagenNr, quelle);
  z.wagen = { nr: wagen.nr, art: wagen.art, plan: wagen.plan, gespiegelt: wagen.gespiegelt, anfang };
  z.gegner = wagen.gegner.map((vorgabe) => neuerGegner(z.naechsteId++, vorgabe));
  z.wagen.mitKontrolleur = z.gegner.some((g) => g.typ === 'kontrolleur');
  z.wagen.mitGruppe = z.gegner.some((g) => g.typ === 'gruppe');
  z.wagen.sicher = wagen.sicher;
  z.wagen.heilt = wagen.heilt;
  // an den Tischen sitzt, wen der Spieler verstanden hat
  z.wagen.fahrgaeste = wagen.fahrgaeste.filter((f) => z.staerken[f.staerke]).map((f) => ({ typ: f.typ, x: f.x, y: f.y }));
  const mehr = Math.min(z.mehrAmTisch, wagen.mehrPlaetze.length);
  for (let i = 0; i < mehr; i++) z.wagen.fahrgaeste.push({ typ: MEHR_TYPEN[i % MEHR_TYPEN.length], x: wagen.mehrPlaetze[i].x, y: wagen.mehrPlaetze[i].y });
  z.wagen.gegoennt = null;
  z.wagen.imWeg = null;
  if (!szene && wagen.engstelle) {
    const f = z.wagen.fahrgaeste.find((x) => x.typ === 'draengler');
    if (f) {
      f.sitz = { x: f.x, y: f.y };
      f.x = wagen.engstelle.x;
      f.y = wagen.engstelle.y;
      z.wagen.imWeg = { x: f.x, y: f.y, geduld: 0 };
    }
  }
  z.wagen.typen = [...new Set(z.gegner.map((g) => g.typ))]; // für das Aufhellen dunkler Lochungen
  z.getroffenVon = [];
  if (szene) {
    z.angebot = null;
    z.pruefung = null;
    z.begleiter = null;
  } else {
    stelleAngebot(z);
    setzeBegleiter(z, wagen.begleiterPlatz);
  }
  z.spieler.x = STARTFELD.x;
  z.spieler.y = STARTFELD.y;
  z.tuerOffen = z.gegner.length === 0;
  z.tuerStoesse = 0;
  z.aufgebrochen = false;
  z.zuegeImWagen = 0;
}

function oeffneTuer(z, ereignisse, phase) {
  if (z.tuerOffen || !tuerFrei(z)) return;
  z.tuerOffen = true;
  ereignisse.push({ typ: 'tuerAuf', phase });
}

function stirb(z, ereignisse, phase, durch) {
  z.status = 'tot';
  z.todDurch = durch;
  z.todSzene = { nr: z.wagenNr, zufall: z.wagen.anfang };
  ereignisse.push({ typ: 'tod', phase, wagenNr: z.wagenNr, durch, uebrig: z.gegner.length });
  lochungFuerTod(z, durch, ereignisse, phase);
}

// Eine Stärke kommt hinzu. Gibt das Ereignis zurück oder null, wenn sie schon da war.
// In der Wiederholung zählt nichts für die Reise.
function verstehe(z, staerke, gegner, phase) {
  if (z.probe || z.staerken[staerke]) return null;
  z.staerken[staerke] = true;
  return { typ: 'verstanden', phase, staerke, gegner };
}

// Der stehende Drängler in der Engstelle des Speisewagens
function imWegAuf(z, x, y) {
  const w = z.wagen.imWeg;
  return w && w.x === x && w.y === y ? w : null;
}

function nebenImWeg(z) {
  const w = z.wagen.imWeg;
  return !!w && Math.abs(w.x - z.spieler.x) + Math.abs(w.y - z.spieler.y) === 1;
}

// Er geht an seinen Tisch und setzt sich.
function machtPlatz(z, ereignisse, phase, wie) {
  const w = z.wagen.imWeg;
  const f = z.wagen.fahrgaeste.find((x) => x.typ === 'draengler' && x.sitz);
  z.wagen.imWeg = null;
  if (!f) return;
  const von = { x: f.x, y: f.y };
  f.x = f.sitz.x;
  f.y = f.sitz.y;
  delete f.sitz;
  ereignisse.push({ typ: 'platzGemacht', phase, wie, von, nach: { x: f.x, y: f.y }, geduld: w ? w.geduld : 0 });
}

function nebenGegner(z, typ) {
  const s = z.spieler;
  return z.gegner.some((g) => (!typ || g.typ === typ) && Math.abs(g.x - s.x) + Math.abs(g.y - s.y) === 1);
}

// Wiederholung: Der Begleiter spielt den Wagen, in dem die vorige Fahrt endete, noch einmal.
// Gefahrlos: Kein Treffer und kein Aufbrechen kostet ein Herz. Folgenlos: kein Angebot, keine Lochung,
// keine Stärke. Hinaus geht es durch die Tür oder mit einem Schritt nach unten vom Startfeld,
// danach ist alles wie vorher, nur die Uhr ist weitergelaufen.
function beginneProbe(z, ereignisse) {
  const szene = z.begleiter.szene;
  z.probe = {
    zurueck: {
      wagenNr: z.wagenNr,
      wagen: z.wagen,
      gegner: z.gegner,
      tuerOffen: z.tuerOffen,
      tuerStoesse: z.tuerStoesse,
      aufgebrochen: z.aufgebrochen,
      zuegeImWagen: z.zuegeImWagen,
      getroffenVon: z.getroffenVon,
      angebot: z.angebot,
      pruefung: z.pruefung,
      begleiter: z.begleiter,
      spieler: { ...z.spieler },
      verstehen: { ...z.verstehen },
      zaehler: { ...z.zaehler },
    },
  };
  z.wagenNr = szene.nr;
  richteWagenEin(z, szene);
  ereignisse.push({ typ: 'probe', phase: 1, nr: z.wagenNr });
}

function endeProbe(z) {
  const r = z.probe.zurueck;
  z.probe = null;
  for (const name of ['wagenNr', 'wagen', 'gegner', 'tuerOffen', 'tuerStoesse', 'aufgebrochen', 'zuegeImWagen', 'getroffenVon', 'angebot', 'pruefung', 'begleiter', 'verstehen', 'zaehler']) z[name] = r[name];
  Object.assign(z.spieler, r.spieler);
  return [{ typ: 'probeEnde', phase: 0, nr: z.wagenNr }];
}

function wechsleWagen(z) {
  z.zug += 1;
  if (z.probe) return endeProbe(z); // durch die Tür der Wiederholung: zurück in den Speisewagen
  z.zaehler.schritte += 1;
  z.zaehler.wagen += 1;
  // die Reisegruppe versteht, wer ihren Wagen mit einem Herz verlässt
  const gruppe = z.wagen.mitGruppe && z.spieler.herzen === 1 ? verstehe(z, 'rueckhalt', 'gruppe', 0) : null;
  const karte = [];
  if (gruppe) {
    karte.push(gruppe);
    lochungFuerVerstehen(z, 'gruppe', karte, 0); // noch im Wagen der Reisegruppe
  }
  werteWagenAus(z, karte, 0); // laufende Prüfung und dunkle Lochungen, solange der alte Wagen noch gilt
  const ereignisse = [];
  if (z.wagenNr + 1 >= WAGENZAHL) {
    // Halt: Jeder steigt aus. Der Schaffner locht, wenn helle Lochungen da sind, sonst nickt er.
    z.status = 'halt';
    z.halt = { hell: helleLochungen(z.fahrkarte) };
    ereignisse.push({ typ: 'halt', phase: 0, ...z.halt });
  } else {
    z.wagenNr += 1;
    richteWagenEin(z);
    ereignisse.push({ typ: 'wagenwechsel', phase: 0, nr: z.wagenNr });
    if (z.wagen.heilt) {
      const vorher = z.spieler.herzen;
      z.spieler.herzen = Math.min(HERZEN_VOLL, vorher + z.wagen.heilt);
      ereignisse.push({ typ: 'geheilt', phase: 0, herzen: z.spieler.herzen, plus: z.spieler.herzen - vorher });
    }
  }
  return ereignisse.concat(karte);
}

// Sprint: bis zu zwei Felder geradeaus. Gegner auf dem Weg nehmen Schaden, der Spieler landet auf
// dem weitesten freien Feld des Wegs. Gibt null zurück, wenn es nicht geht.
function sprinte(z, richtung, ereignisse) {
  const s = z.spieler;
  const r = RICHTUNG[richtung];
  const weg = [];
  for (let i = 1; i <= SPRINT_WEITE; i++) {
    const x = s.x + r.x * i;
    const y = s.y + r.y * i;
    if (!imFeld(x, y) || istHindernis(z, x, y)) break;
    weg.push({ x, y });
  }
  if (!weg.length) return null;
  const getroffen = [];
  const imWeg = weg.some((f) => imWegAuf(z, f.x, f.y));
  for (const f of weg) {
    const g = gegnerAuf(z, f.x, f.y);
    if (!g) continue;
    g.hp -= SCHADEN_SPIELER;
    const besiegt = g.hp <= 0;
    getroffen.push({ id: g.id, gegner: g.typ, x: f.x, y: f.y, hp: Math.max(0, g.hp), besiegt });
    z.zaehler.schlaege += 1;
    if (besiegt) {
      z.gegner.splice(z.gegner.indexOf(g), 1);
      z.zaehler.besiegt += 1;
    }
  }
  let nach = null;
  for (const f of weg) if (!gegnerAuf(z, f.x, f.y) && !imWegAuf(z, f.x, f.y)) nach = f;
  const von = { x: s.x, y: s.y };
  if (!z.wagen.sicher) s.ruhe -= SPRINT_KOSTET;
  s.praesenz = false;
  ereignisse.push({ typ: 'sprint', phase: 0, richtung, von, nach, getroffen, ruhe: s.ruhe });
  if (nach) {
    s.x = nach.x;
    s.y = nach.y;
    z.zaehler.schritte += 1;
  }
  if (imWeg && nach) machtPlatz(z, ereignisse, 0, 'sprint'); // vorbeigedrängelt, er setzt sich
  oeffneTuer(z, ereignisse, 0);
  const kontrolleur = getroffen.find((t) => t.gegner === 'kontrolleur');
  const tat = kontrolleur ? { art: 'schlag', id: kontrolleur.id } : nach ? { art: 'schritt', von } : { art: 'stoss' };
  tat.sprintTreffer = getroffen.length > 0;
  return { bewegt: nach !== null, tat };
}

function fuehreAus(z, aktion) {
  if (z.status !== 'faehrt') return [];
  const s = z.spieler;
  const ereignisse = [];
  const startRot = istMarkiert(z, s.x, s.y);
  let zielRot = false;
  let bewegt = false;
  let tat = { art: 'warten' }; // was der Spieler getan hat, für den Kontrolleur
  const neben = nebenGegner(z); // für die Ruhe fürs Warten
  const draenglerRot = z.gegner.some((g) => g.typ === 'draengler' && g.ansage && g.ansage.some((f) => f.x === s.x && f.y === s.y));
  const spaeter = []; // Stärken, die in diesem Zug verstanden werden: [staerke, gegner]
  const vorIhm = nebenImWeg(z); // stand schon vor dem in der Engstelle
  let nochmal = false; // auf „Noch mal" getreten: Die Wiederholung beginnt nach diesem Schritt

  // Phase 0: der Spieler
  if (typeof aktion === 'string' && aktion.startsWith('sprint-')) {
    const richtung = aktion.slice(7);
    if (!RICHTUNG[richtung] || !z.staerken.sprint) return [];
    if (s.ruhe < SPRINT_KOSTET && !z.wagen.sicher) return [{ typ: 'ungueltig', phase: 0, richtung, tuer: false }];
    const ergebnis = sprinte(z, richtung, ereignisse);
    if (!ergebnis) return [{ typ: 'ungueltig', phase: 0, richtung, tuer: false }];
    bewegt = ergebnis.bewegt;
    tat = ergebnis.tat;
    zielRot = bewegt && istMarkiert(z, s.x, s.y);
    if (zielRot) ereignisse.find((e) => e.typ === 'sprint').rot = true;
    if (bewegt) {
      nimmAn(z, ereignisse);
      nochmal = sprichMitBegleiter(z, ereignisse);
    }
  } else if (aktion === 'warten') {
    ereignisse.push({ typ: 'warten', phase: 0 });
    z.zaehler.gewartet += 1;
    // den Pendler versteht, wer dreimal neben ihm wartet
    if (nebenGegner(z, 'pendler')) {
      z.verstehen.pendler += 1;
      if (z.verstehen.pendler >= VERSTEHEN_NACH) spaeter.push(['warten', 'pendler']);
    }
  } else {
    const r = RICHTUNG[aktion];
    if (!r) return [];
    const x = s.x + r.x;
    const y = s.y + r.y;
    const anDerTuer = aktion === 'hoch' && s.x === TUERFELD.x && s.y === TUERFELD.y;
    if (anDerTuer && z.tuerOffen) return wechsleWagen(z);
    if (z.probe && aktion === 'runter' && s.x === STARTFELD.x && s.y === STARTFELD.y) {
      z.zug += 1;
      return endeProbe(z); // aus der Wiederholung nach unten hinaus
    }
    const amTisch = z.wagen.sicher && imFeld(x, y) && z.wagen.plan[y][x] === 'T';
    if (amTisch) {
      // einmal je Besuch, und nie das letzte Herz: Im sicheren Ort passiert nichts Schlimmes
      if (z.wagen.gegoennt || s.herzen <= 1) return [{ typ: 'ungueltig', phase: 0, richtung: aktion, tuer: false }];
      s.herzen -= 1;
      z.wagen.gegoennt = { x, y };
      const zurueck = wuerfle(z, GOENNEN_ZURUECK) === 0;
      if (zurueck) z.mehrAmTisch = Math.min(MEHR_AM_TISCH_HOECHSTENS, z.mehrAmTisch + 1);
      ereignisse.push({ typ: 'gegoennt', phase: 0, x, y, herzen: s.herzen, zurueck, mehrAmTisch: z.mehrAmTisch });
      tat = { art: 'stoss' };
    }
    const stehtImWeg = !amTisch && !anDerTuer && imWegAuf(z, x, y);
    if (stehtImWeg) {
      // gegen den, der in der Engstelle steht: Er rührt sich nicht gleich, der Zug ist vertan
      tat = { art: 'stoss' };
      ereignisse.push({ typ: 'angestossen', phase: 0, richtung: aktion, x, y });
    }
    if (!stehtImWeg && !amTisch && !anDerTuer && (!imFeld(x, y) || istHindernis(z, x, y))) return [{ typ: 'ungueltig', phase: 0, richtung: aktion, tuer: false }];
    const g = anDerTuer || amTisch || stehtImWeg ? null : gegnerAuf(z, x, y);
    if (amTisch || stehtImWeg) {
      // schon erledigt
    } else if (anDerTuer) {
      // Aufbrechen: Jede Tür gibt nach dreimal Dagegenlaufen nach und kostet ein Herz.
      tat = { art: 'stoss' };
      z.tuerStoesse += 1;
      ereignisse.push({ typ: 'tuerStoss', phase: 0, n: z.tuerStoesse });
      if (z.tuerStoesse >= AUFBRECHEN_STOESSE) {
        z.tuerOffen = true;
        z.aufgebrochen = true;
        s.herzen = Math.max(0, s.herzen - (z.probe ? 0 : AUFBRECHEN_KOSTET));
        z.zaehler.aufgebrochen += 1;
        ereignisse.push({ typ: 'aufgebrochen', phase: 0, herzen: s.herzen });
        ereignisse.push({ typ: 'tuerAuf', phase: 0 });
        if (s.herzen <= 0) {
          z.zug += 1;
          z.zuegeImWagen += 1;
          stirb(z, ereignisse, 0, 'tuer');
          return ereignisse;
        }
      }
    } else if (g) {
      tat = { art: 'schlag', id: g.id };
      if (g.typ === 'draengler') z.verstehen.draengler = 0; // verstehen heißt: ausweichen, ohne ihn zu schlagen
      g.hp -= SCHADEN_SPIELER;
      const besiegt = g.hp <= 0;
      ereignisse.push({ typ: 'schlag', phase: 0, id: g.id, gegner: g.typ, richtung: aktion, x, y, hp: Math.max(0, g.hp), besiegt });
      z.zaehler.schlaege += 1;
      if (besiegt) {
        z.gegner.splice(z.gegner.indexOf(g), 1); // seine Ansage verfällt mit ihm
        z.zaehler.besiegt += 1;
        oeffneTuer(z, ereignisse, 0);
      }
    } else {
      tat = { art: 'schritt', von: { x: s.x, y: s.y } };
      zielRot = istMarkiert(z, x, y);
      ereignisse.push({ typ: 'schritt', phase: 0, richtung: aktion, von: { x: s.x, y: s.y }, nach: { x, y }, rot: zielRot });
      s.x = x;
      s.y = y;
      bewegt = true;
      z.zaehler.schritte += 1;
      nimmAn(z, ereignisse); // auf das leuchtende Symbol treten heißt: die Prüfung annehmen
      nochmal = sprichMitBegleiter(z, ereignisse);
    }
  }
  z.zug += 1;
  z.zuegeImWagen += 1;
  // wer vor ihm wartet oder ihn anstößt, dem macht er nach PLATZ_NACH Zügen Platz
  if (vorIhm && nebenImWeg(z)) {
    z.wagen.imWeg.geduld += 1;
    if (z.wagen.imWeg.geduld >= PLATZ_NACH) machtPlatz(z, ereignisse, 0, 'geduld');
  }
  if (nochmal) {
    beginneProbe(z, ereignisse); // im Speisewagen geschieht in diesem Zug sonst nichts
    return ereignisse;
  }

  // Phase 1: angekündigte Angriffe treffen ein
  const { treffer, dran } = loeseAnsagenEin(z, ereignisse);
  if (treffer) {
    // höchstens ein Treffer je Zug, egal wie viele treffen. Er kostet ein Herz, beim Kontrolleur zwei,
    // in der Wiederholung keines.
    const schaden = z.probe ? 0 : schadenVon(treffer);
    s.herzen = Math.max(0, s.herzen - schaden);
    // Rückhalt: einmal je Fahrt bleibt nach einem tödlichen Treffer ein Herz
    const haelt = s.herzen <= 0 && z.staerken.rueckhalt && !z.rueckhaltGenutzt;
    if (haelt) {
      s.herzen = 1;
      z.rueckhaltGenutzt = true;
    }
    s.ruhe = 0;
    z.zaehler.treffer += 1;
    s.praesenz = false;
    if (!z.getroffenVon.includes(treffer.typ)) z.getroffenVon.push(treffer.typ);
    ereignisse.push({ typ: 'treffer', phase: 1, herzen: s.herzen, durch: treffer.typ, schaden });
    if (haelt) ereignisse.push({ typ: 'rueckhalt', phase: 1, herzen: s.herzen });
    if (s.herzen <= 0) {
      stirb(z, ereignisse, 1, treffer.typ);
      return ereignisse;
    }
  } else if (startRot && bewegt && !zielRot) {
    z.zaehler.ausgewichen += 1;
    erhoeheRuhe(s);
    ereignisse.push({ typ: 'ausgewichen', phase: 1, ruhe: s.ruhe });
    // den Drängler versteht, wer dreimal seiner Linie ausweicht, ohne ihn zu schlagen
    if (draenglerRot) {
      z.verstehen.draengler += 1;
      if (z.verstehen.draengler >= VERSTEHEN_NACH) spaeter.push(['sprint', 'draengler']);
    }
  } else if (aktion === 'warten' && neben && z.staerken.warten) {
    // Ruhe fürs Warten: wer neben einem Gegner wartet und nicht getroffen wird
    erhoeheRuhe(s);
    ereignisse.push({ typ: 'ruhigGewartet', phase: 1, ruhe: s.ruhe });
  }

  beobachte(z, tat, !!treffer, zielRot);

  // Phase 2: Gegner bewegen sich oder kündigen an
  planeGegner(z, dran, ereignisse, tat);
  oeffneTuer(z, ereignisse, 2); // der Kontrolleur kann gegangen sein
  // Verstehen locht: den Kontrolleur durchschaut
  if (ereignisse.some((e) => e.typ === 'durchgewinkt')) lochungFuerVerstehen(z, 'kontrolleur', ereignisse, 2);
  // neue Stärken gelten ab dem nächsten Zug, und jede neue locht
  for (const [staerke, gegner] of spaeter) {
    const e = verstehe(z, staerke, gegner, 2);
    if (e) {
      ereignisse.push(e);
      lochungFuerVerstehen(z, gegner, ereignisse, 2);
    }
  }
  return ereignisse;
}

function erhoeheRuhe(s) {
  if (s.ruhe >= RUHE_VOLL) return;
  s.ruhe += 1;
  if (s.ruhe === RUHE_VOLL) s.praesenz = true; // Präsenz: einmal je voller Ruhe
}

function erzeugeSpiel(seed, optionen = {}) {
  const z = {
    seed: seed >>> 0,
    zufall: seed >>> 0,
    status: 'faehrt', // 'faehrt' | 'tot' | 'halt'
    wagenNr: optionen.startWagen || 0,
    wagen: null,
    spieler: { x: STARTFELD.x, y: STARTFELD.y, herzen: HERZEN_VOLL, ruhe: 0, praesenz: false },
    gegner: [],
    tuerOffen: false,
    zug: 0,
    zuegeImWagen: 0,
    naechsteId: 1,
    zaehler: { schritte: 0, schlaege: 0, gewartet: 0, ausgewichen: 0, treffer: 0, besiegt: 0, wagen: 0, aufgebrochen: 0 },
    staerken: {},
    mehrAmTisch: Math.max(0, Math.min(MEHR_AM_TISCH_HOECHSTENS, Math.floor(optionen.mehrAmTisch) || 0)),
    verstehen: { pendler: 0, draengler: 0 }, // Zähler dieser Fahrt
    rueckhaltGenutzt: false,
    fahrkarte: bereinigeFahrkarte(optionen.fahrkarte),
    kartenzufall: { zufall: (seed ^ 0x9e3779b9) >>> 0 }, // eigener Zufall für die Angebote
    angebot: null, // { id, x, y }: das leuchtende Symbol im Wagen
    pruefung: null, // die angenommene Prüfung, bis zum Verlassen des Wagens
    begleiterDurch: ANTWORTARTEN.includes(optionen.begleiter) && optionen.begleiter !== 'pech' ? optionen.begleiter : null,
    begleiterSzene: bereinigeSzene(optionen.szene),
    begleiter: null, // { durch, szene, x, y, antworten, gesprochen, wiederholen }, nur im Speisewagen
    probe: null, // die Wiederholung: { zurueck } mit allem, was danach wieder gilt
    todDurch: null,
    todSzene: null, // { nr, zufall }: der Wagen, in dem die Fahrt endete
    halt: null, // { hell } am Ende der Fahrt: so viele helle Lochungen trägt die Karte
  };
  for (const name of STAERKEN) z.staerken[name] = !!(optionen.staerken && optionen.staerken[name] === true);
  richteWagenEin(z);
  return { zustand: z, act: (aktion) => fuehreAus(z, aktion) };
}

// --- kern/reise.js
// Was eine neue Fahrt aus der vorigen und aus dem Gemerkten mitnimmt. Reine Logik, für main.js
// und für die Prüfwerkzeuge, damit beide dieselbe Fahrt beginnen.
//
// Eine Reise geht vom ersten Wagen bis zum Halt. Solange behält die Fahrkarte ihre Lochungen.
// Am Halt steigt jeder aus, danach beginnt eine neue Reise mit leerer Karte.
// Nach einem Tod sitzt der Begleiter im Speisewagen. Lag der Tod hinter dem Speisewagen,
// beginnt die nächste Fahrt dort, sonst vorn: Niemand überspringt einen Wagen.




const SPEISEWAGEN_NR = WAGENPLAENE.findIndex((w) => w.sicher);

// stand: { staerken, mehrAmTisch, fahrkarte }, vorige: der Zustand der vorigen Fahrt oder null
function optionenFuerFahrt(stand, vorige) {
  const optionen = { staerken: { ...stand.staerken }, mehrAmTisch: stand.mehrAmTisch, fahrkarte: stand.fahrkarte };
  if (vorige && vorige.status === 'halt') optionen.fahrkarte = neueFahrkarte(); // ausgestiegen: eine neue Reise
  if (vorige && vorige.status === 'tot') {
    optionen.begleiter = vorige.todDurch;
    optionen.szene = vorige.todSzene; // den Wagen kann er auf Wunsch wiederholen
    if (vorige.wagenNr > SPEISEWAGEN_NR) optionen.startWagen = SPEISEWAGEN_NR;
  }
  return optionen;
}

// --- kern/fortsetzen.js
// Fahrt fortsetzen (Leitsatz 10: jederzeit unterbrechbar, nach der Pause weiß man sofort, wo man ist).
// Gesichert werden Seed, Optionen und die Eingaben der laufenden Fahrt. Beim Öffnen spielt der Kern
// sie nach und steht im selben Wagen in derselben Lage. Reine Logik ohne Browser.
//
// Eine Aufzeichnung: { seed, optionen, eingaben, pruefsumme }
//   eingaben: ein Zeichen je Zug, der etwas bewirkt hat
//   pruefsumme: Fingerabdruck des Zustands nach der letzten Eingabe. Passt er nach dem Nachspielen
//   nicht (anderer Stand des Spiels, verfälschter Speicher), gilt die Aufzeichnung als kaputt.
// Jeder Fehler beim Nachspielen ergibt null: Dann beginnt still eine neue Fahrt.



const EINGABEN_HOECHSTENS = 4000; // längere Fahrten werden nicht mehr aufgezeichnet

const EINGABEZEICHEN = {
  hoch: 'h',
  rechts: 'r',
  runter: 'u',
  links: 'l',
  warten: 'w',
  'sprint-hoch': 'H',
  'sprint-rechts': 'R',
  'sprint-runter': 'U',
  'sprint-links': 'L',
};
const AKTION_FUER_ZEICHEN = {};
for (const name of Object.keys(EINGABEZEICHEN)) AKTION_FUER_ZEICHEN[EINGABEZEICHEN[name]] = name;

// FNV-1a über den Zustand als Text. Kein Schutz gegen Absicht, nur gegen Versehen.
function pruefsummeVon(zustand) {
  const text = JSON.stringify(zustand);
  let h = 0x811c9dc5;
  for (let i = 0; i < text.length; i++) {
    h ^= text.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return h.toString(16);
}

// Zu Beginn einer Fahrt, bevor erzeugeSpiel() die Optionen sieht.
function neueAufzeichnung(seed, optionen, zustand) {
  return { seed: seed >>> 0, optionen: JSON.parse(JSON.stringify(optionen)), eingaben: '', pruefsumme: pruefsummeVon(zustand) };
}

// Nach jedem Zug, der etwas bewirkt hat. Gibt null zurück, wenn nichts mehr aufgezeichnet wird.
function zeichneAuf(aufzeichnung, aktion, zustand) {
  if (!aufzeichnung) return null;
  const zeichen = EINGABEZEICHEN[aktion];
  if (!zeichen || aufzeichnung.eingaben.length >= EINGABEN_HOECHSTENS) return null;
  aufzeichnung.eingaben += zeichen;
  aufzeichnung.pruefsumme = pruefsummeVon(zustand);
  return aufzeichnung;
}

// Nimmt aus dem Speicher nur, was die erwartete Form hat. Sonst null.
function bereinigeAufzeichnung(roh) {
  if (!roh || typeof roh !== 'object') return null;
  if (!Number.isInteger(roh.seed) || roh.seed < 0 || roh.seed > 0xffffffff) return null;
  if (!roh.optionen || typeof roh.optionen !== 'object' || Array.isArray(roh.optionen)) return null;
  if (typeof roh.eingaben !== 'string' || roh.eingaben.length > EINGABEN_HOECHSTENS || !/^[hrulwHRUL]*$/.test(roh.eingaben)) return null;
  if (typeof roh.pruefsumme !== 'string' || !/^[0-9a-f]{1,8}$/.test(roh.pruefsumme)) return null;
  return { seed: roh.seed, optionen: roh.optionen, eingaben: roh.eingaben, pruefsumme: roh.pruefsumme };
}

// Spielt eine Aufzeichnung nach. Ergebnis: das Spiel in genau dem gesicherten Zustand, sonst null.
function spieleNach(roh) {
  const aufzeichnung = bereinigeAufzeichnung(roh);
  if (!aufzeichnung) return null;
  try {
    const spiel = erzeugeSpiel(aufzeichnung.seed, JSON.parse(JSON.stringify(aufzeichnung.optionen)));
    for (const zeichen of aufzeichnung.eingaben) {
      // eine Eingabe, die nichts bewirkt, wurde nie aufgezeichnet: Dann passt etwas nicht
      if (!spiel.act(AKTION_FUER_ZEICHEN[zeichen]).length) return null;
    }
    if (pruefsummeVon(spiel.zustand) !== aufzeichnung.pruefsumme) return null;
    return spiel;
  } catch (fehler) {
    return null;
  }
}

function rundesRechteck(stift, x, y, b, h, r) {
  const k = Math.min(r, b / 2, h / 2);
  stift.beginPath();
  stift.moveTo(x + k, y);
  stift.lineTo(x + b - k, y);
  stift.quadraticCurveTo(x + b, y, x + b, y + k);
  stift.lineTo(x + b, y + h - k);
  stift.quadraticCurveTo(x + b, y + h, x + b - k, y + h);
  stift.lineTo(x + k, y + h);
  stift.quadraticCurveTo(x, y + h, x, y + h - k);
  stift.lineTo(x, y + k);
  stift.quadraticCurveTo(x, y, x + k, y);
  stift.closePath();
}

function kreis(stift, x, y, r) {
  stift.beginPath();
  stift.arc(x, y, Math.max(0, r), 0, Math.PI * 2);
}

function begrenze(wert, von, bis) {
  return wert < von ? von : wert > bis ? bis : wert;
}

// weiches Auslaufen
function sanft(p) {
  return 1 - (1 - p) * (1 - p) * (1 - p);
}

// Auslaufen mit kleinem Überschwingen, für den Flusszustand
function leicht(p) {
  const c = 1.9;
  return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2);
}

// hin und zurück: 0 -> 1 -> 0
function hinUndHer(p) {
  return Math.sin(p * Math.PI);
}

const ZEICHENBREITE = 6; // fünf Punkte und eine Lücke
const ZEILENHOEHE = 9; // sieben Punkte und zwei für Unterlängen

const MUSTER = {};
for (const [zeichen, bild] of Object.entries(ZEICHEN)) MUSTER[zeichen] = bild.split(' ');

function hatZeichen(zeichen) {
  return MUSTER[zeichen] !== undefined;
}

// Breite eines Texts in Punkten, ohne die Lücke nach dem letzten Zeichen
function textBreite(text) {
  return Math.max(0, [...text].length * ZEICHENBREITE - 1);
}

// Ein Punktfeld: spalten mal zeilen, jeder Punkt an oder aus.
function neuesPunktfeld(spalten, zeilen) {
  return { spalten, zeilen, an: new Uint8Array(spalten * zeilen) };
}

function schreibe(feld, text, spalte, zeile) {
  let x = spalte;
  for (const zeichen of text) {
    const muster = MUSTER[zeichen] || MUSTER['?'];
    for (let r = 0; r < muster.length; r++) {
      for (let c = 0; c < 5; c++) {
        const px = x + c;
        const py = zeile + r;
        if (muster[r][c] === '#' && px >= 0 && px < feld.spalten && py >= 0 && py < feld.zeilen) {
          feld.an[py * feld.spalten + px] = 1;
        }
      }
    }
    x += ZEICHENBREITE;
  }
}

function schreibeMittig(feld, text, zeile) {
  schreibe(feld, text, Math.round((feld.spalten - textBreite(text)) / 2), zeile);
}

// Zeichnet das Punktfeld. raster ist der Abstand der Punkte in Pixeln.
// dunkel ist die Farbe der unbeleuchteten Punkte, null lässt sie weg.
function zeichnePunktfeld(stift, feld, x, y, raster, hell, dunkel) {
  const r = raster * 0.38;
  for (const durchgang of dunkel ? [0, 1] : [1]) {
    stift.fillStyle = durchgang ? hell : dunkel;
    stift.beginPath();
    for (let py = 0; py < feld.zeilen; py++) {
      for (let px = 0; px < feld.spalten; px++) {
        if (feld.an[py * feld.spalten + px] !== durchgang) continue;
        const cx = x + (px + 0.5) * raster;
        const cy = y + (py + 0.5) * raster;
        stift.moveTo(cx + r, cy);
        stift.arc(cx, cy, r, 0, Math.PI * 2);
      }
    }
    stift.fill();
  }
}

  const uhr = { x: Math.round(breite / 2), y: Math.round(status.y + status.h / 2), r: 24 };
  const oben = status.y + status.h + 6;

  const s = Math.max(12, Math.floor(Math.min((nutzbar - 44) / BREITE, (hoehe - oben - RAND_UNTEN) / (HOEHE + 0.64))));
  const wandOben = Math.round(s * 0.42);
  const wandUnten = Math.round(s * 0.22);
  const wandSeite = Math.max(7, Math.round(s * 0.14));
  const bodenB = s * BREITE;
  const bodenH = s * HOEHE;
  const luft = hoehe - oben - RAND_UNTEN - (wandOben + bodenH + wandUnten);
  const bodenX = Math.round((breite - bodenB) / 2);
  const bodenY = Math.round(oben + wandOben + Math.max(0, luft) / 2);

  return {
    breite,
    hoehe,
    s,
    tafel,
    status,
    boden: { x: bodenX, y: bodenY, b: bodenB, h: bodenH },
    rumpf: { x: bodenX - wandSeite, y: bodenY - wandOben, b: bodenB + 2 * wandSeite, h: wandOben + bodenH + wandUnten },
    wandOben,
    wandUnten,
    wandSeite,
    wagenlaenge: wandOben + bodenH + wandUnten + Math.round(s * 0.16), // Abstand von Wagen zu Wagen
    uhr,
    ton,
  };
}

// Bildschirmpunkt -> Feld im Wagen, oder null
function feldBei(layout, px, py) {
  const x = Math.floor((px - layout.boden.x) / layout.s);
  const y = Math.floor((py - layout.boden.y) / layout.s);
  if (x < 0 || x >= BREITE || y < -1 || y >= HOEHE) return null;
  return { x, y }; // y = -1 ist der Streifen der Tür
}

// --- anzeige/figuren.js
// Figuren und Hindernisse. Niemand hat ein Gesicht, nur verstandene Fahrgäste im Speisewagen.
// Jede Figur ist am Umriss erkennbar:
// der Spieler am Schal, der Pendler an der Aktentasche, die Reisegruppe am Rucksack
// und ihr Vorderster am Wimpel, der Drängler an den breiten Schultern, der Kontrolleur
// an Mütze und Lochzange.



// Rumpf und Kopf. (cx, fy) ist der Punkt zwischen den Füßen.
function maleKoerper(stift, cx, fy, masse, farben, neigung) {
  const { hoch, schulter, saum, kopf } = masse;
  const schulterY = fy - hoch + kopf * 1.75;
  const schub = neigung * hoch * 0.16;
  const r = Math.min(schulter * 0.3, hoch * 0.16);

  stift.fillStyle = farben.schuh;
  rundesRechteck(stift, cx - saum * 0.42, fy - hoch * 0.07, saum * 0.36, hoch * 0.09, hoch * 0.03);
  stift.fill();
  rundesRechteck(stift, cx + saum * 0.06, fy - hoch * 0.07, saum * 0.36, hoch * 0.09, hoch * 0.03);
  stift.fill();

  stift.fillStyle = farben.mantel;
  stift.beginPath();
  stift.moveTo(cx - saum / 2, fy - hoch * 0.05);
  stift.lineTo(cx - schulter / 2 + schub, schulterY + r);
  stift.quadraticCurveTo(cx - schulter / 2 + schub, schulterY, cx - schulter / 2 + schub + r, schulterY);
  stift.lineTo(cx + schulter / 2 + schub - r, schulterY);
  stift.quadraticCurveTo(cx + schulter / 2 + schub, schulterY, cx + schulter / 2 + schub, schulterY + r);
  stift.lineTo(cx + saum / 2, fy - hoch * 0.05);
  stift.closePath();
  stift.fill();

  const kopfX = cx + schub * 1.35;
  const kopfY = schulterY - kopf * 0.72 + (masse.kopfTief || 0);
  stift.fillStyle = farben.kopf;
  kreis(stift, kopfX, kopfY, kopf);
  stift.fill();
  return { schulterY, kopfX, kopfY, schub };
}

function maleSchatten(stift, cx, fy, breite) {
  stift.fillStyle = 'rgba(0, 0, 0, 0.34)';
  stift.beginPath();
  stift.ellipse(cx, fy, breite, breite * 0.3, 0, 0, Math.PI * 2);
  stift.fill();
}

function linie(stift, punkte, farbe, dicke) {
  stift.strokeStyle = farbe;
  stift.lineWidth = dicke;
  stift.lineCap = 'round';
  stift.lineJoin = 'round';
  stift.beginPath();
  stift.moveTo(punkte[0][0], punkte[0][1]);
  for (let i = 1; i < punkte.length; i++) stift.lineTo(punkte[i][0], punkte[i][1]);
  stift.stroke();
}

function maleSpieler(stift, cx, fy, s, o) {
  const atem = o.ruhig ? 0 : Math.sin(o.t * 1.7) * 0.012;
  const masse = { hoch: s * 0.72 * (1 + atem), schulter: s * 0.34, saum: s * 0.42, kopf: s * 0.125 };
  const f = FARBE.spieler;
  const k = maleKoerper(stift, cx, fy, masse, f, o.neigung || 0);
  // Schal: ein Band um den Hals und ein Ende, das herabhängt
  const flattern = o.ruhig ? 0 : Math.sin(o.t * (o.fluss ? 3.1 : 1.3)) * s * (o.fluss ? 0.03 : 0.012);
  stift.fillStyle = f.schal;
  rundesRechteck(stift, cx - masse.schulter * 0.42 + k.schub, k.schulterY - s * 0.025, masse.schulter * 0.84, s * 0.085, s * 0.04);
  stift.fill();
  stift.beginPath();
  stift.moveTo(cx + masse.schulter * 0.1 + k.schub, k.schulterY + s * 0.03);
  stift.lineTo(cx + masse.schulter * 0.34 + k.schub, k.schulterY + s * 0.03);
  stift.lineTo(cx + masse.schulter * 0.36 + k.schub + flattern, k.schulterY + s * 0.26);
  stift.lineTo(cx + masse.schulter * 0.12 + k.schub + flattern, k.schulterY + s * 0.24);
  stift.closePath();
  stift.fill();
  return k;
}

function malePendler(stift, cx, fy, s, o) {
  const atem = o.ruhig ? 0 : Math.sin(o.t * 1.3 + o.takt) * 0.01;
  const masse = { hoch: s * 0.72 * (1 + atem), schulter: s * 0.36, saum: s * 0.38, kopf: s * 0.12 };
  const f = FARBE.pendler;
  // kleine Geste: ab und zu hebt er den Arm und sieht auf die Uhr; wer pausiert, tut es durchgehend
  const kreisen = (o.t * 0.16 + o.takt * 0.37) % 1;
  const blick = o.pausiert ? 1 : o.ruhig ? 0 : kreisen > 0.78 ? Math.sin(((kreisen - 0.78) / 0.22) * Math.PI) : 0;
  masse.kopfTief = blick * s * 0.02;
  // Aktentasche in der rechten Hand
  const tx = cx + masse.saum * 0.5;
  const ty = fy - s * 0.3;
  stift.fillStyle = f.tasche;
  rundesRechteck(stift, tx - s * 0.02, ty, s * 0.2, s * 0.15, s * 0.025);
  stift.fill();
  linie(stift, [[tx + s * 0.04, ty], [tx + s * 0.04, ty - s * 0.035], [tx + s * 0.12, ty - s * 0.035], [tx + s * 0.12, ty]], f.tasche, s * 0.022);
  const k = maleKoerper(stift, cx, fy, masse, f, o.neigung || 0);
  // Krawatte
  stift.fillStyle = f.schuh;
  stift.beginPath();
  stift.moveTo(cx - s * 0.022, k.schulterY + s * 0.02);
  stift.lineTo(cx + s * 0.022, k.schulterY + s * 0.02);
  stift.lineTo(cx + s * 0.03, k.schulterY + s * 0.19);
  stift.lineTo(cx, k.schulterY + s * 0.23);
  stift.lineTo(cx - s * 0.03, k.schulterY + s * 0.19);
  stift.closePath();
  stift.fill();
  if (blick > 0.02) {
    const sx = cx - masse.schulter * 0.44;
    const sy = k.schulterY + s * 0.07;
    linie(stift, [[sx, sy], [sx - s * 0.05, sy + s * 0.14 - blick * s * 0.03], [sx + s * 0.08 * blick, sy + s * 0.14 - blick * s * 0.13]], f.arm, s * 0.07);
    stift.fillStyle = f.kopf;
    kreis(stift, sx + s * 0.08 * blick, sy + s * 0.14 - blick * s * 0.13, s * 0.035);
    stift.fill();
  }
  return k;
}

function maleGruppe(stift, cx, fy, s, o) {
  const wippen = o.ruhig ? 0 : Math.sin(o.t * 2.1 + o.takt * 1.9) * s * 0.012;
  const masse = { hoch: s * 0.6, schulter: s * 0.3, saum: s * 0.34, kopf: s * 0.105 };
  const f = FARBE.gruppe;
  const y = fy + wippen;
  // Rucksack schaut links hinter dem Rücken hervor
  stift.fillStyle = f.rucksack;
  rundesRechteck(stift, cx - masse.schulter * 0.78, y - masse.hoch * 0.66, masse.schulter * 0.6, masse.hoch * 0.42, s * 0.05);
  stift.fill();
  const k = maleKoerper(stift, cx, y, masse, f, o.neigung || 0);
  // Schirmmütze
  stift.fillStyle = f.rucksack;
  stift.beginPath();
  stift.arc(k.kopfX, k.kopfY - masse.kopf * 0.15, masse.kopf * 1.02, Math.PI, 0);
  stift.closePath();
  stift.fill();
  rundesRechteck(stift, k.kopfX - masse.kopf * 0.2, k.kopfY - masse.kopf * 0.3, masse.kopf * 1.5, masse.kopf * 0.24, masse.kopf * 0.1);
  stift.fill();
  if (o.vorderster) {
    // der Wimpel, dem alle folgen
    const wx = cx + masse.schulter * 0.62;
    const oben = y - masse.hoch - s * 0.2;
    linie(stift, [[wx, y - masse.hoch * 0.42], [wx, oben]], '#d9d2bf', s * 0.028);
    const wehen = o.ruhig ? 0 : Math.sin(o.t * 4 + o.takt) * s * 0.02;
    stift.fillStyle = f.wimpel;
    stift.beginPath();
    stift.moveTo(wx, oben);
    stift.lineTo(wx + s * 0.2, oben + s * 0.06 + wehen);
    stift.lineTo(wx, oben + s * 0.13);
    stift.closePath();
    stift.fill();
  }
  return k;
}

function maleDraengler(stift, cx, fy, s, o) {
  const f = FARBE.draengler;
  const schnaufen = o.erschoepft && !o.ruhig ? Math.sin(o.t * 6) * 0.03 : 0;
  const wippen = !o.erschoepft && !o.ansagend && !o.ruhig ? Math.sin(o.t * 5 + o.takt) * 0.07 : 0;
  const gebeugt = o.erschoepft ? 0.74 + schnaufen : o.ansagend ? 0.9 : 1;
  const masse = { hoch: s * 0.8 * gebeugt, schulter: s * 0.52, saum: s * 0.36, kopf: s * 0.125 };
  if (o.erschoepft) masse.kopfTief = s * 0.1;
  const neigung = (o.neigung || 0) + wippen;
  const k = maleKoerper(stift, cx, fy, masse, f, neigung);
  // Ellbogen stehen ab, im Erschöpften hängen die Arme auf die Knie
  const ay = k.schulterY + s * 0.1;
  for (const seite of [-1, 1]) {
    const sx = cx + seite * masse.schulter * 0.47 + k.schub;
    if (o.erschoepft) {
      linie(stift, [[sx, ay], [sx + seite * s * 0.02, ay + s * 0.2], [cx + seite * s * 0.1, fy - s * 0.2]], f.arm, s * 0.085);
    } else {
      linie(stift, [[sx, ay], [sx + seite * s * 0.11, ay + s * 0.1], [sx + seite * s * 0.03, ay + s * 0.21]], f.arm, s * 0.085);
    }
  }
  return k;
}

// Der Kontrolleur. o.zeigt: Richtung zum Spieler (x, y) oder null. o.heben: wie weit er die Zange
// hinhält (0 bis 1), sie sinkt, je länger man ruhig steht. o.winkt: Hand an der Mütze beim Durchwinken.
// Kleine Geste im Stand: Ab und zu klickt er mit der Zange.
function maleKontrolleur(stift, cx, fy, s, o) {
  const f = FARBE.kontrolleur;
  const atem = o.ruhig ? 0 : Math.sin(o.t * 1.1 + o.takt) * 0.008;
  const masse = { hoch: s * 0.76 * (1 + atem), schulter: s * 0.37, saum: s * 0.4, kopf: s * 0.12 };
  const zeigt = o.zeigt && (o.heben || 0) > 0.01 ? o.zeigt : null;
  const seite = zeigt ? (zeigt.x < 0 ? -1 : zeigt.x > 0 ? 1 : 0) : 0;
  const k = maleKoerper(stift, cx, fy, masse, f, seite * 0.25 * (o.heben || 0));
  // Mütze: Kuppe, rotes Band, Schirm zur Seite, auf die er sieht. Der Begleiter hat sie abgesetzt.
  const winkt = o.winkt || 0;
  const my = k.kopfY - masse.kopf * 0.22 - winkt * s * 0.06;
  if (o.ohneMuetze) return k;
  stift.fillStyle = f.muetze;
  stift.beginPath();
  stift.arc(k.kopfX, my, masse.kopf * 1.08, Math.PI, 0);
  stift.closePath();
  stift.fill();
  stift.fillStyle = f.band;
  rundesRechteck(stift, k.kopfX - masse.kopf * 1.1, my - masse.kopf * 0.12, masse.kopf * 2.2, masse.kopf * 0.32, masse.kopf * 0.1);
  stift.fill();
  stift.fillStyle = f.muetze;
  const schirm = seite || 1;
  rundesRechteck(stift, k.kopfX + (schirm > 0 ? masse.kopf * 0.55 : -masse.kopf * 1.75), my + masse.kopf * 0.12, masse.kopf * 1.2, masse.kopf * 0.26, masse.kopf * 0.1);
  stift.fill();

  // der Arm mit der Lochzange
  const sx = cx + (seite || 1) * masse.schulter * 0.44 + k.schub;
  const sy = k.schulterY + s * 0.07;
  let hx;
  let hy;
  if (winkt > 0.01) {
    // durchwinken: die Hand geht an die Mütze
    hx = k.kopfX + masse.kopf * 0.9;
    hy = my + s * 0.02 + (1 - winkt) * s * 0.2;
  } else if (zeigt) {
    const weit = Math.hypot(zeigt.x, zeigt.y) || 1;
    const h = o.heben;
    hx = sx + (zeigt.x / weit) * s * 0.3 * h;
    hy = sy + s * 0.2 * (1 - h) + (zeigt.y / weit) * s * 0.22 * h;
  } else {
    hx = sx + s * 0.04;
    hy = sy + s * 0.22;
  }
  linie(stift, [[sx, sy], [hx, hy]], f.arm, s * 0.07);
  stift.fillStyle = f.kopf;
  kreis(stift, hx, hy, s * 0.033);
  stift.fill();
  if (winkt <= 0.01) {
    // die Zange: zwei Schenkel, im Stand klickt sie ab und zu
    const klick = o.ruhig ? 0 : (o.t * 0.23 + o.takt * 0.31) % 1 > 0.92 ? 1 : 0;
    const offen = 0.35 - klick * 0.3;
    const r = zeigt ? Math.atan2(zeigt.y, zeigt.x) : Math.PI / 2;
    for (const w of [-offen, offen]) {
      const ex = hx + Math.cos(r + w) * s * 0.11;
      const ey = hy + Math.sin(r + w) * s * 0.11;
      linie(stift, [[hx, hy], [ex, ey]], f.zange, s * 0.022);
    }
  }
  return k;
}

// Der Begleiter: dieselbe Uniform, die Mütze abgesetzt, im Speisewagen sitzend. Am Halt ist er der Schaffner.
function maleBegleiter(stift, cx, fy, s, o) {
  return maleKontrolleur(stift, cx, fy, s, { ...o, zeigt: null, heben: 0, ohneMuetze: true });
}

const MALER = { spieler: maleSpieler, pendler: malePendler, gruppe: maleGruppe, draengler: maleDraengler, kontrolleur: maleKontrolleur, begleiter: maleBegleiter };

// Zeichnet eine Figur. (cx, fy) ist der Punkt zwischen den Füßen, s die Feldgröße.
// o: t (Sekunden), takt (eigener Versatz), neigung, alpha, blitz, ruhig und was die Figur gerade tut.
function maleFigur(stift, art, cx, fy, s, o) {
  const alpha = o.alpha === undefined ? 1 : o.alpha;
  if (alpha <= 0.01) return null;
  stift.save();
  stift.globalAlpha *= alpha;
  maleSchatten(stift, cx, fy, s * (art === 'draengler' ? 0.27 : art === 'gruppe' ? 0.19 : 0.22));
  const k = MALER[art](stift, cx, fy, s, o);
  if (o.gesicht && k) maleGesicht(stift, k.kopfX, k.kopfY, s * 0.115);
  if (o.blitz > 0.01) {
    // kurzes Aufleuchten bei einem Treffer
    stift.globalCompositeOperation = 'lighter';
    const schein = stift.createRadialGradient(cx, fy - s * 0.38, 0, cx, fy - s * 0.38, s * 0.46);
    schein.addColorStop(0, `rgba(255, 244, 224, ${0.85 * Math.min(1, o.blitz)})`);
    schein.addColorStop(0.5, `rgba(255, 244, 224, ${0.3 * Math.min(1, o.blitz)})`);
    schein.addColorStop(1, 'rgba(255, 244, 224, 0)');
    stift.fillStyle = schein;
    kreis(stift, cx, fy - s * 0.38, s * 0.46);
    stift.fill();
  }
  stift.restore();
  return k;
}

// Die Symbole der sechs Prüfungen, schlicht wie Piktogramme im Zug. (cx, cy) Mitte, g Größe.
function maleSymbol(stift, id, cx, cy, g, farbe) {
  stift.save();
  stift.strokeStyle = farbe;
  stift.fillStyle = farbe;
  stift.lineWidth = Math.max(1.5, g * 0.11);
  stift.lineCap = 'round';
  stift.lineJoin = 'round';
  const h = g / 2;
  if (id === 'aufregen') {
    // eine ruhige Linie: ein flacher Puls
    linie(stift, [[cx - h, cy], [cx - h * 0.3, cy], [cx - h * 0.15, cy - h * 0.25], [cx + h * 0.05, cy + h * 0.2], [cx + h * 0.2, cy], [cx + h, cy]], farbe, stift.lineWidth);
  } else if (id === 'aussteigen') {
    // eine Tür, ein Pfeil hinaus
    stift.strokeRect(cx - h * 0.1, cy - h * 0.8, h * 0.9, h * 1.6);
    linie(stift, [[cx + h * 0.3, cy], [cx - h, cy]], farbe, stift.lineWidth);
    linie(stift, [[cx - h * 0.6, cy - h * 0.35], [cx - h, cy], [cx - h * 0.6, cy + h * 0.35]], farbe, stift.lineWidth);
  } else if (id === 'rempeln') {
    // zwei Figuren mit Abstand
    for (const dx of [-0.5, 0.5]) {
      kreis(stift, cx + dx * h, cy - h * 0.45, h * 0.22);
      stift.fill();
      linie(stift, [[cx + dx * h, cy - h * 0.15], [cx + dx * h, cy + h * 0.75]], farbe, stift.lineWidth * 1.4);
    }
  } else if (id === 'draengeln') {
    // eine Schlange, einer hinter dem anderen
    for (const dx of [-0.65, 0, 0.65]) {
      kreis(stift, cx + dx * h, cy - h * 0.4, h * 0.17);
      stift.fill();
      linie(stift, [[cx + dx * h, cy - h * 0.15], [cx + dx * h, cy + h * 0.6]], farbe, stift.lineWidth * 1.2);
    }
  } else if (id === 'puenktlich') {
    // eine Uhr
    kreis(stift, cx, cy, h * 0.85);
    stift.stroke();
    linie(stift, [[cx, cy - h * 0.55], [cx, cy], [cx + h * 0.4, cy + h * 0.15]], farbe, stift.lineWidth);
  } else if (id === 'ruhe') {
    // drei Punkte wie die Ruhe oben
    for (const dx of [-0.6, 0, 0.6]) {
      kreis(stift, cx + dx * h, cy, h * 0.22);
      stift.fill();
    }
  }
  stift.restore();
}

// Ein schlichtes Gesicht: zwei Punkte, ein kurzer Mund. Nur für verstandene Fahrgäste.
function maleGesicht(stift, x, y, r) {
  stift.fillStyle = '#2a2f3a';
  kreis(stift, x - r * 0.36, y + r * 0.04, r * 0.11);
  stift.fill();
  kreis(stift, x + r * 0.36, y + r * 0.04, r * 0.11);
  stift.fill();
  stift.strokeStyle = '#2a2f3a';
  stift.lineWidth = Math.max(1, r * 0.1);
  stift.lineCap = 'round';
  stift.beginPath();
  stift.moveTo(x - r * 0.24, y + r * 0.42);
  stift.quadraticCurveTo(x, y + r * 0.52, x + r * 0.24, y + r * 0.42);
  stift.stroke();
}

// HP als Punkte über dem Kopf
function malePunkte(stift, cx, y, s, hp, voll) {
  const r = s * 0.042;
  const schritt = s * 0.13;
  const start = cx - ((voll - 1) * schritt) / 2;
  for (let i = 0; i < voll; i++) {
    kreis(stift, start + i * schritt, y, r);
    if (i < hp) {
      stift.fillStyle = '#ffe9c4';
      stift.fill();
    } else {
      stift.strokeStyle = 'rgba(255, 233, 196, 0.3)';
      stift.lineWidth = 1;
      stift.stroke();
    }
  }
}

// Das Ausrufezeichen über der eigenen Figur
function maleAchtung(stift, cx, y, s) {
  const b = s * 0.085;
  stift.fillStyle = FARBE.nacht;
  rundesRechteck(stift, cx - b * 1.1, y - s * 0.3, b * 2.2, s * 0.36, b);
  stift.fill();
  stift.fillStyle = FARBE.rotHell;
  rundesRechteck(stift, cx - b / 2, y - s * 0.26, b, s * 0.17, b / 2);
  stift.fill();
  kreis(stift, cx, y - s * 0.015, b * 0.6);
  stift.fill();
}

// ---------------------------------------------------------------- Hindernisse

function maleSitz(stift, x, y, s) {
  const p = s * 0.09;
  stift.fillStyle = '#22304c';
  rundesRechteck(stift, x + p, y + p, s - 2 * p, s - 2 * p, s * 0.14);
  stift.fill();
  stift.fillStyle = '#2c3d61';
  rundesRechteck(stift, x + p * 1.9, y + s * 0.34, s - p * 3.8, s * 0.5, s * 0.1);
  stift.fill();
  stift.fillStyle = '#3a4f7b';
  rundesRechteck(stift, x + p * 1.5, y + p * 1.3, s - p * 3, s * 0.24, s * 0.09);
  stift.fill();
