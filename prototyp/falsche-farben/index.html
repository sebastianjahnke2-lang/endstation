const ZEICHENBREITE = 6; // fünf Punkte und eine Lücke
const ZEILENHOEHE = 9; // sieben Punkte und zwei für Unterlängen

const MUSTER = {};
for (const [zeichen, bild] of Object.entries(ZEICHEN)) MUSTER[zeichen] = bild.split(' ');

function hatZeichen(zeichen) {
  return MUSTER[zeichen] !== undefined;
}

// Breite eines Texts in Punkten, ohne die Lücke nach dem letzten Zeichen
function textBreite(text) {
  return Math.max(0, [...text].length * ZEICHENBREITE - 1);
}

// Ein Punktfeld: spalten mal zeilen, jeder Punkt an oder aus.
function neuesPunktfeld(spalten, zeilen) {
  return { spalten, zeilen, an: new Uint8Array(spalten * zeilen) };
}

function schreibe(feld, text, spalte, zeile) {
  let x = spalte;
  for (const zeichen of text) {
    const muster = MUSTER[zeichen] || MUSTER['?'];
    for (let r = 0; r < muster.length; r++) {
      for (let c = 0; c < 5; c++) {
        const px = x + c;
        const py = zeile + r;
        if (muster[r][c] === '#' && px >= 0 && px < feld.spalten && py >= 0 && py < feld.zeilen) {
          feld.an[py * feld.spalten + px] = 1;
        }
      }
    }
    x += ZEICHENBREITE;
  }
}

function schreibeMittig(feld, text, zeile) {
  schreibe(feld, text, Math.round((feld.spalten - textBreite(text)) / 2), zeile);
}

// Zeichnet das Punktfeld. raster ist der Abstand der Punkte in Pixeln.
// dunkel ist die Farbe der unbeleuchteten Punkte, null lässt sie weg.
function zeichnePunktfeld(stift, feld, x, y, raster, hell, dunkel) {
  const r = raster * 0.38;
  for (const durchgang of dunkel ? [0, 1] : [1]) {
    stift.fillStyle = durchgang ? hell : dunkel;
    stift.beginPath();
    for (let py = 0; py < feld.zeilen; py++) {
      for (let px = 0; px < feld.spalten; px++) {
        if (feld.an[py * feld.spalten + px] !== durchgang) continue;
        const cx = x + (px + 0.5) * raster;
        const cy = y + (py + 0.5) * raster;
        stift.moveTo(cx + r, cy);
        stift.arc(cx, cy, r, 0, Math.PI * 2);
      }
    }
    stift.fill();
  }
}

// --- ../prototyp/falsche-farben/src/anzeige/buehne.js
// Die Bühne des Prototyps "Falsche Farben": malt den Saal und spielt die Ereignisse des Kerns ab.
// Sie entscheidet nie über Regeln. Sie führt nur die Auswahl: Wer gerade angehoben ist, setzt sich beim
// nächsten Tipp auf eine Bank. Standard ist der Gast an der Tür. Wer den äußersten Gast einer Bank antippt
// (oder irgendwen auf einer vollen Bank), hebt ihn an; ein Tipp auf die Bank daneben setzt ihn um.
//
// Die Glocke: Ein Tipp wählt das Verhör an, ein leuchtendes Fenster flackert. Der nächste Tipp auf einen Gast
// verhört ihn, ein Tipp woandershin bricht ab. Ohne leuchtendes Fenster ist die Glocke matt und tut nichts.
// Sie erscheint, sobald das erste Fenster leuchtet, mit kurzem Aufblinken.
//
// Angehalten wird nur beim Auffliegen und beim Räumen, je höchstens PAUSE ms. Alles andere läuft, während
// schon der nächste Tipp angenommen wird.









const PAUSE = 150; // so lange hält das Bild beim Auffliegen und beim Räumen an, nie länger
const WEG = 140; // so lange gleitet ein Gast auf seinen neuen Platz
const GLANZ = 520;
const WECHSEL = 420;
const RUCK = 0.14; // so weit rücken Nachbarn zusammen oder ab, in Plätzen
const RUCKZEIT = 90; // Zeitkonstante des Rückens und Abwendens in ms
const AUSZEIT = 450; // so lange erlischt ein Fenster nach dem Verhör
const BLINKEN = 700; // so lange blinkt die Glocke, wenn sie erscheint
const RAEUMEN = 900;
const FENSTERZEIT = 700;
const SCHLUSS_WARTET = 650; // nach dem letzten Zug, bis der Satz steht und ein Tipp neu beginnt

// Zeilen eines Satzes für die Punktschrift, höchstens spalten Punkte breit
// Wie weit jeder Gast einer Bank zur Seite rückt, in Vielfachen von RUCK (negativ: nach innen, links).
// Nachbarn mit gleicher echter Farbe rücken zusammen, auch wenn einer eine andere zeigt. Zeigen beide dieselbe
// Farbe und sind verschieden, rücken sie ab. Sonst bleiben beide, wo sie sind.
function rueckVersatz(bank) {
  const v = bank.map(() => 0);
  for (let i = 0; i + 1 < bank.length; i++) {
    const a = bank[i];
    const b = bank[i + 1];
    if (a.echt === b.echt) {
      v[i] += 1;
      v[i + 1] -= 1;
    } else if (a.zeigt === b.zeigt) {
      v[i] -= 1;
      v[i + 1] += 1;
    }
  }
  return v;
}

// Punktabstand der Schrift am Ende: so groß wie möglich, aber gut 28 Zeichen je Zeile
function satzRaster(breite) {
  return Math.max(1.8, Math.min(3, (breite - 24) / 170));
}

// Jeder Satz beginnt auf einer neuen Zeile.
function brichUm(text, spalten) {
  const zeilen = [];
  const saetze = text.split('. ').map((t, i, alle) => (i < alle.length - 1 ? t + '.' : t));
  for (const satz of saetze) {
    let zeile = '';
    for (const wort of satz.split(' ')) {
      const probe = zeile ? zeile + ' ' + wort : wort;
      if (textBreite(probe) <= spalten || !zeile) zeile = probe;
      else {
        zeilen.push(zeile);
        zeile = wort;
      }
    }
    if (zeile) zeilen.push(zeile);
  }
  return zeilen;
}

function erzeugeSaalBuehne(leinwand) {
  const stift = leinwand.getContext('2d');
  let m = null;
  let dichte = 1;
  let grund = null;
  let z = null;
  let tonAn = true;
  let auswahl = null; // 'tuer' | Banknummer | null
  let stups = { wo: null, t: -1e9 }; // ein Tipp ohne Wirkung: die Stelle zuckt kurz
  let pauseBis = 0;
  let schluss = null; // { t, satz, zeilen }
  let angetippt = false;
  const lage = new Map(); // id -> { x, y, vonX, vonY, t }
  const gezeigt = new Map(); // id -> Farbe, wie sie gerade gemalt wird
  const wechsel = new Map(); // id -> { alt, t, nach }
  const ruck = new Map(); // id -> wie weit er gerade zur Seite gerückt ist, in Pixeln
  let letzteZeit = 0;
  const glanz = new Map(); // id -> t
  let gehen = []; // geräumte Gäste auf dem Weg hinaus: { farbe, x, y, t }
  let fenster = []; // je Fenster { an, t }: seit wann es angeht oder ausgeht
  let verhoer = false; // die Glocke ist angetippt, der nächste Tipp auf einen Gast verhört ihn
  let glockeSeit = null; // seit wann die Glocke zu sehen ist
  const dreh = new Map(); // id -> wie weit er gerade abgewandt sitzt, -1..1
  const melder = { klang: null, schicht: null };

  function klinge(name) {
    if (melder.klang) melder.klang(name);
  }

  function passeAn() {
    const breite = Math.max(200, leinwand.clientWidth || window.innerWidth);
    const hoehe = Math.max(240, leinwand.clientHeight || window.innerHeight);
    dichte = Math.min(window.devicePixelRatio || 1, 2.5);
    leinwand.width = Math.round(breite * dichte);
    leinwand.height = Math.round(hoehe * dichte);
    m = berechneSaal(breite, hoehe);
    grund = maleSaalGrund(m, dichte);
    lage.clear(); // nach einer Größenänderung stehen alle sofort auf ihrem Platz
    if (schluss) schluss.zeilen = null;
  }

  function grundAuswahl() {
    auswahl = z && z.tuer.length ? 'tuer' : null;
  }

  function neu(zustand) {
    z = zustand;
    lage.clear();
    gezeigt.clear();
    wechsel.clear();
    glanz.clear();
    gehen = [];
    fenster = [];
    verhoer = false;
    glockeSeit = zustand.licht >= 1 || zustand.geraeumt >= 1 ? 0 : null;
    dreh.clear();
    schluss = null;
    pauseBis = 0;
    grundAuswahl();
  }

  // wo ein Gast hingehört
  function ort(g) {
    const i = z.tuer.indexOf(g);
    if (i >= 0) {
      const p = m.tuer.plaetze[i];
      return { x: p.cx, y: p.fy, sitzt: 0 };
    }
    for (let b = 0; b < z.baenke.length; b++) {
      const k = z.baenke[b].indexOf(g);
      if (k >= 0) {
        const p = m.baenke[b].plaetze[k];
        return { x: p.cx, y: p.fy, sitzt: 1 };
      }
    }
    return null;
  }

  function finde(id) {
    for (const g of z.tuer) if (g.id === id) return g;
    for (const b of z.baenke) for (const g of b) if (g.id === id) return g;
    return null;
  }

  function spiele(ereignisse, jetzt) {
    for (const e of ereignisse) {
      if (e.typ === 'gesetzt') klinge('setzen');
      else if (e.typ === 'ankunft') {
        const t = m.tuer.rahmen;
        lage.set(e.gast.id, { x: t.x + t.b / 2, y: t.y + t.h * 0.9, vonX: t.x + t.b / 2, vonY: t.y + t.h * 0.9, t: -1e9 });
        klinge('ankunft');
      } else if (e.typ === 'schimmer') {
        for (const id of e.ids) glanz.set(id, jetzt);
        klinge('schimmer');
      } else if (e.typ === 'abruecken') {
        klinge('abruecken');
      } else if (e.typ === 'aufgeflogen') {
        pauseBis = Math.max(pauseBis, jetzt + PAUSE);
        for (const f of e.gaeste) wechsel.set(f.id, { alt: gezeigt.get(f.id), t: jetzt + PAUSE });
        klinge('aufgeflogen');
      } else if (e.typ === 'geraeumt') {
        pauseBis = Math.max(pauseBis, jetzt + PAUSE);
        e.ids.forEach((id, k) => {
          const p = m.baenke[e.bank].plaetze[k];
          const l = lage.get(id);
          gehen.push({ farbe: e.farbe, x: l ? l.x : p.cx, y: l ? l.y : p.fy, t: jetzt });
          lage.delete(id);
        });
        fenster[e.fenster - 1] = { an: true, t: jetzt + PAUSE };
        if (glockeSeit === null) glockeSeit = jetzt + PAUSE;
        klinge('raeumen');
        if (melder.schicht) melder.schicht(e.fenster);
      } else if (e.typ === 'verhoer') {
        wechsel.set(e.id, { alt: e.zeigte, t: jetzt });
        fenster[e.fenster] = { an: false, t: jetzt };
        verhoer = false;
        klinge('verhoer');
        if (melder.schicht) melder.schicht(e.fenster);
      } else if (e.typ === 'ende') {
        schluss = { t: Math.max(jetzt, pauseBis) + SCHLUSS_WARTET, satz: e.satz, zeilen: null };
        klinge('ende');
        // der Saal, wie er ist: Wer noch eine falsche Farbe zeigt, zeigt am Ende seine echte
        const spaeter = Math.max(jetzt, pauseBis) + 250;
        for (const g of [...z.tuer, ...z.baenke.flat()]) if (istFalsch(g)) wechsel.set(g.id, { alt: g.zeigt, t: spaeter, nach: g.echt });
      }
    }
    grundAuswahl();
  }

  // Ein Tipp: gibt eine Aktion für den Kern zurück oder null. Ändert sonst nur die Auswahl.
  function tippe(x, y, jetzt) {
    angetippt = true;
    const ziel = wasImSaal(m, x, y);
    if (ziel.art === 'ton') return { ton: true };
    if (schluss) return jetzt >= schluss.t ? { neu: true } : null;
    if (ziel.art === 'glocke' && glockeSeit !== null) {
      // matt: kein Ton, keine Wirkung
      if (z.licht < 1) return null;
      verhoer = !verhoer;
      if (verhoer) klinge('glocke');
      return null;
    }
    if (verhoer) {
      // jetzt zählt nur ein Gast; alles andere bricht ab und kostet nichts
      verhoer = false;
      const g = gastBei(ziel);
      return g ? { verhoer: g.id } : null;
    }
    if (ziel.art === 'tuer') {
      if (z.tuer.length) auswahl = 'tuer';
      else stups = { wo: 'tuer', t: jetzt };
      return null;
    }
    if (ziel.art !== 'bank') return null;
    const b = ziel.bank;
    const bank = z.baenke[b];
    const voll = bank.length >= PLAETZE;
    const aufAeusserstem = bank.length && ziel.platz === bank.length - 1;
    if (auswahl === b) {
      // die eigene Bank: wieder absetzen
      grundAuswahl();
      return null;
    }
    if (voll || aufAeusserstem || auswahl === null) {
      if (bank.length) auswahl = b;
      else stups = { wo: b, t: jetzt };
      return null;
    }
    return { von: auswahl, nach: b };
  }

  // der Gast unter dem Finger, oder null
  function gastBei(ziel) {
    if (ziel.art === 'tuer') return z.tuer[ziel.platz] || null;
    if (ziel.art === 'bank') return z.baenke[ziel.bank][ziel.platz] || null;
    return null;
  }

  function gast(g, jetzt, o) {
    const soll = ort(g);
    if (!soll) return;
    let l = lage.get(g.id);
    if (!l) {
      l = { x: soll.x, y: soll.y, vonX: soll.x, vonY: soll.y, t: -1e9 };
      lage.set(g.id, l);
    }
    if (l.x !== soll.x || l.y !== soll.y) {
      const p = begrenze((jetzt - l.t) / WEG, 0, 1);
      l.vonX = l.vonX + (l.x - l.vonX) * sanft(p);
      l.vonY = l.vonY + (l.y - l.vonY) * sanft(p);
      l.x = soll.x;
      l.y = soll.y;
      l.t = jetzt;
    }
    const p = begrenze((jetzt - l.t) / WEG, 0, 1);
    const x = l.vonX + (l.x - l.vonX) * sanft(p) + (ruck.get(g.id) || 0);
    const y = l.vonY + (l.y - l.vonY) * sanft(p);

    let farbe = aussehen(g).farbe;
    let alt = null;
    let w = 1;
    const wx = wechsel.get(g.id);
    if (wx) {
      const q = begrenze((jetzt - wx.t) / WECHSEL, 0, 1);
      if (wx.nach !== undefined) farbe = q > 0 ? wx.nach : g.zeigt;
      alt = wx.alt;
      w = q > 0 ? sanft(q) : 0;
      if (q <= 0) {
        farbe = wx.alt;
        w = 1;
        alt = null;
      }
    }
    gezeigt.set(g.id, g.zeigt);
    const gt = glanz.get(g.id);
    const gl = gt === undefined ? 0 : jetzt - gt < GLANZ ? hinUndHer((jetzt - gt) / GLANZ) : 0;
    const hebe = o.hebe ? m.s * 0.12 : 0;
    if (o.hebe) {
      stift.save();
      stift.globalAlpha = 0.35;
      stift.fillStyle = SAALFARBE.wahl;
      stift.beginPath();
      stift.ellipse(x, y + 1, m.s * 0.34, m.s * 0.08, 0, 0, Math.PI * 2);
      stift.fill();
      stift.restore();
    }
    maleGast(stift, x, y - hebe, m.s, { farbe, alt, wechsel: w, dreh: dreh.get(g.id) || 0, sitzt: soll.sitzt * (o.hebe ? 0.6 : 1), glanz: gl });
  }

  function zeichne(jetzt) {
    if (!m || !z) return;
    stift.setTransform(dichte, 0, 0, dichte, 0, 0);
    stift.drawImage(grund, 0, 0, m.breite, m.hoehe);
    // Rücken: jeder Gast gleitet zu seinem Versatz neben seinen Nachbarn; an der Tür und angehoben steht er gerade
    const schritt = Math.min(1, Math.max(0, jetzt - letzteZeit) / RUCKZEIT);
    letzteZeit = jetzt;
    const ziel = new Map();
    z.baenke.forEach((bank, b) => {
      const v = rueckVersatz(bank);
      bank.forEach((g, k) => ziel.set(g.id, auswahl === b && k === bank.length - 1 ? 0 : v[k] * RUCK * m.s));
    });
    for (const g of z.tuer) ziel.set(g.id, 0);
    for (const [id, soll] of ziel) {
      const ist = ruck.get(id) || 0;
      ruck.set(id, ist + (soll - ist) * schritt);
    }
    // Spur: wer abgerückt ist, sitzt abgewandt, bis er neben seiner echten Farbe zusammenrückt
    for (const g of [...z.tuer, ...z.baenke.flat()]) {
      const ist = dreh.get(g.id) || 0;
      dreh.set(g.id, ist + (g.abgewandt - ist) * schritt);
    }
    m.fenster.forEach((f, i) => {
      const fe = fenster[i];
      if (!fe) return;
      let hell = fe.an ? begrenze((jetzt - fe.t) / FENSTERZEIT, 0, 1) : 1 - begrenze((jetzt - fe.t) / AUSZEIT, 0, 1);
      // der Preis des Verhörs: das letzte leuchtende Fenster flackert
      if (verhoer && fe.an && i === z.licht - 1) hell *= 0.55 + 0.45 * Math.abs(Math.sin(jetzt / 70) * Math.sin(jetzt / 163));
      maleLichtFenster(stift, f, hell);
    });
    if (glockeSeit !== null && jetzt >= glockeSeit) {
      const b = (jetzt - glockeSeit) / BLINKEN;
      const blink = b < 1 ? Math.abs(Math.sin(b * Math.PI * 3)) * (1 - b) : 0;
      maleGlocke(stift, m.glocke, m.s, { matt: z.licht < 1, an: verhoer, blink, zeit: jetzt });
    }
    maleTonschalter(stift, m.ton, tonAn);

    // Stups: eine Stelle, an der ein Tipp nichts bewirkt hat, zuckt kurz
    const st = (jetzt - stups.t) / 220;
    const zuck = st >= 0 && st < 1 ? Math.sin(st * Math.PI * 3) * (1 - st) * 3 : 0;

    // die Wartenden an der Tür, vorn der, der als Nächster gesetzt wird
    const vorn = !angetippt && auswahl === 'tuer' ? 0.5 + 0.5 * Math.sin(jetzt / 260) : 0;
    z.tuer.forEach((g, i) => {
      stift.save();
      if (stups.wo === 'tuer') stift.translate(zuck, 0);
      gast(g, jetzt, { hebe: auswahl === 'tuer' && i === 0 && !schluss });
      stift.restore();
      if (i === 0 && vorn > 0.01 && !schluss) {
        // vor dem ersten Tipp atmet der vordere Gast leise, damit man weiß, wer dran ist
        const p = m.tuer.plaetze[0];
        stift.save();
        stift.globalAlpha = 0.25 * vorn;
        stift.strokeStyle = SAALFARBE.wahl;
        stift.lineWidth = 2;
        stift.beginPath();
        stift.ellipse(p.cx, p.fy, m.s * 0.4, m.s * 0.1, 0, 0, Math.PI * 2);
        stift.stroke();
        stift.restore();
      }
    });

    z.baenke.forEach((bank, b) => {
      stift.save();
      if (stups.wo === b) stift.translate(zuck, 0);
      bank.forEach((g, k) => gast(g, jetzt, { hebe: auswahl === b && k === bank.length - 1 && !schluss }));
      maleSitz(stift, m, m.baenke[b]);
      stift.restore();
    });

    // die Geräumten leuchten auf und gehen zur Tür
    gehen = gehen.filter((g) => jetzt - g.t < RAEUMEN + PAUSE);
    for (const g of gehen) {
      const p = begrenze((jetzt - g.t - PAUSE) / RAEUMEN, 0, 1);
      const t = m.tuer.rahmen;
      const x = g.x + (t.x + t.b / 2 - g.x) * sanft(p);
      const y = g.y + (t.y + t.h * 0.9 - g.y) * sanft(p);
      stift.save();
      stift.globalAlpha = 1 - p;
      maleGast(stift, x, y, m.s, { farbe: g.farbe, sitzt: 1 - p, licht: 1 - p * 0.5 });
      stift.restore();
    }

    if (schluss && jetzt >= schluss.t) zeichneSatz(jetzt);
  }

  function zeichneSatz(jetzt) {
    const raster = satzRaster(m.breite);
    const spalten = Math.floor((m.breite - 24) / raster);
    if (!schluss.zeilen) schluss.zeilen = brichUm(schluss.satz, spalten);
    const n = schluss.zeilen.length;
    const hoch = (n * ZEILENHOEHE + (n - 1) * 3) * raster;
    const breit = Math.max(...schluss.zeilen.map(textBreite)) * raster;
    const feld = neuesPunktfeld(Math.ceil(breit / raster) + 1, n * (ZEILENHOEHE + 3));
    schluss.zeilen.forEach((zeile, i) => schreibe(feld, zeile, Math.round((feld.spalten - textBreite(zeile)) / 2), i * (ZEILENHOEHE + 3)));
    const x = Math.round((m.breite - feld.spalten * raster) / 2);
    const y = Math.round(m.satz.y + (m.satz.h - hoch) / 2);
    const a = begrenze((jetzt - schluss.t) / 300, 0, 1);
    stift.save();
    stift.globalAlpha = 0.82 * a;
    stift.fillStyle = SAALFARBE.schriftGrund;
    stift.fillRect(0, y - raster * 5, m.breite, hoch + raster * 9);
    stift.globalAlpha = a;
    zeichnePunktfeld(stift, feld, x, y, raster, SAALFARBE.schrift, null);
    stift.restore();
  }

  return {
    melder,
    passeAn,
    neu,
    spiele,
    tippe,
    zeichne,
    bereit: (jetzt) => jetzt >= pauseBis,
    pauseBis: () => pauseBis,
    setzeTon(an) {
      tonAn = an;
    },
    masse: () => m,
    auswahl: () => auswahl,
    verhoerAn: () => verhoer,
    schlussSteht: (jetzt) => !!schluss && jetzt >= schluss.t,
  };
}

// --- ../prototyp/falsche-farben/src/ton.js
// Geräusche des Prototyps "Falsche Farben" (Zusammenrücken hell, Abrücken dumpf), erzeugt über Web Audio, keine Dateien, erst nach der ersten
// Berührung. Dazu die Tonschichten: Jede geräumte Bank fügt dem Saal einen leisen, gehaltenen Ton hinzu,
// bis zu einer für jedes Fenster. Ohne Ton fehlt nichts: Jedes Geräusch hat ein sichtbares Gegenstück.

const SCHICHTTOENE = [146.83, 220, 293.66, 369.99, 440, 329.63, 554.37, 587.33, 659.25, 493.88, 739.99, 880, 196, 987.77];

function erzeugeSaalTon() {
  let ac = null;
  let haupt = null;
  let rauschen = null;
  let an = true;
  let schichten = []; // { g } je klingender Schicht
  let gewuenscht = 0;

  function wecke() {
    if (!an) return;
    try {
      if (!ac) {
        const Klasse = window.AudioContext || window.webkitAudioContext;
        if (!Klasse) return;
        ac = new Klasse();
        haupt = ac.createGain();
        haupt.gain.value = 0.22;
        haupt.connect(ac.destination);
        rauschen = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
        const daten = rauschen.getChannelData(0);
        let wert = 4711;
        for (let i = 0; i < daten.length; i++) {
          wert = (Math.imul(wert, 1664525) + 1013904223) >>> 0;
          daten[i] = wert / 2147483648 - 1;
        }
        stelleSchichten();
      }
      if (ac.state !== 'running') {
        const versuch = ac.resume();
        if (versuch && versuch.catch) versuch.catch(() => {});
      }
    } catch (fehler) {
      ac = null;
    }
  }

  function klang(von, bis, dauer, laut, form, spaeter) {
    if (!ac || !an) return;
    try {
      const t = ac.currentTime + (spaeter || 0);
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = form || 'sine';
      o.frequency.setValueAtTime(von, t);
      o.frequency.exponentialRampToValueAtTime(Math.max(20, bis), t + dauer);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(laut, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dauer);
      o.connect(g);
      g.connect(haupt);
      o.start(t);
      o.stop(t + dauer + 0.02);
    } catch (fehler) {
      // still weiter
    }
  }

  function hauch(hoehe, dauer, laut, spaeter) {
    if (!ac || !an) return;
    try {
      const t = ac.currentTime + (spaeter || 0);
      const q = ac.createBufferSource();
      const f = ac.createBiquadFilter();
      const g = ac.createGain();
      q.buffer = rauschen;
      f.type = 'bandpass';
      f.frequency.value = hoehe;
      f.Q.value = 0.9;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(laut, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dauer);
      q.connect(f);
      f.connect(g);
      g.connect(haupt);
      q.start(t, 0, dauer + 0.05);
    } catch (fehler) {
      // still weiter
    }
  }

  // eine gehaltene Schicht: leiser Ton, der langsam an- und abschwillt
  function neueSchicht(i) {
    const t = ac.currentTime;
    const o = ac.createOscillator();
    const g = ac.createGain();
    const lfo = ac.createOscillator();
    const tiefe = ac.createGain();
    o.type = i % 3 === 0 ? 'triangle' : 'sine';
    o.frequency.value = SCHICHTTOENE[i % SCHICHTTOENE.length];
    const laut = i < 2 ? 0.05 : 0.032;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(laut, t + 2.5);
    lfo.frequency.value = 0.06 + (i % 5) * 0.035;
    tiefe.gain.value = laut * 0.45;
    lfo.connect(tiefe);
    tiefe.connect(g.gain);
    o.connect(g);
    g.connect(haupt);
    o.start(t);
    lfo.start(t);
    return { o, g, lfo };
  }

  function stelleSchichten() {
    if (!ac) return;
    try {
      while (schichten.length < gewuenscht) schichten.push(neueSchicht(schichten.length));
      while (schichten.length > gewuenscht) {
        const s = schichten.pop();
        const t = ac.currentTime;
        s.g.gain.cancelScheduledValues(t);
        s.g.gain.setValueAtTime(s.g.gain.value, t);
        s.g.gain.linearRampToValueAtTime(0, t + 1.2);
        s.o.stop(t + 1.3);
        s.lfo.stop(t + 1.3);
      }
    } catch (fehler) {
      // still weiter
    }
  }

  const SAALKLAENGE = {
    setzen: () => {
      hauch(700, 0.06, 0.25);
      klang(210, 170, 0.08, 0.2, 'triangle');
    },
    ankunft: () => hauch(1500, 0.3, 0.07),
    schimmer: () => {
      klang(1318.5, 1318.5, 0.4, 0.06);
      klang(1760, 1760, 0.45, 0.045, 'sine', 0.06);
    },
    // Abrücken: ein dumpfer, kurzer Ton nach unten
    abruecken: () => {
      klang(150, 105, 0.22, 0.28, 'triangle');
      hauch(260, 0.12, 0.18);
    },
    // die Glocke wird angewählt: ein heller, kurzer Glockenton
    glocke: () => {
      klang(1174.7, 1174.7, 0.7, 0.1, 'sine');
      klang(2349, 2349, 0.35, 0.03, 'sine');
    },
    // Verhör: die Glocke schlägt, dann sinkt ein tiefer Ton
    verhoer: () => {
      klang(880, 880, 0.9, 0.13, 'triangle');
      klang(1760, 1760, 0.5, 0.04, 'sine');
      klang(330, 220, 0.6, 0.12, 'triangle', 0.12);
    },
    // eigener Klang beim Auffliegen: zwei tiefe Töne, die sich reiben und absinken
    aufgeflogen: () => {
      klang(311, 292, 0.55, 0.2, 'triangle');
      klang(330, 309, 0.55, 0.14, 'triangle', 0.04);
    },
    raeumen: () => {
      [293.66, 369.99, 440, 587.33].forEach((f, i) => klang(f, f, 0.9, 0.12, 'triangle', i * 0.07));
    },
    ende: () => {
      klang(146.83, 146.83, 1.6, 0.12, 'triangle');
      klang(220, 220, 1.6, 0.08, 'sine', 0.1);
    },
  };

  return {
    wecke,
    spiele(name) {
      if (SAALKLAENGE[name]) SAALKLAENGE[name]();
    },
    schicht(n) {
      gewuenscht = Math.max(0, Math.min(SCHICHTTOENE.length, n));
      stelleSchichten();
    },
    setze(wert) {
      an = wert;
      if (!ac) return;
      try {
        haupt.gain.setValueAtTime(an ? 0.22 : 0, ac.currentTime);
      } catch (fehler) {
        // still weiter
      }
    },
  };
}

// --- eingabe.js
// Eingabe: Wischen, Tippen, Tastatur. Meldet nur, was der Mensch getan hat.
// Ein Wisch löst aus, sobald der Finger weit genug gewandert ist, nicht erst beim Loslassen.

const WISCHWEG = 18; // Pixel bis zum Auslösen
const TIPPWEG = 9; // weniger Bewegung gilt als Tippen

const TASTEN = {
  ArrowUp: 'hoch',
  ArrowRight: 'rechts',
  ArrowDown: 'runter',
  ArrowLeft: 'links',
  KeyW: 'hoch',
  KeyD: 'rechts',
  KeyS: 'runter',
  KeyA: 'links',
  Space: 'warten',
};

function wischrichtung(dx, dy) {
  if (Math.abs(dx) > Math.abs(dy)) return dx > 0 ? 'rechts' : 'links';
  return dy > 0 ? 'runter' : 'hoch';
}

// melde: { aktion(name, quelle), tipp(x, y), losgelassen(), karteOffen(), finger(richtung oder null) }
// finger: Nach einem Wisch, solange der Finger liegt, die Richtung des Wischs; null, sobald er weg ist.
function verbindeEingabe(flaeche, melde) {
  let finger = null;

  flaeche.addEventListener('pointerdown', (e) => {
    melde.beruehrt();
    if (finger) return;
    finger = { id: e.pointerId, x: e.clientX, y: e.clientY, erledigt: false };
    if (flaeche.setPointerCapture) {
      try {
        flaeche.setPointerCapture(e.pointerId);
      } catch (fehler) {
        // ohne Fang geht es auch
      }
    }
    e.preventDefault();
  });

  flaeche.addEventListener('pointermove', (e) => {
    if (!finger || e.pointerId !== finger.id || finger.erledigt) return;
    const dx = e.clientX - finger.x;
    const dy = e.clientY - finger.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < WISCHWEG) return;
    finger.erledigt = true;
    const richtung = wischrichtung(dx, dy);
    melde.aktion(richtung, 'wisch');
    melde.finger(richtung);
  });

  const loslassen = (e) => {
    if (!finger || e.pointerId !== finger.id) return;
    const dx = e.clientX - finger.x;
    const dy = e.clientY - finger.y;
    const fertig = finger.erledigt;
    finger = null;
    melde.finger(null);
    if (e.type === 'pointerup') melde.losgelassen();
    if (fertig || e.type !== 'pointerup') return;
    if (Math.hypot(dx, dy) < TIPPWEG) {
      // Der Canvas beginnt nicht immer in der Ecke: Neben Notch und Home-Balken bleibt ein Rand frei.
      const kasten = flaeche.getBoundingClientRect();
      melde.tipp(e.clientX - kasten.left, e.clientY - kasten.top);
    }
    else melde.aktion(wischrichtung(dx, dy), 'wisch'); // ein kurzer Wisch zählt auch
  };
  flaeche.addEventListener('pointerup', loslassen);
  flaeche.addEventListener('pointercancel', loslassen);
  flaeche.addEventListener('contextmenu', (e) => e.preventDefault());

  // Safari auf dem iPhone: kein Gummiband beim Ziehen, kein Zoom mit zwei Fingern oder Doppeltipp.
  const halt = (e) => e.preventDefault();
  document.addEventListener('touchmove', halt, { passive: false });
  document.addEventListener('gesturestart', halt);
  document.addEventListener('gesturechange', halt);
  document.addEventListener('dblclick', halt);
  // Den Ton gibt Safari erst frei, wenn ein Finger den Bildschirm wieder verlässt.
  document.addEventListener('touchend', () => melde.losgelassen(), { passive: true });
  document.addEventListener('click', () => melde.losgelassen());

  window.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const name = TASTEN[e.code] || (e.code === 'Enter' ? 'hoch' : null);
    if (!name) return;
    e.preventDefault();
    melde.beruehrt();
    if (e.code === 'Enter' && !melde.karteOffen()) return;
    melde.aktion(name, 'taste');
  });
}

// --- ../prototyp/falsche-farben/src/main.js
// Einstieg des Prototyps "Falsche Farben": verbindet Kern, Bühne, Eingabe und Ton.
// Kein Menü: Beim Öffnen sitzt man sofort im Saal, der erste Gast steht an der Tür.
// Gemerkt wird nichts. Am Ende startet ein Tipp sofort den nächsten Abend, nie das Spiel von selbst.








const leinwand = document.getElementById('bild');
const buehne = erzeugeSaalBuehne(leinwand);
const ton = erzeugeSaalTon();
const fest = /[#&]seed=(\d+)/.exec(window.location.hash);
let naechsterSeed = fest ? Number(fest[1]) : zufallsSeed();
let abend = null;
let tonAn = true;
let wartet = null; // ein Tipp, der während einer Pause kam: Er wird danach ausgeführt, nicht verworfen

function zufallsSeed() {
  try {
    return window.crypto.getRandomValues(new Uint32Array(1))[0];
  } catch (fehler) {
    return Math.floor(performance.now() * 1000) >>> 0;
  }
}

function neuerAbend() {
  abend = erzeugeAbend(naechsterSeed);
  naechsterSeed = (naechsterSeed + 0x9e3779b9) >>> 0; // der nächste Abend ist ein anderer, mit Seed immer derselbe
  buehne.neu(abend.zustand);
  ton.schicht(0);
}

function tippe(x, y) {
  const jetzt = performance.now();
  ton.wecke();
  if (!buehne.bereit(jetzt)) {
    if (!wartet) window.setTimeout(holeNach, Math.max(0, buehne.pauseBis() - jetzt) + 1);
    wartet = { x, y };
    return;
  }
  const was = buehne.tippe(x, y, jetzt);
  if (!was) return;
  if (was.ton) {
    tonAn = !tonAn;
    ton.setze(tonAn);
    buehne.setzeTon(tonAn);
    return;
  }
  if (was.neu) {
    neuerAbend();
    return;
  }
  const ereignisse = abend.act(was);
  for (const e of ereignisse) if (e.typ === 'ende') e.satz = schlussText(schlussSatz(abend.zustand));
  buehne.spiele(ereignisse, jetzt);
}

function holeNach() {
  const t = wartet;
  wartet = null;
  if (t) tippe(t.x, t.y);
}

function schleife(jetzt) {
  window.requestAnimationFrame(schleife);
  buehne.zeichne(jetzt);
}

// Nur für die Prüfwerkzeuge: Mit #probe lässt sich der Zustand von außen ablesen, nicht ändern.
if (/[#&]probe\b/.test(window.location.hash)) {
  window.saalZustand = () => JSON.stringify(abend.zustand);
  window.saalMasse = () => JSON.stringify(buehne.masse());
  window.saalAuswahl = () => buehne.auswahl();
  window.saalVerhoer = () => buehne.verhoerAn();
  window.saalSatzSteht = () => buehne.schlussSteht(performance.now());
}

buehne.melder.klang = (name) => ton.spiele(name);
buehne.melder.schicht = (n) => ton.schicht(n);
buehne.passeAn();
neuerAbend();
verbindeEingabe(leinwand, {
  aktion: () => {},
  tipp: tippe,
  losgelassen: () => ton.wecke(),
  karteOffen: () => false,
  beruehrt: () => ton.wecke(),
  finger: () => {},
});
for (const anlass of ['resize', 'orientationchange', 'pageshow']) window.addEventListener(anlass, () => buehne.passeAn());
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => buehne.passeAn());
window.requestAnimationFrame(schleife);
})();
