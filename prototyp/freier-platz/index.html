    stift.drawImage(ende.tafelbild, m.tafel.x, m.tafel.y, m.tafel.b, m.tafel.h);
    maleFahrkarte(stift, m.karte.x, m.karte.y, m.karte.b, m.karte.h, ende.lochung ? 1 : 0, 0);
    const druck = begrenze(1 - (jetzt - wirkung.neueFahrt) / 140, 0, 1);
    maleKnopf(m.knopf, PLATZTEXTE.spiel.neueFahrt, druck, null);
    stift.restore();
  }

  function maleProtokoll() {
    const m = protokollMasse(masse);
    const h = protokoll.length * m.zeilenhoehe + 2 * m.polster;
    stift.fillStyle = 'rgba(5, 7, 12, 0.86)';
    stift.fillRect(0, 0, masse.breite, masse.hoehe);
    stift.fillStyle = '#10141d';
    rundesRechteck(stift, m.x, m.y, m.b, h, 10);
    stift.fill();
    stift.strokeStyle = '#2a3346';
    stift.lineWidth = 1;
    rundesRechteck(stift, m.x + 0.5, m.y + 0.5, m.b - 1, h - 1, 10);
    stift.stroke();
    const feld = neuesPunktfeld(m.zeichen * 6, protokoll.length * (ZEILENHOEHE + 2));
    protokoll.forEach((zeile, i) => schreibe(feld, zeile, 0, i * (ZEILENHOEHE + 2)));
    zeichnePunktfeld(stift, feld, m.x + m.polster, m.y + m.polster, m.raster, '#c9d2de', null);
  }

  function zeichne(jetzt) {
    if (!masse || !z) return;
    // Safari ändert die Höhe, wenn seine Leisten kommen und gehen, oft ohne verlässliches Signal.
    if (leinwand.clientWidth && (leinwand.clientWidth !== masse.breite || leinwand.clientHeight !== masse.hoehe)) {
      passeAn();
    }
    const t = jetzt / 1000;

    // erst laufende Bewegungen weiterführen, dann neue Ereignisse beginnen: So überschreibt das Ende
    // einer Bewegung nie, was das nächste Ereignis gerade gesetzt hat
    for (const l of laeufer.slice()) {
      if (jetzt < l.start) continue;
      const p = l.dauer <= 0 ? 1 : (jetzt - l.start) / l.dauer;
      l.schritt(begrenze(p, 0, 1));
      if (p >= 1) laeufer = laeufer.filter((x) => x !== l);
    }
    arbeiteAb(jetzt);

    stift.setTransform(dichte, 0, 0, dichte, 0, 0);
    stift.globalAlpha = 1;
    stift.globalCompositeOperation = 'source-over';
    stift.fillStyle = FARBE.nacht;
    stift.fillRect(0, 0, masse.breite, masse.hoehe);

    stift.save();
    // der Schienenstoß: Das Bild ruckt zwei Pixel
    if (!ruhig) stift.translate(0, Math.round(stossAusschlag(jetzt) * 2));
    maleWelt(t, jetzt);
    stift.restore();

    // Anzeigen am Rand
    const { tafel } = masse;
    if (tafelbild) stift.drawImage(tafelbild, tafel.x, tafel.y, tafel.b, tafel.h);
    maleTonschalter(stift, masse.ton, tonAn);
    const kartendruck = begrenze(1 - (jetzt - wirkung.karte) / 160, 0, 1);
    maleFahrkarte(stift, masse.karte.x, masse.karte.y, masse.karte.b, masse.karte.h, bild.karte.loch, kartendruck);
    const druck = begrenze(1 - (jetzt - wirkung.warten) / 140, 0, 1);
    maleKnopf(masse.warten, PLATZTEXTE.spiel.warten, druck, knopfbild);

    if (ende) maleEnde(jetzt);
    if (protokoll) maleProtokoll();
  }

  // ---------------------------------------------------------------- Auskunft

  // Was liegt an diesem Bildschirmpunkt?
  function wasLiegtBei(px, py) {
    if (protokoll) return { art: 'protokoll' };
    if (ende) {
      if (imKasten(endeMasse(masse).knopf, px, py)) return { art: 'neueFahrt' };
      return { art: 'ende' };
    }
    if (Math.hypot(px - masse.ton.x, py - masse.ton.y) <= masse.ton.r) return { art: 'ton' };
    if (imKasten(masse.tafel, px, py)) return { art: 'anzeige' };
    if (imKasten(masse.warten, px, py)) return { art: 'warten' };
    if (imKasten(masse.karte, px, py)) return { art: 'karte' };
    const lampe = lampeAn(masse, z.lampen, px, py);
    const feld = feldAn(masse, px, py);
    // Steht der Schaffner auf dem Feld unter dem Finger, bekommt die Lampe den Tipp nur,
    // wenn er näher an ihrem Kopf liegt als an seinem.
    if (lampe && feld && schaffnerKopf && !z.schaffner.weg && feld.x === GANGSPALTE && feld.y === z.schaffner.y) {
      const kopf = lampenKopf(masse, lampe, z.lampen[lampe]);
      if (Math.hypot(px - schaffnerKopf.x, py - schaffnerKopf.y) < Math.hypot(px - kopf.x, py - kopf.y)) return { art: 'feld', x: feld.x, y: feld.y };
    }
    if (lampe) return { art: 'lampe', name: lampe };
    if (feld) return { art: 'feld', x: feld.x, y: feld.y };
    return null;
  }

  return {
    passeAn,
    neueFahrt,
    spiele,
    beschleunige,
    zeichne,
    wasLiegtBei,
    melder,
    setzeTon: (an) => {
      tonAn = an;
    },
    stupseKarte: (jetzt) => {
      wirkung.karte = jetzt;
    },
    drueckeNeueFahrt: (jetzt) => {
      wirkung.neueFahrt = jetzt;
    },
    zeigeProtokoll: (zeilen) => {
      protokoll = zeilen;
    },
    zeigtProtokoll: () => protokoll !== null,
    zeigtEnde: () => ende !== null,
    endeBereit: (jetzt) => ende !== null && jetzt >= ende.start + ENDE_PAUSE,
    protokollBreite: () => protokollMasse(masse).zeichen,
    aufAnzeige: (px, py) => imKasten(masse.tafel, px, py),
  };
}

// --- eingabe.js
// Eingabe: Wischen, Tippen, Tastatur. Meldet nur, was der Mensch getan hat.
// Ein Wisch löst aus, sobald der Finger weit genug gewandert ist, nicht erst beim Loslassen.

const WISCHWEG = 18; // Pixel bis zum Auslösen
const TIPPWEG = 9; // weniger Bewegung gilt als Tippen

const TASTEN = {
  ArrowUp: 'hoch',
  ArrowRight: 'rechts',
  ArrowDown: 'runter',
  ArrowLeft: 'links',
  KeyW: 'hoch',
  KeyD: 'rechts',
  KeyS: 'runter',
  KeyA: 'links',
  Space: 'warten',
};

function wischrichtung(dx, dy) {
  if (Math.abs(dx) > Math.abs(dy)) return dx > 0 ? 'rechts' : 'links';
  return dy > 0 ? 'runter' : 'hoch';
}

// melde: { aktion(name, quelle), tipp(x, y), losgelassen(), karteOffen() }
function verbindeEingabe(flaeche, melde) {
  let finger = null;

  flaeche.addEventListener('pointerdown', (e) => {
    if (finger) return;
    finger = { id: e.pointerId, x: e.clientX, y: e.clientY, erledigt: false };
    if (flaeche.setPointerCapture) {
      try {
        flaeche.setPointerCapture(e.pointerId);
      } catch (fehler) {
        // ohne Fang geht es auch
      }
    }
    e.preventDefault();
  });

  flaeche.addEventListener('pointermove', (e) => {
    if (!finger || e.pointerId !== finger.id || finger.erledigt) return;
    const dx = e.clientX - finger.x;
    const dy = e.clientY - finger.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < WISCHWEG) return;
    finger.erledigt = true;
    melde.aktion(wischrichtung(dx, dy), 'wisch');
  });

  const loslassen = (e) => {
    if (!finger || e.pointerId !== finger.id) return;
    const dx = e.clientX - finger.x;
    const dy = e.clientY - finger.y;
    const fertig = finger.erledigt;
    finger = null;
    if (e.type === 'pointerup') melde.losgelassen();
    if (fertig || e.type !== 'pointerup') return;
    if (Math.hypot(dx, dy) < TIPPWEG) {
      // Der Canvas beginnt nicht immer in der Ecke: Neben Notch und Home-Balken bleibt ein Rand frei.
      const kasten = flaeche.getBoundingClientRect();
      melde.tipp(e.clientX - kasten.left, e.clientY - kasten.top);
    }
    else melde.aktion(wischrichtung(dx, dy), 'wisch'); // ein kurzer Wisch zählt auch
  };
  flaeche.addEventListener('pointerup', loslassen);
  flaeche.addEventListener('pointercancel', loslassen);
  flaeche.addEventListener('contextmenu', (e) => e.preventDefault());

  // Safari auf dem iPhone: kein Gummiband beim Ziehen, kein Zoom mit zwei Fingern oder Doppeltipp.
  const halt = (e) => e.preventDefault();
  document.addEventListener('touchmove', halt, { passive: false });
  document.addEventListener('gesturestart', halt);
  document.addEventListener('gesturechange', halt);
  document.addEventListener('dblclick', halt);
  // Den Ton gibt Safari erst frei, wenn ein Finger den Bildschirm wieder verlässt.
  document.addEventListener('touchend', () => melde.losgelassen(), { passive: true });
  document.addEventListener('click', () => melde.losgelassen());

  window.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const name = TASTEN[e.code] || (e.code === 'Enter' ? 'hoch' : null);
    if (!name) return;
    e.preventDefault();
    if (e.code === 'Enter' && !melde.karteOffen()) return;
    melde.aktion(name, 'taste');
  });
}

// --- ../prototyp/freier-platz/src/protokoll.js
// Testprotokoll für den Auftraggeber: Was in der letzten Fahrt wann geschah.
// Für Spieler unsichtbar. Es liegt nur auf dem Gerät und wird nirgends hingeschickt.
// Reine Funktionen, damit sie sich in Node prüfen lassen.





const FOLGE_HOECHSTENS = 600;
const SCHRITTZEICHEN = { hoch: 'h', rechts: 'r', runter: 'u', links: 'l' };

function leeresProtokoll() {
  return {
    runden: 0,
    tascheWeg: null, // Runde, in der es geschah, oder null
    lochung: null,
    reiheZweiFrei: null,
    tuer: null,
    lampe: 0, // wie oft
    warten: 0,
    anstossen: 0,
    draengen: 0,
    wecken: 0,
    folge: '', // ein Zeichen je Handlung, siehe docs/SPIELTEST-freier-platz.md
  };
}

function zahlOderNull(wert) {
  return typeof wert === 'number' && isFinite(wert) && wert >= 0 ? Math.floor(wert) : null;
}

function bereinigeProtokoll(roh) {
  if (!roh || typeof roh !== 'object') return null;
  const p = leeresProtokoll();
  for (const name of ['runden', 'lampe', 'warten', 'anstossen', 'draengen', 'wecken']) p[name] = zahlOderNull(roh[name]) || 0;
  for (const name of ['tascheWeg', 'lochung', 'reiheZweiFrei', 'tuer']) p[name] = zahlOderNull(roh[name]);
  if (typeof roh.folge === 'string') p.folge = roh.folge.replace(/[^A-Za-z.]/g, '').slice(0, FOLGE_HOECHSTENS);
  return p;
}

// Schreibt mit, was eine Eingabe ausgelöst hat. zustand ist der Stand danach.
function schreibeMit(protokoll, ereignisse, zustand) {
  const p = protokoll;
  if (!ereignisse.length) return p;
  const erstes = ereignisse[0];
  let zeichen = '.'; // eine Eingabe ohne Wirkung
  if (erstes.typ === 'schritt') zeichen = SCHRITTZEICHEN[erstes.richtung];
  else if (erstes.typ === 'nimmt') zeichen = 'T';
  else if (erstes.typ === 'lampe') zeichen = erstes.name;
  else if (erstes.typ === 'weckt') zeichen = 'S';
  else if (erstes.typ === 'satz') zeichen = 'K';
  else if (erstes.typ === 'warten') zeichen = 'W';
  else if (erstes.typ === 'anstoss') zeichen = 'X';
  else if (erstes.typ === 'draengt') zeichen = 'V';
  if (p.folge.length < FOLGE_HOECHSTENS) p.folge += zeichen;

  p.runden = zustand.runde;
  for (const e of ereignisse) {
    if (e.typ === 'lampe') p.lampe += 1;
    if (e.typ === 'warten') p.warten += 1;
    if (e.typ === 'anstoss') p.anstossen += 1;
    if (e.typ === 'draengt') p.draengen += 1;
    if (e.typ === 'weckt') p.wecken += 1;
    if (e.typ === 'nimmt' && p.tascheWeg === null) p.tascheWeg = zustand.runde;
    if (e.typ === 'locht' && e.wen === 'spieler' && p.lochung === null) p.lochung = zustand.runde;
    if (e.typ === 'ende' && p.tuer === null) p.tuer = zustand.runde;
  }
  if (p.reiheZweiFrei === null && zeichen !== '.' && reiheFrei(zustand, SCHLAEFERPLATZ.y)) p.reiheZweiFrei = zustand.runde;
  return p;
}

function zeile(name, wert, breite) {
  const text = wert === null ? PLATZTEXTE.protokoll.nie : String(wert);
  const luecke = Math.max(1, breite - [...name].length - [...text].length);
  return name + ' '.repeat(luecke) + text;
}

// Die Zeilen, die der Auftraggeber sieht. breite ist die Zahl der Zeichen je Zeile.
function protokollZeilen(protokoll, karten, breite) {
  const t = PLATZTEXTE.protokoll;
  if (!protokoll) return [t.keine];
  const p = protokoll;
  const zeilen = [
    t.titel,
    zeile(t.runden, p.runden, breite),
    zeile(t.tascheWeg, p.tascheWeg, breite),
    zeile(t.lochung, p.lochung, breite),
    zeile(t.reiheZweiFrei, p.reiheZweiFrei, breite),
    zeile(t.tuer, p.tuer, breite),
    zeile(t.lampe, p.lampe, breite),
    zeile(t.warten, p.warten, breite),
    zeile(t.anstossen, p.anstossen, breite),
    zeile(t.draengen, p.draengen, breite),
    zeile(t.wecken, p.wecken, breite),
    t.folge + ':',
  ];
  // die Folge in Zeilen, höchstens fünf, das Ende zählt
  const stuecke = [];
  for (let i = 0; i < p.folge.length; i += breite) stuecke.push(p.folge.slice(i, i + breite));
  for (const stueck of stuecke.slice(-5)) zeilen.push(stueck);
  if (!stuecke.length) zeilen.push(t.nie);
  // die aufgehobenen Karten, die neueste zuerst: + mit Lochung, - ohne
  zeilen.push(t.karten + ':');
  zeilen.push(karten.length ? karten.map((k) => (k.lochung ? '+' : '-')).join('').slice(0, breite) : t.nie);
  return zeilen;
}

// --- ../prototyp/freier-platz/src/speicher.js
// Was der Prototyp sich merkt, unter einem eigenen Schlüssel: die letzten 20 Fahrkarten,
// Ton an oder aus und das Testprotokoll der letzten Fahrt. Wie im Hauptspiel darf der
// Speicher jederzeit fehlen, leer sein oder Unsinn enthalten: ladePlatzStand() liefert
// immer einen vollständigen Stand, und Schreiben darf scheitern.



const PLATZSCHLUESSEL = 'endstation.freier-platz.1';
const KARTEN_HOECHSTENS = 20;

function leererPlatzStand() {
  return { ton: false, karten: [], protokoll: null };
}

function bereinigeKarte(roh) {
  if (!roh || typeof roh !== 'object') return null;
  const zeilen = [];
  if (Array.isArray(roh.zeilen)) {
    for (const zeile of roh.zeilen.slice(0, 4)) if (typeof zeile === 'string') zeilen.push(zeile.slice(0, 40));
  }
  return { lochung: roh.lochung === true, zeilen };
}

// Nimmt nur, was die erwartete Form hat. Alles andere bleibt auf dem Anfangswert.
function bereinigePlatzStand(roh) {
  const stand = leererPlatzStand();
  if (!roh || typeof roh !== 'object') return stand;
  if (typeof roh.ton === 'boolean') stand.ton = roh.ton;
  if (Array.isArray(roh.karten)) {
    for (const eintrag of roh.karten) {
      const karte = bereinigeKarte(eintrag);
      if (karte && stand.karten.length < KARTEN_HOECHSTENS) stand.karten.push(karte);
    }
  }
  stand.protokoll = bereinigeProtokoll(roh.protokoll);
  return stand;
}

// Die neue Karte kommt nach vorn, mehr als 20 werden nicht aufgehoben.
function legeKarteAb(stand, karte) {
  stand.karten.unshift({ lochung: karte.lochung === true, zeilen: karte.zeilen.slice(0, 4) });
  stand.karten.length = Math.min(stand.karten.length, KARTEN_HOECHSTENS);
}

function ladePlatzStand() {
  try {
    return bereinigePlatzStand(JSON.parse(window.localStorage.getItem(PLATZSCHLUESSEL)));
  } catch (fehler) {
    return leererPlatzStand();
  }
}

function sicherePlatzStand(stand) {
  try {
    window.localStorage.setItem(PLATZSCHLUESSEL, JSON.stringify(stand));
    return true;
  } catch (fehler) {
    return false; // kein Speicher, kein Problem
  }
}

// nur für Tests: ein frisches leeres Protokoll passt in den Stand
function standMitProtokoll() {
  const stand = leererPlatzStand();
  stand.protokoll = leeresProtokoll();
  return stand;
}

// --- ../prototyp/freier-platz/src/ton.js
// Ton ist Zugabe: wenige erzeugte Klänge, keine Dateien. Beim Start ist er aus.
// Jedes Geräusch hat ein sichtbares Gegenstück, ohne Ton fehlt keine Information.
// Fehlertöne gibt es nicht. Wie im Hauptspiel entsteht der Klang erst nach der ersten Berührung.

function erzeugePlatzTon() {
  let ac = null;
  let haupt = null;
  let rauschen = null;
  let an = false;

  // Darf erst nach einer Eingabe aufgerufen werden, sonst sperrt der Browser den Ton.
  function wecke() {
    if (!an) return;
    try {
      if (!ac) {
        const Klasse = window.AudioContext || window.webkitAudioContext;
        if (!Klasse) return;
        ac = new Klasse();
        haupt = ac.createGain();
        haupt.gain.value = 0.2;
        haupt.connect(ac.destination);
        rauschen = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
        const daten = rauschen.getChannelData(0);
        let wert = 12345;
        for (let i = 0; i < daten.length; i++) {
          wert = (Math.imul(wert, 1664525) + 1013904223) >>> 0;
          daten[i] = wert / 2147483648 - 1;
        }
      }
      // "suspended" vor der ersten Berührung, "interrupted" nach einem Anruf oder App-Wechsel am iPhone
      if (ac.state !== 'running') {
        const versuch = ac.resume();
        if (versuch && versuch.catch) versuch.catch(() => {});
      }
    } catch (fehler) {
      ac = null;
    }
  }

  function klang(von, bis, dauer, laut, form, spaeter) {
    if (!ac || !an) return;
    try {
      const t = ac.currentTime + (spaeter || 0);
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = form || 'sine';
      o.frequency.setValueAtTime(von, t);
      o.frequency.exponentialRampToValueAtTime(Math.max(20, bis), t + dauer);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(laut, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dauer);
      o.connect(g);
      g.connect(haupt);
      o.start(t);
      o.stop(t + dauer + 0.02);
    } catch (fehler) {
      // still weiter
    }
  }

  function hauch(hoehe, dauer, laut, spaeter) {
    if (!ac || !an) return;
    try {
      const t = ac.currentTime + (spaeter || 0);
      const q = ac.createBufferSource();
      const f = ac.createBiquadFilter();
      const g = ac.createGain();
      q.buffer = rauschen;
      f.type = 'bandpass';
      f.frequency.value = hoehe;
      f.Q.value = 0.9;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(laut, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dauer);
      q.connect(f);
      f.connect(g);
      g.connect(haupt);
      q.start(t, (t * 7) % 0.5, dauer + 0.05);
    } catch (fehler) {
      // still weiter
    }
  }

  const PLATZKLAENGE = {
    schritt: () => hauch(1100, 0.05, 0.2),
    nimmt: () => hauch(700, 0.09, 0.22),
    klick: () => klang(1500, 1100, 0.03, 0.12, 'square'),
    // Knips: die Zange schließt
    knips: () => {
      klang(2300, 900, 0.035, 0.45, 'square');
      hauch(3200, 0.04, 0.4);
    },
    // Ta-tack: der Schienenstoß
    tatack: () => {
      hauch(170, 0.07, 0.5);
      klang(72, 50, 0.08, 0.5, 'sine');
      hauch(190, 0.06, 0.38, 0.19);
      klang(80, 55, 0.07, 0.38, 'sine', 0.19);
    },
  };

  return {
    wecke,
    spiele(name) {
      if (PLATZKLAENGE[name]) PLATZKLAENGE[name]();
    },
    setze(wert) {
      an = wert;
    },
  };
}

// --- ../prototyp/freier-platz/src/main.js
// Einstieg des Prototyps "Der freie Platz": verbindet Kern, Bühne, Eingabe, Ton und Speicher.
// Beim Öffnen sitzt man sofort im Wagen. Wird die Seite neu geladen, beginnt der Wagen von vorn.









const ANSTOSS_SPERRE = 320; // nach dem Anstoßen wird so lange keine Eingabe angenommen und keine vorgemerkt
const LANGER_DRUCK = 650; // so lange auf die Zuganzeige drücken öffnet das Testprotokoll

const leinwand = document.getElementById('bild');
const buehne = erzeugeBuehne(leinwand);
const klang = erzeugePlatzTon();
const stand = ladePlatzStand(); // immer vollständig, auch wenn der Speicher leer, gelöscht oder gesperrt ist

let fahrt = null;
let gesperrtBis = 0;
let loslassenSchlucken = false; // das Loslassen nach dem langen Druck schließt das Protokoll nicht gleich wieder
let druck = null; // der Finger, der gerade auf der Zuganzeige liegt
let letzteTaste = null; // nur die Eingabetaste beginnt nach der Tür eine neue Fahrt, gehalten nicht
let protokollBeginnt = true; // die erste Eingabe einer Fahrt beginnt ein neues Protokoll

function beginneFahrt() {
  fahrt = erzeugeFahrt();
  protokollBeginnt = true;
  buehne.neueFahrt(fahrt.zustand);
}

function gibEin(handlung, quelle) {
  const jetzt = performance.now();
  klang.wecke();
  if (buehne.zeigtProtokoll()) {
    buehne.zeigeProtokoll(null);
    return;
  }
  if (fahrt.zustand.status !== 'faehrt') {
    // Das Spiel startet nie von selbst die nächste Fahrt. Am Rechner geht es auch mit der Eingabetaste,
    // aber nicht mit Pfeil hoch oder W und nicht mit einer gehaltenen Taste.
    if (quelle === 'taste' && letzteTaste === 'Enter' && buehne.endeBereit(jetzt)) beginneFahrt();
    return;
  }
  if (jetzt < gesperrtBis) return;
  buehne.beschleunige(jetzt);
  const ereignisse = fahrt.act(handlung);
  if (!ereignisse.length) return;
  buehne.spiele(ereignisse, fahrt.zustand, jetzt);
  if (ereignisse[0].typ === 'anstoss') gesperrtBis = jetzt + ANSTOSS_SPERRE;

  // Testprotokoll der Fahrt, nach jeder Eingabe gesichert: So bleibt auch eine abgebrochene Fahrt lesbar.
  if (protokollBeginnt || !stand.protokoll) stand.protokoll = leeresProtokoll();
  protokollBeginnt = false;
  schreibeMit(stand.protokoll, ereignisse, fahrt.zustand);
  if (fahrt.zustand.status === 'ende') {
    legeKarteAb(stand, { lochung: fahrt.zustand.spieler.gelocht, zeilen: tatsachenZeilen(fahrt.zustand.tatsachen) });
  }
  sicherePlatzStand(stand); // scheitert das, läuft das Spiel ohne Speichern weiter
}

function tippe(x, y) {
  const jetzt = performance.now();
  if (loslassenSchlucken) {
    loslassenSchlucken = false;
    return;
  }
  const ziel = buehne.wasLiegtBei(x, y);
  if (!ziel) return;
  if (ziel.art === 'protokoll') {
    buehne.zeigeProtokoll(null);
  } else if (ziel.art === 'neueFahrt') {
    if (!buehne.endeBereit(jetzt)) return;
    buehne.drueckeNeueFahrt(jetzt);
    klang.wecke();
    beginneFahrt();
  } else if (ziel.art === 'ton') {
    stand.ton = !stand.ton;
    klang.setze(stand.ton);
    klang.wecke();
    buehne.setzeTon(stand.ton);
    sicherePlatzStand(stand);
  } else if (ziel.art === 'warten') {
    gibEin('warten', 'tipp');
  } else if (ziel.art === 'karte') {
    buehne.stupseKarte(jetzt);
  } else if (ziel.art === 'lampe') {
    gibEin({ tipp: 'lampe', name: ziel.name }, 'tipp');
  } else if (ziel.art === 'feld') {
    gibEin({ tipp: 'feld', x: ziel.x, y: ziel.y }, 'tipp');
  }
}

// Langes Drücken auf die Zuganzeige zeigt dem Auftraggeber das Protokoll der letzten Fahrt.
function oeffneProtokoll() {
  druck = null;
  loslassenSchlucken = true; // egal wie lange der Finger noch liegt: Erst der nächste Tipp schließt es
  buehne.zeigeProtokoll(protokollZeilen(stand.protokoll, stand.karten, buehne.protokollBreite()));
}

function beendeDruck() {
  if (druck) window.clearTimeout(druck.wecker);
  druck = null;
}

leinwand.addEventListener('pointerdown', (e) => {
  beendeDruck();
  loslassenSchlucken = false; // ein neuer Finger: Das alte Loslassen ist vorbei
  const kasten = leinwand.getBoundingClientRect();
  if (buehne.zeigtProtokoll() || !buehne.aufAnzeige(e.clientX - kasten.left, e.clientY - kasten.top)) return;
  druck = { id: e.pointerId, x: e.clientX, y: e.clientY, wecker: window.setTimeout(oeffneProtokoll, LANGER_DRUCK) };
});
leinwand.addEventListener('pointermove', (e) => {
  if (druck && e.pointerId === druck.id && Math.hypot(e.clientX - druck.x, e.clientY - druck.y) > 9) beendeDruck();
});
leinwand.addEventListener('pointerup', beendeDruck);
leinwand.addEventListener('pointercancel', beendeDruck);

function schleife(jetzt) {
  // erst das nächste Bild bestellen: Ein Fehler beim Zeichnen hält dann nicht das ganze Spiel an
  window.requestAnimationFrame(schleife);
  buehne.zeichne(jetzt);
}

// Nur für die Prüfwerkzeuge: Mit #probe an der Adresse lässt sich der Zustand von außen ablesen, nicht ändern.
if (/[#&]probe\b/.test(window.location.hash)) {
  window.platzZustand = () => JSON.stringify(fahrt.zustand);
  window.platzStand = () => JSON.stringify(stand);
}

klang.setze(stand.ton);
buehne.setzeTon(stand.ton);
buehne.melder.klang = (name) => klang.spiele(name);
buehne.passeAn();
beginneFahrt();
// Vor der Eingabe angemeldet, damit gibEin() weiß, welche Taste es war.
window.addEventListener('keydown', (e) => {
  letzteTaste = e.repeat ? null : e.code;
});
// Manche Browser geben den Ton erst frei, wenn ein Finger losgelassen wurde, nicht schon beim Wischen.
verbindeEingabe(leinwand, { aktion: gibEin, tipp: tippe, losgelassen: () => klang.wecke(), karteOffen: () => buehne.zeigtEnde() });
for (const anlass of ['resize', 'orientationchange', 'pageshow']) window.addEventListener(anlass, () => buehne.passeAn());
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => buehne.passeAn());
window.requestAnimationFrame(schleife);
})();
</script>
