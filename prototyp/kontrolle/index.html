<script>
(function () {
'use strict';

// --- ../prototyp/kontrolle/src/kern/halte.js
// Feste Sitzordnungen. Raster wie im Prototyp "Der freie Platz" (kern/abteil.js): 5 Spalten, 8 Reihen,
// Gang in Spalte 2, Sitze in den Reihen 1 bis 6. Die Halte der Schicht werden ausgelost (auslosen.js),
// fest ist nur der Lernhalt.
//
// Je Reihe 1 bis 6 eine Zeile mit 5 Zeichen, das mittlere ist der Gang:
//   .  freier Sitz          Z  ein Schlafender        a bis g  Fahrgäste mit Fahrkarte (Farbe)
//   P  Platzwechsler (S im Lernhalt)   H  Scheinschläfer   T  Toilettengänger
// "farben" gibt die Farbe von Platzwechsler und Toilettengänger an. Sie kommt im selben Halt bei keinem
// anderen vor und wechselt von Halt zu Halt: Man erkennt sie nur am Verhalten, nie am Aussehen.

const ZUEGE_BIS_HALT = 12; // Startwert aus dem Auftrag

// Der Lernhalt: nur bei der allerersten Fahrt auf einem Gerät, vor der Schicht (Auftrag „Einstieg").
// Drei Fahrgäste, keiner schläft, viel Zeit. Der Kontrolleur beginnt mitten im Gang (Reihe 4). Beim
// ersten Schritt nach vorn steht er in der Reihe neben dem Fahrgast ohne Fahrkarte: Der steht auf und
// setzt sich in die vorderste Reihe, neben einen anderen. Von dort kommt er nicht mehr weg und zuckt,
// sobald der Kontrolleur näher kommt. Dieselben Regeln wie in jedem Halt, nur mehr Zeit.
const LERNHALT = {
  farbe: 'g',
  zuege: 20,
  start: 4,
  sitze: [
    '..|.d',
    '..|S.',
    '..|..',
    '..|..',
    'b.|..',
    '..|..',
  ],
};

// --- ../prototyp/kontrolle/src/kern/kontrolle.js
// Prototyp "Kontrolle": Du bist der Kontrolleur. Finde die Fahrgäste ohne Fahrkarte, bevor der Zug hält.
// Reine Logik ohne Browser. Ein Halt: setzeHalt(z, ordnung), dann haltZug(z, handlung) -> Ereignisse.
// Die Schicht aus vielen Halten steuert durchgang.js.
//
// Ein Zug: ein Feld im Gang gehen (wischen), einen Fahrgast in der eigenen Reihe kontrollieren (antippen,
// zur Seite wischen trifft den Gangplatz), oder warten. Danach antwortet der Wagen: Die Strecke wird kürzer,
// und jeder Fahrgast ohne Fahrkarte reagiert nach seiner Masche. Es wird nie eine Fahrkarte gelesen.
// Erkennbar sind sie nur am Verhalten. Alle anderen tun nichts.
//
// Die drei Maschen:
//   Platzwechsler: Steht der Kontrolleur in der Reihe daneben, setzt er sich auf den nächsten freien Sitz,
//     der mindestens zwei Reihen vom Kontrolleur entfernt ist, auf der Seite weg vom Kontrolleur. Das kostet
//     ihn einen Zug: Im nächsten bleibt er sitzen. Steht der Kontrolleur in seiner Reihe, ist der Gang
//     versperrt. Findet er keinen Platz oder ist der Gang versperrt, zuckt er hoch und setzt sich wieder.
//   Scheinschläfer: sitzt da wie ein Schlafender. Dreht ihm der Kontrolleur den Rücken zu (er ist höchstens
//     drei Reihen hinter ihm), hebt er kurz den Kopf. Ihn zu kontrollieren kostet einen Zug, den echten
//     Schlafenden zwei.
//   Toilettengänger: Steht der Kontrolleur zwei Reihen unter ihm, geht er zur Toilette am vorderen Wagenende.
//     Er kommt erst zurück, wenn der Kontrolleur vorbei ist: umgedreht, mindestens drei Reihen von der
//     Toilette weg und unterhalb seines Platzes. Sein Platz bleibt so lange frei. Wer vor der Toilettentür
//     steht, wenn er nach vier Zügen herauskommt, erwischt ihn.



const KONTROLLGANG = 2;
const KONTROLLSTART = 7; // Reihe des Kontrolleurs zu Beginn, unten im Gang
const TOILETTE = { x: 2, y: 0 }; // vorn, wo sonst die Tür ist
const WC_ZUEGE = 4; // so lange bleibt der Toilettengänger mindestens drin
const SCHEIN_SICHT = 3; // so viele Reihen hinter dem Kontrolleur hebt der Scheinschläfer den Kopf
const OBERSTE_REIHE = 1; // in Reihe 0 ist die Toilette
const SITZSPALTEN = [0, 1, 3, 4];
const MASCHE_VON = { S: 'platz', P: 'platz', H: 'schein', T: 'wc' };

// belegt: Auch der Platz dessen, der auf der Toilette ist, bleibt belegt.
function sitztAuf(z, x, y) {
  return z.fahrgaeste.find((f) => f.x === x && f.y === y) || null;
}

// wen man in seiner Reihe antreffen und kontrollieren kann
function greifbar(z, x, y) {
  const f = sitztAuf(z, x, y);
  return f && f.ort === 'sitz' && !f.gefangen ? f : null;
}

function offeneSchwarzfahrer(z) {
  return z.fahrgaeste.filter((f) => f.schwarz && !f.gefangen);
}

// Richtet einen Halt nach einer Sitzordnung ein, siehe halte.js und auslosen.js:
// { sitze, farben: { P, T } (Farbe von Platzwechsler und Toilettengänger), zuege, start }
function setzeHalt(z, ordnung) {
  z.status = 'faehrt';
  z.rest = ordnung.zuege || ZUEGE_BIS_HALT;
  z.zuegeGesamt = z.rest;
  z.entkommenImHalt = 0;
  z.k = { y: ordnung.start || KONTROLLSTART, blick: 'hoch' };
  z.fahrgaeste = [];
  const farben = ordnung.farben || {};
  ordnung.sitze.forEach((zeile, i) => {
    for (const x of SITZSPALTEN) {
      const c = zeile[x];
      if (c === '.' || c === '|') continue;
      const masche = MASCHE_VON[c] || null;
      let farbe = c;
      if (c === 'Z' || c === 'H') farbe = 'z'; // der Scheinschläfer sieht aus wie ein Schlafender
      else if (masche) farbe = farben[c === 'S' ? 'P' : c] || ordnung.farbe || 'g';
      z.fahrgaeste.push({ nr: z.fahrgaeste.length, x, y: i + 1, farbe, schlaeft: c === 'Z', schwarz: !!masche, masche, ruht: 0, kontrolliert: false, gefangen: false, ort: 'sitz', wc: 0 });
    }
  });
}

// Wen eine Wischbewegung zur Seite kontrolliert: nur den Fahrgast am Gang. Antippen trifft jeden in der Reihe.
function nachbarAufSeite(z, seite) {
  return greifbar(z, seite === 'links' ? 1 : 3, z.k.y);
}

function gangweg(vonY, nachY) {
  const weg = [];
  const schritt = nachY < vonY ? -1 : 1;
  for (let y = vonY; y !== nachY + schritt; y += schritt) weg.push({ x: KONTROLLGANG, y });
  return weg;
}

function platzwechslerZieht(z, s, ereignisse) {
  if (s.ruht > 0) {
    s.ruht -= 1;
    return;
  }
  const abstand = Math.abs(s.y - z.k.y);
  if (abstand > 1) return;
  if (abstand === 0) {
    ereignisse.push({ typ: 'zuckt', nr: s.nr }); // der Gang ist versperrt
    return;
  }
  const weg = Math.sign(s.y - z.k.y); // vom Kontrolleur weg
  let ziel = null;
  for (let y = OBERSTE_REIHE; y <= 6; y++) {
    if (Math.sign(y - z.k.y) !== weg || Math.abs(y - z.k.y) < 2) continue;
    for (const x of SITZSPALTEN) {
      if (sitztAuf(z, x, y)) continue;
      const besser = !ziel || Math.abs(y - s.y) < Math.abs(ziel.y - s.y) || (Math.abs(y - s.y) === Math.abs(ziel.y - s.y) && Math.abs(x - s.x) < Math.abs(ziel.x - s.x));
      if (besser) ziel = { x, y };
    }
  }
  if (!ziel) {
    ereignisse.push({ typ: 'zuckt', nr: s.nr });
    return;
  }
  const von = { x: s.x, y: s.y };
  const pfad = [von].concat(gangweg(s.y, ziel.y), [ziel]);
  s.x = ziel.x;
  s.y = ziel.y;
  s.ruht = 1;
  ereignisse.push({ typ: 'wechselt', nr: s.nr, von, nach: ziel, pfad });
}

function scheinschlaeferZieht(z, s, ereignisse) {
  const hinten = z.k.blick === 'hoch' ? s.y - z.k.y : z.k.y - s.y;
  if (hinten > 0 && hinten <= SCHEIN_SICHT) ereignisse.push({ typ: 'kopfHoch', nr: s.nr });
}

function toilettengaengerZieht(z, s, ereignisse) {
  if (s.ort === 'sitz') {
    // zwei Reihen unter ihm: Der Weg nach vorn zur Toilette ist frei
    if (z.k.y - s.y !== 2) return;
    s.ort = 'wc';
    s.wc = 0;
    ereignisse.push({ typ: 'toilette', nr: s.nr, pfad: [{ x: s.x, y: s.y }].concat(gangweg(s.y, TOILETTE.y)) });
    return;
  }
  s.wc += 1;
  if (s.wc >= WC_ZUEGE && z.k.y === TOILETTE.y + 1) {
    // er kommt heraus, und der Kontrolleur steht vor der Tür
    s.gefangen = true;
    ereignisse.push({ typ: 'gefangen', nr: s.nr, x: TOILETTE.x, y: TOILETTE.y, tuer: true });
    return;
  }
  const vorbei = z.k.blick === 'runter' && z.k.y - TOILETTE.y >= 3 && z.k.y > s.y;
  if (!vorbei) return;
  s.ort = 'sitz';
  s.wc = 0;
  ereignisse.push({ typ: 'zurueck', nr: s.nr, pfad: gangweg(TOILETTE.y, s.y).concat([{ x: s.x, y: s.y }]) });
}

// Ein Zug des Wagens: Die Strecke wird kürzer, jeder Fahrgast ohne Fahrkarte reagiert, vielleicht hält der Zug.
function wagenZieht(z, ereignisse) {
  z.rest -= 1;
  ereignisse.push({ typ: 'strecke', rest: z.rest });
  for (const s of offeneSchwarzfahrer(z)) {
    if (s.masche === 'platz') platzwechslerZieht(z, s, ereignisse);
    else if (s.masche === 'schein') scheinschlaeferZieht(z, s, ereignisse);
    else toilettengaengerZieht(z, s, ereignisse);
  }
  if (!offeneSchwarzfahrer(z).length) {
    z.status = 'gefangen'; // der letzte kam vor der Toilettentür heraus
    return;
  }
  if (z.rest <= 0) {
    // der Zug hält: Wer noch da ist, steigt aus, durch die Tür, die vom Kontrolleur weg liegt
    for (const s of offeneSchwarzfahrer(z)) {
      const tuer = s.ort === 'wc' || s.y <= z.k.y ? { x: KONTROLLGANG, y: 0 } : { x: KONTROLLGANG, y: 7 };
      const von = s.ort === 'wc' ? { x: TOILETTE.x, y: TOILETTE.y } : { x: s.x, y: s.y };
      const pfad = s.ort === 'wc' ? [von] : [von].concat(gangweg(s.y, tuer.y));
      ereignisse.push({ typ: 'halt', nr: s.nr, von, tuer, pfad, ausWc: s.ort === 'wc' });
      z.entkommenImHalt += 1;
    }
    z.status = 'entkommen';
  }
}

function kontrolliere(z, f, ereignisse) {
  if (f.schwarz) {
    f.gefangen = true;
    ereignisse.push({ typ: 'gefangen', nr: f.nr, x: f.x, y: f.y });
    if (!offeneSchwarzfahrer(z).length) {
      z.status = 'gefangen';
      return 0;
    }
    return 1; // ein zweiter ist noch im Wagen: Der Zug läuft weiter
  }
  const schlief = f.schlaeft;
  f.schlaeft = false;
  f.kontrolliert = true;
  ereignisse.push({ typ: 'kontrolle', nr: f.nr, x: f.x, y: f.y, schlief });
  return schlief ? 2 : 1; // den Schlafenden zu kontrollieren kostet zwei Züge
}

function spielerZieht(z, handlung, ereignisse) {
  let ziel = null;
  if (handlung === 'hoch') ziel = z.k.y - 1;
  if (handlung === 'runter') ziel = z.k.y + 1;
  if (handlung && typeof handlung === 'object' && handlung.tipp === 'feld') {
    const { x, y } = handlung;
    if (x === KONTROLLGANG && Math.abs(y - z.k.y) === 1) ziel = y;
    else if (x === KONTROLLGANG && y === z.k.y) handlung = 'warten';
    else {
      const f = greifbar(z, x, y);
      return f && y === z.k.y ? kontrolliere(z, f, ereignisse) : -1;
    }
  }
  if (ziel !== null) {
    if (ziel < OBERSTE_REIHE || ziel > KONTROLLSTART) return -1;
    const von = z.k.y;
    z.k.y = ziel;
    z.k.blick = ziel < von ? 'hoch' : 'runter';
    ereignisse.push({ typ: 'schritt', von, nach: ziel });
    return 1;
  }
  if (handlung === 'links' || handlung === 'rechts') {
    const f = nachbarAufSeite(z, handlung);
    return f ? kontrolliere(z, f, ereignisse) : -1;
  }
  if (handlung === 'warten') {
    ereignisse.push({ typ: 'warten' });
    return 1;
  }
  return -1;
}

// Ein Zug im laufenden Halt. Gibt die Ereignisse zurück, leer, wenn die Handlung nichts bewirkt.
// Danach: status 'gefangen' (alle erwischt), 'entkommen' (der Zug hielt), sonst 'faehrt'.
function haltZug(z, handlung) {
  const ereignisse = [];
  if (z.status !== 'faehrt') return ereignisse;
  const zuege = spielerZieht(z, handlung, ereignisse);
  if (zuege < 0) return []; // geht nicht: kostet nichts
  z.zug += 1;
  for (let i = 0; i < zuege && z.status === 'faehrt'; i++) wagenZieht(z, ereignisse);
  return ereignisse;
}

// Schnelle Kopie für die Suche in pruefung.js
function kopiereKontrolle(z) {
  const kopie = Object.assign({}, z);
  kopie.k = { y: z.k.y, blick: z.k.blick };
  kopie.fahrgaeste = z.fahrgaeste.map((f) => Object.assign({}, f));
  return kopie;
}

// --- kern/zufall.js
// Zufall mit Seed. Der Stand liegt im Spielzustand, damit jede Fahrt
// mit demselben Seed und denselben Eingaben gleich verläuft.

function naechsteZufallszahl(z) {
  z.zufall = (z.zufall + 0x6d2b79f5) >>> 0;
  let t = z.zufall;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

// ganze Zahl von 0 bis n - 1
function wuerfle(z, n) {
  return Math.floor(naechsteZufallszahl(z) * n);
}

// --- ../prototyp/kontrolle/src/kern/pruefung.js
// Prüft einen Halt, bevor er gespielt wird. Reine Logik, auch für die Tests.
// Ein Halt taugt, wenn
//   - alle Fahrgäste ohne Fahrkarte innerhalb der Züge zu erwischen sind (vollständige Suche),
//   - Durchkontrollieren der Reihe nach es nicht schafft (von unten nach oben, jede Reihe von links
//     nach rechts oder von rechts nach links),
//   - wer hinsieht, es schafft: Er folgt nur dem, der sich durch sein Verhalten verrät (aufstehen,
//     zucken, Kopf heben, zur Toilette gehen). So ist jede Masche allein durch Beobachten erkennbar.



const KUERZESTE_MINDESTENS = 3;
const VERRAETERISCH = ['wechselt', 'zuckt', 'kopfHoch', 'toilette', 'zurueck'];

function haltNach(ordnung) {
  const z = { halt: 0, status: 'faehrt', rest: 0, zug: 0, k: null, fahrgaeste: [] };
  setzeHalt(z, ordnung);
  return z;
}

function moeglicheHandlungen(z) {
  const liste = ['hoch', 'runter', 'warten'];
  for (const f of z.fahrgaeste) if (f.y === z.k.y && f.ort === 'sitz' && !f.gefangen) liste.push({ tipp: 'feld', x: f.x, y: f.y });
  return liste;
}

function schluessel(z) {
  let text = `${z.k.y}${z.k.blick[0]}${z.rest}`;
  for (const f of z.fahrgaeste) {
    if (f.schwarz || f.schlaeft) text += `|${f.x}${f.y}${f.ruht}${f.schlaeft ? 1 : 0}${f.gefangen ? 1 : 0}${f.ort[0]}${f.wc}`;
  }
  return text;
}

// Breitensuche: der kürzeste Weg, bis alle erwischt sind, als Liste von Handlungen, oder null
function kuerzesterFang(start) {
  let schicht = [{ z: start, weg: [] }];
  const gesehen = new Set([schluessel(start)]);
  while (schicht.length) {
    const naechste = [];
    for (const { z, weg } of schicht) {
      for (const h of moeglicheHandlungen(z)) {
        const neu = kopiereKontrolle(z);
        if (!haltZug(neu, h).length) continue;
        if (neu.status === 'gefangen') return weg.concat([h]);
        if (neu.status !== 'faehrt') continue;
        const k = schluessel(neu);
        if (gesehen.has(k)) continue;
        gesehen.add(k);
        naechste.push({ z: neu, weg: weg.concat([h]) });
      }
    }
    schicht = naechste;
  }
  return null;
}

// Blind: von unten nach oben, jeden Fahrgast der Reihe nach kontrollieren. richtung: 'links' oder 'rechts'
// Gibt den Zustand am Ende zurück: status, und in zug, wie viele Züge es gebraucht hat.
function durchkontrolliert(start, richtung) {
  const z = kopiereKontrolle(start);
  for (let i = 0; i < 100 && z.status === 'faehrt'; i++) {
    const offen = z.fahrgaeste.filter((f) => f.y === z.k.y && f.ort === 'sitz' && !f.gefangen && !f.kontrolliert).sort((a, b) => (richtung === 'links' ? a.x - b.x : b.x - a.x))[0];
    if (!haltZug(z, offen ? { tipp: 'feld', x: offen.x, y: offen.y } : 'hoch').length) break; // vorn, niemand mehr übrig
  }
  return z;
}

function durchkontrollieren(start, richtung) {
  return durchkontrolliert(start, richtung).status;
}

// Wer hinsieht: geht nach vorn, merkt sich jeden, der sich verrät, und folgt ihm.
// Ist der auf der Toilette, wartet er vor der Tür.
function hinsehen(start) {
  const z = kopiereKontrolle(start);
  const verdacht = [];
  for (let i = 0; i < 100 && z.status === 'faehrt'; i++) {
    const ziel = verdacht.map((nr) => z.fahrgaeste[nr]).find((f) => !f.gefangen);
    let h = 'hoch';
    if (ziel) {
      const reihe = ziel.ort === 'wc' ? TOILETTE.y + 1 : ziel.y;
      if (ziel.ort === 'sitz' && ziel.y === z.k.y) h = { tipp: 'feld', x: ziel.x, y: ziel.y };
      else if (reihe === z.k.y) h = 'warten';
      else h = reihe < z.k.y ? 'hoch' : 'runter';
    } else if (z.k.y === 1) {
      h = 'warten'; // vorn angekommen, noch niemand hat sich verraten
    }
    for (const e of haltZug(z, h)) if (VERRAETERISCH.includes(e.typ) && !verdacht.includes(e.nr)) verdacht.push(e.nr);
  }
  return z.status;
}

function pruefeHalt(ordnung) {
  const z = haltNach(ordnung);
  const weg = kuerzesterFang(z);
  return {
    kuerzeste: weg ? weg.length : null,
    blindLinks: durchkontrollieren(z, 'links'),
    blindRechts: durchkontrollieren(z, 'rechts'),
    hinsehen: hinsehen(z),
  };
}

function haltTaugt(ordnung) {
  const p = pruefeHalt(ordnung);
  return p.kuerzeste !== null && p.kuerzeste >= KUERZESTE_MINDESTENS && p.kuerzeste <= (ordnung.zuege || 12) &&
    p.blindLinks !== 'gefangen' && p.blindRechts !== 'gefangen' && p.hinsehen === 'gefangen';
}

// --- ../prototyp/kontrolle/src/kern/auslosen.js
// Die Halte einer Schicht werden ausgelost, einer nach dem anderen. Innerhalb eines Halts gibt es keinen Zufall.
// Jeder Halt wird geprüft (pruefung.js): Wer nicht taugt, wird verworfen und neu gelost.
// Der Zufall kommt aus dem Zufallsmodul des Hauptspiels, sein Stand liegt im Zustand: gleicher Seed, gleiche Halte.
//
// Steigerung (Auftrag „Die Schicht"):
//   Halt 1 und 2: ein Platzwechsler. Halt 3: ein Scheinschläfer allein. Halt 4: ein Toilettengänger allein.
//   Ab Halt 5 gemischt, ab Halt 6 sitzen manchmal zwei im Wagen.
//   Die Zeit beginnt bei 14 Zügen und wird alle zwei Halte um einen knapper, bis 8 (einer weniger erlaubt). Nie weniger als der
//   kürzeste Weg, den die Suche findet, plus ein Zug. Und immer weniger, als blindes Durchkontrollieren
//   der Reihe nach braucht: Sonst ginge es auch ohne Hinsehen. Passt beides nicht, wird neu gelost.




const ALLE_SITZE = [];
for (let y = 1; y <= 6; y++) for (const x of [0, 1, 3, 4]) ALLE_SITZE.push({ x, y });
const FARBEN = ['a', 'b', 'c', 'd', 'e', 'f', 'g'];
const ZEICHEN_FUER = { platz: 'P', schein: 'H', wc: 'T' };
const MASCHEN = ['platz', 'schein', 'wc'];
const FAHRGAESTE_JE_HALT = 8;
const VERSUCHE_HOECHSTENS = 600;
const ZEIT_ANFANG = 14;
const ZEIT_ENDE = 8;

function zielZeit(halt) {
  return Math.max(ZEIT_ENDE, ZEIT_ANFANG - Math.floor(halt / 2));
}

function mische(z, liste) {
  const kopie = liste.slice();
  for (let i = kopie.length - 1; i > 0; i--) {
    const j = wuerfle(z, i + 1);
    const t = kopie[i];
    kopie[i] = kopie[j];
    kopie[j] = t;
  }
  return kopie;
}

// Welche Maschen in Halt Nummer halt (ab 0) sitzen
function maschenFuer(z, halt) {
  if (halt <= 1) return ['platz'];
  if (halt === 2) return ['schein'];
  if (halt === 3) return ['wc'];
  const erste = MASCHEN[wuerfle(z, 3)];
  if (halt >= 5 && wuerfle(z, 3) === 0) {
    const andere = MASCHEN.filter((m) => m !== erste);
    return [erste, andere[wuerfle(z, 2)]];
  }
  return [erste];
}

// Ein Halt ohne Prüfung und ohne Zeit
function roherHalt(z, maschen) {
  const plaetze = mische(z, ALLE_SITZE).slice(0, FAHRGAESTE_JE_HALT);
  const farben = mische(z, FARBEN);
  // Schlafende: einer, ohne Scheinschläfer manchmal zwei. So verrät die Zahl der Schlafenden nichts.
  const schlafende = maschen.includes('schein') ? 1 : 1 + wuerfle(z, 2);
  const zeilen = [];
  for (let y = 1; y <= 6; y++) zeilen.push(['.', '.', '|', '.', '.']);
  const ordnung = { farben: {}, sitze: null };
  let farbe = 0;
  plaetze.forEach((p, i) => {
    let c;
    if (i < maschen.length) {
      c = ZEICHEN_FUER[maschen[i]];
      if (c !== 'H') ordnung.farben[c] = farben[farbe++];
    } else if (i < maschen.length + schlafende) {
      c = 'Z';
    } else {
      c = farben[farbe++];
    }
    zeilen[p.y - 1][p.x] = c;
  });
  ordnung.sitze = zeilen.map((zeile) => zeile.join(''));
  return ordnung;
}

// Lost einen tauglichen Halt aus. z trägt den Zufallsstand.
function losHaltAus(z, halt) {
  const maschen = maschenFuer(z, halt);
  for (let i = 0; i < VERSUCHE_HOECHSTENS; i++) {
    const ordnung = roherHalt(z, maschen);
    ordnung.zuege = ZEIT_ANFANG + 1; // erst mit reichlich Zeit: Was ist der kürzeste Weg, was braucht man blind?
    const start = haltNach(ordnung);
    const weg = kuerzesterFang(start);
    if (!weg) continue;
    let blind = ZEIT_ANFANG + 1;
    for (const richtung of ['links', 'rechts']) {
      const b = durchkontrolliert(start, richtung);
      if (b.status === 'gefangen') blind = Math.min(blind, b.zug);
    }
    const zeit = Math.min(zielZeit(halt), blind - 1);
    if (zeit < weg.length + 1 || zeit < zielZeit(halt) - 1) continue; // höchstens einen Zug knapper als geplant
    ordnung.zuege = zeit;
    ordnung.maschen = maschen;
    if (haltTaugt(ordnung)) return ordnung;
  }
  return null; // kommt nicht vor (Test)
}

// --- ../prototyp/kontrolle/src/kern/durchgang.js
// Die Schicht: ein Halt nach dem anderen, jeder ausgelost (auslosen.js). Nach jedem Halt folgt sofort
// der nächste. Die Schicht endet, wenn drei Fahrgäste ohne Fahrkarte entkommen sind. Dann steht nur der
// Name der letzten erreichten Station da, und jede Eingabe beginnt sofort die nächste Schicht.
// Bei der allerersten Fahrt auf einem Gerät kommt davor der Lernhalt. Er zählt nicht mit.
//
// erzeugeKontrolle(seed, { lernhalt }) -> { zustand, act(handlung) }, act gibt Ereignisse zurück.
// Station Nummer n ist die, auf die der Zug in Halt n zufährt (ab 0). Erreicht ist sie, wenn der Halt endet.





const ENTKOMMEN_HOECHSTENS = 3;

function beginneHalt(z, nr) {
  z.halt = nr;
  setzeHalt(z, losHaltAus(z, nr));
}

function beginneSchicht(z) {
  z.entkommen = 0;
  z.schicht += 1;
  beginneHalt(z, 0);
}

function neueKontrolle(seed, optionen) {
  const lernhalt = !!(optionen && optionen.lernhalt);
  const z = { halt: 0, schicht: -1, entkommen: 0, status: 'faehrt', rest: 0, zug: 0, k: null, fahrgaeste: [], zufall: (seed || 0) >>> 0, lernhalt };
  if (lernhalt) setzeHalt(z, LERNHALT);
  else beginneSchicht(z);
  return z;
}

function kontrollZug(z, handlung) {
  if (z.status === 'faehrt') {
    const ereignisse = haltZug(z, handlung);
    if (z.status === 'faehrt' || !ereignisse.length) return ereignisse;
    if (z.lernhalt) {
      if (z.status === 'gefangen') ereignisse.push({ typ: 'gelernt' }); // gleich merken
      return ereignisse; // der Lernhalt wartet auf die nächste Eingabe
    }
    // der Halt ist zu Ende: Station erreicht, sofort der nächste oder das Ende der Schicht
    z.entkommen += z.entkommenImHalt;
    ereignisse.push({ typ: 'station', nr: z.halt, entkommen: z.entkommen });
    if (z.entkommen >= ENTKOMMEN_HOECHSTENS) {
      z.status = 'aus';
      ereignisse.push({ typ: 'aus', station: z.halt });
    } else {
      beginneHalt(z, z.halt + 1);
      ereignisse.push({ typ: 'neuerHalt', halt: z.halt });
    }
    return ereignisse;
  }
  const ereignisse = [];
  if (z.lernhalt) {
    if (z.status === 'gefangen') {
      z.lernhalt = false;
      beginneSchicht(z);
    } else {
      setzeHalt(z, LERNHALT); // die Zeit ist abgelaufen: einfach noch einmal
    }
    ereignisse.push({ typ: 'neuerHalt', halt: z.lernhalt ? -1 : 0 });
    return ereignisse;
  }
  // nach dem Ende der Schicht: jede Eingabe beginnt sofort die nächste
  beginneSchicht(z);
  ereignisse.push({ typ: 'neuerHalt', halt: 0 });
  return ereignisse;
}

function erzeugeKontrolle(seed, optionen) {
  const zustand = neueKontrolle(seed, optionen);
  return { zustand, act: (handlung) => kontrollZug(zustand, handlung) };
}

// --- ../prototyp/freier-platz/src/kern/abteil.js
// Wagen 7 als fester Plan: wo Gang, Sitze, Lampen und Fahrgäste sind.
// Kennt weder Bildschirm noch Browser. Nichts hier hängt vom Zufall ab.
//
//        Spalte  0  1  2  3  4
//   Reihe 0      #  #  Z  #  #     Z = Zieltür, # = Wand
//   Reihe 1      s  s  .  s  s     s = Sitz, . = Gang
//   Reihe 2      s  s  .  F  s     F = schlafender Fahrgast, Lampe B
//   Reihe 3      s  s  .  s  s
//   Reihe 4      s  s  .  s  s
//   Reihe 5      T  S  .  s  s     S = Spieler, T = Tasche, Lampe A
//   Reihe 6      s  s  .  s  P     P = wacher Fahrgast
//   Reihe 7      #  #  K  #  #     K = Schaffner am Anfang

const SPALTEN = 5;
const REIHEN = 8;
const GANGSPALTE = 2;

const ZIELTUER = { x: 2, y: 0 };
const SCHAFFNERSTART = { x: 2, y: 7 };
const SPIELERPLATZ = { x: 1, y: 5 };
const TASCHENPLATZ = { x: 0, y: 5 };
const SCHLAEFERPLATZ = { x: 3, y: 2 };
const WACHERPLATZ = { x: 4, y: 6 };

const SCHRITTE = {
  hoch: { x: 0, y: -1 },
  rechts: { x: 1, y: 0 },
  runter: { x: 0, y: 1 },
  links: { x: -1, y: 0 },
};
const GEGENUEBER = { hoch: 'runter', rechts: 'links', runter: 'hoch', links: 'rechts' };

// Nur an zwei Sitzpaaren brennt eine Leselampe. Stellung "fenster": Das Licht fällt vom Gang
// zum Fenster. Stellung "gang": Es fällt vom Fenster zum Gang.
const LAMPEN = {
  A: { reihe: 5, gangplatz: 1, fensterplatz: 0 },
  B: { reihe: 2, gangplatz: 3, fensterplatz: 4 },
};
const LAMPENNAMEN = ['A', 'B'];

function istGang(x, y) {
  return x === GANGSPALTE && y >= 0 && y < REIHEN;
}

function istSitz(x, y) {
  return x >= 0 && x < SPALTEN && x !== GANGSPALTE && y >= 1 && y <= REIHEN - 2;
}

// Abstand für "in Reichweite": ein Feld weit, auch schräg
function reichweite(a, b) {
  return Math.max(Math.abs(a.x - b.x), Math.abs(a.y - b.y));
}

// --- ../prototyp/freier-platz/src/kern/licht.js
// Licht und Schatten. Die eine unwirkliche Regel des Wagens steckt in falschBelegt():
// Für den Schaffner belegt auch ein Schatten einen Platz.



// Alle, die gerade sitzen, von links nach rechts ist egal. Der Spieler nur, wenn er auf einem Sitz ist.
function sitzende(z) {
  const liste = [];
  if (istSitz(z.spieler.x, z.spieler.y)) {
    liste.push({ wer: 'spieler', x: z.spieler.x, y: z.spieler.y, wach: true, gelocht: z.spieler.gelocht });
  }
  liste.push({ wer: 'schlaefer', x: SCHLAEFERPLATZ.x, y: SCHLAEFERPLATZ.y, wach: z.schlaefer.wach, gelocht: z.schlaefer.gelocht });
  liste.push({ wer: 'wacher', x: WACHERPLATZ.x, y: WACHERPLATZ.y, wach: true, gelocht: z.wacher.gelocht });
  return liste;
}

function sitztJemand(z, x, y) {
  return sitzende(z).some((f) => f.x === x && f.y === y);
}

function liegtTasche(z, x, y) {
  return z.tasche && x === TASCHENPLATZ.x && y === TASCHENPLATZ.y;
}

// In welche Richtung das Licht einer Lampe fällt: -1 nach links, +1 nach rechts
function lichtrichtung(name, stellung) {
  const zumFenster = Math.sign(LAMPEN[name].fensterplatz - LAMPEN[name].gangplatz);
  return stellung === 'fenster' ? zumFenster : -zumFenster;
}

// Wer in einem beleuchteten Paar sitzt, wirft seinen Schatten ein Feld weiter in Lichtrichtung:
// auf den Nachbarsitz, auf das Gangfeld oder an die Wand (dann liegt er auf keinem Feld).
function bestimmeSchatten(z) {
  const liste = [];
  for (const name of LAMPENNAMEN) {
    const lampe = LAMPEN[name];
    const richtung = lichtrichtung(name, z.lampen[name]);
    for (const figur of sitzende(z)) {
      if (figur.y !== lampe.reihe || (figur.x !== lampe.gangplatz && figur.x !== lampe.fensterplatz)) continue;
      const x = figur.x + richtung;
      liste.push({ von: figur.wer, lampe: name, x, y: lampe.reihe, wand: x < 0 || x >= SPALTEN });
    }
  }
  return liste;
}

// Sitze einer Reihe, auf denen niemand sitzt, auf denen aber eine Tasche oder ein Schatten liegt.
// Die Tasche steht vor dem Schatten: Auf sie zeigt der Schaffner zuerst.
function falschBelegt(z, reihe) {
  const funde = [];
  if (z.tasche && TASCHENPLATZ.y === reihe && !sitztJemand(z, TASCHENPLATZ.x, TASCHENPLATZ.y)) {
    funde.push({ x: TASCHENPLATZ.x, y: TASCHENPLATZ.y, was: 'tasche' });
  }
  for (const s of z.schatten) {
    if (s.wand || s.y !== reihe || !istSitz(s.x, s.y) || sitztJemand(z, s.x, s.y)) continue;
    funde.push({ x: s.x, y: s.y, was: 'schatten' });
  }
  return funde;
}

const ZEICHENBREITE = 6; // fünf Punkte und eine Lücke
const ZEILENHOEHE = 9; // sieben Punkte und zwei für Unterlängen

const MUSTER = {};
for (const [zeichen, bild] of Object.entries(ZEICHEN)) MUSTER[zeichen] = bild.split(' ');

function hatZeichen(zeichen) {
  return MUSTER[zeichen] !== undefined;
}

// Breite eines Texts in Punkten, ohne die Lücke nach dem letzten Zeichen
function textBreite(text) {
  return Math.max(0, [...text].length * ZEICHENBREITE - 1);
}

// Ein Punktfeld: spalten mal zeilen, jeder Punkt an oder aus.
function neuesPunktfeld(spalten, zeilen) {
  return { spalten, zeilen, an: new Uint8Array(spalten * zeilen) };
}

function schreibe(feld, text, spalte, zeile) {
  let x = spalte;
  for (const zeichen of text) {
    const muster = MUSTER[zeichen] || MUSTER['?'];
    for (let r = 0; r < muster.length; r++) {
      for (let c = 0; c < 5; c++) {
        const px = x + c;
        const py = zeile + r;
        if (muster[r][c] === '#' && px >= 0 && px < feld.spalten && py >= 0 && py < feld.zeilen) {
          feld.an[py * feld.spalten + px] = 1;
        }
      }
    }
    x += ZEICHENBREITE;
  }
}

function schreibeMittig(feld, text, zeile) {
  schreibe(feld, text, Math.round((feld.spalten - textBreite(text)) / 2), zeile);
}

// Zeichnet das Punktfeld. raster ist der Abstand der Punkte in Pixeln.
// dunkel ist die Farbe der unbeleuchteten Punkte, null lässt sie weg.
function zeichnePunktfeld(stift, feld, x, y, raster, hell, dunkel) {
  const r = raster * 0.38;
  for (const durchgang of dunkel ? [0, 1] : [1]) {
    stift.fillStyle = durchgang ? hell : dunkel;
    stift.beginPath();
    for (let py = 0; py < feld.zeilen; py++) {
      for (let px = 0; px < feld.spalten; px++) {
        if (feld.an[py * feld.spalten + px] !== durchgang) continue;
        const cx = x + (px + 0.5) * raster;
        const cy = y + (py + 0.5) * raster;
        stift.moveTo(cx + r, cy);
        stift.arc(cx, cy, r, 0, Math.PI * 2);
      }
    }
    stift.fill();
  }
}

// Setzt Werte in die Platzhalter eines Texts ein.
function setzeEin(text, werte) {

}
